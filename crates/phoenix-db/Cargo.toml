[package]
name = "phoenix-db"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "SQLite persistence for Phoenix IDE: conversations, messages, steering queues, and schema migrations. Core-only — no axum/HTTP glue."

[lib]
path = "src/lib.rs"

[features]
# Exposes the `create_conversation` explore-mode test wrapper (otherwise
# `#[cfg(test)]`-only) to downstream crates' test builds. A `#[cfg(test)]`
# item is invisible across a crate boundary, so dependents that seed
# conversations in their own tests enable this feature via dev-dependencies.
# Off in production builds.
test-support = []

[dependencies]
# Shared domain vocabulary (persisted schema types, ConvState, ContentBlock,
# LlmLanguage, Priority, the task-approval handoff parcel, …).
phoenix-core = { path = "../phoenix-core" }
phoenix-workflow = { path = "../phoenix-workflow" }

# Database
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
libsqlite3-sys = { version = "0.37", features = ["bundled"] }

# Serialization (JSON-in-TEXT columns + derives on persisted row types)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Row/PK identifiers
uuid = { version = "1", features = ["v4"] }

# Random suffix for slug-collision disambiguation
rand = "0.10"

# Error types
thiserror = "2"

tracing = "0.1"

# Async trait objects for the MessageRetriever seam (Arc<dyn MessageRetriever>).
async-trait = "0.1"

[dev-dependencies]
# Re-declared with test-support so phoenix-core's #[cfg(test)] domain
# constructors (ContentBlock::tool_use, …) are visible when this crate's own
# tests are built in isolation (`cargo test -p phoenix-db`), not only when
# workspace feature unification happens to pull the feature in via phoenix-ide.
# Dev-only: production `cargo build` never enables it.
phoenix-core = { path = "../phoenix-core", features = ["test-support"] }

# `#[tokio::test]` runtime for the async persistence tests.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[lints]
workspace = true
