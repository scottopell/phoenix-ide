[package]
name = "phoenix_ide"
version = "0.13.2-rc.3"
edition = "2021"
rust-version = "1.95"

[features]
default = []
datadog-tracing = ["dep:datadog-opentelemetry"]

[dependencies]
# Shared domain vocabulary (acyclic base crate)
phoenix-core = { workspace = true }

# LLM provider abstraction (LlmService trait, Anthropic/OpenAI/codex/mock
# providers, model registry, credential + gateway resolution, SSE parsing).
# Extracted so provider churn no longer recompiles the api/runtime layers.
phoenix-llm = { workspace = true }

# PTY-backed terminal sessions (spawn, relay, command tracking, session
# registry). The axum/WebSocket glue lives here in `api::terminal_ws`, not in
# the library crate, to keep phoenix-terminal acyclic.
phoenix-terminal = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Web framework
axum = { workspace = true, features = ["macros", "ws", "multipart"] }
hyper-util = { workspace = true, features = ["server-auto", "server-graceful", "service", "tokio"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types = { workspace = true }
tokio-rustls = { workspace = true, features = ["aws_lc_rs", "tls12"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "fs", "compression-br", "compression-gzip", "trace"] }

# Local TLS CA + leaf-cert issuance (separate workspace member to keep
# `phoenix-tls`'s cold-compile cost off `phoenix-tls` itself).
phoenix-tls = { workspace = true }

# Skill discovery, metadata, and invocation. Extracted so the
# `phoenix-tools` crate can call it without depending on phoenix-ide.
phoenix-skills = { workspace = true }

# Named-agent discovery (.claude/agents, .agents/agents) for the spawn-time
# agent_type resolution and persona composition.
phoenix-agents = { workspace = true }
phoenix-browser = { workspace = true }

# Tool implementations (bash, patch, browser, tmux, search, …). The Tool
# trait, ToolContext, and ToolRegistry live here. The axum/HTTP glue that
# drives tools (api::handlers, api::browser_view) stays in phoenix-ide.
phoenix-tools = { workspace = true }

# SQLite persistence (conversations, messages, steering queues, migrations).
# Extracted so the persistence layer is a leaf depending only on phoenix-core.
phoenix-db = { workspace = true }
phoenix-svg = { workspace = true }

# Pure conversation reducer (Elm-architecture state machine). Extracted so the
# runtime/executor depend *down* onto the reducer + shared domain vocabulary.
phoenix-state-machine = { workspace = true }
phoenix-workflow = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true, features = ["uuid1"] }

# Database
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }

# HTTP client
reqwest = { workspace = true, features = ["json", "stream", "rustls"] }

# Socket configuration
socket2 = { workspace = true }

# Enumerate host interface addresses to decide whether a request originates on
# the server host (gates host-local file-manager reveal — see api/local_reveal.rs).
if-addrs = { workspace = true }

# Cross-platform (macOS + Linux) process/system resource sampling for the
# About-this-deployment endpoint (specs/deployment-info/).
sysinfo = { workspace = true }

# Async utilities
async-trait = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true }

# Static file embedding
# `compression` (include-flate/DEFLATE) stores embedded UI assets compressed
# in the binary and transparently inflates them on `.data` access. Shrinks the
# release binary by ~15MB with no functional change — debug builds still serve
# from the filesystem (no `debug-embed`), so this only affects release embeds.
rust-embed = { workspace = true, features = ["compression"] }
mime_guess = { workspace = true }

# Utilities
percent-encoding = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "serde"] }
chrono-tz = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
flate2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
# Non-blocking file writer for the optional PHOENIX_LOG_FILE sink. The worker
# thread + WorkerGuard keep log I/O off the async runtime (specs/deployment-info/).
tracing-appender = { workspace = true }

# Trace export: `tracing-opentelemetry` bridges Phoenix `tracing` spans into
# OpenTelemetry, then logging.rs selects exactly one exporter at startup.
# `datadog-opentelemetry` sends Datadog native v0.4 trace payloads over HTTP.
# `opentelemetry-otlp` is compiled for OTLP HTTP/protobuf with its blocking
# HTTP client: the OTel batch processor exports from its own worker thread,
# where async hyper/reqwest clients have no Tokio reactor. This avoids OTLP
# gRPC transport; upstream proto messages still depend on tonic codegen types.
# Version pinning: published datadog-opentelemetry 0.4 uses opentelemetry 0.31,
# so tracing-opentelemetry must be 0.32 (not 0.33, which needs otel 0.32).
datadog-opentelemetry = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true, features = ["trace", "http-proto", "reqwest-blocking-client"] }
base64 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
fs2 = { workspace = true }
# Process management and PTY
nix = { workspace = true, features = ["signal", "process", "term", "fs"] }
libc = { workspace = true }

# Gitignore-aware directory walking (for file search)
ignore = { workspace = true }

# Temp dirs for materializing a branch ref's SKILL.md files during GitTree
# skill discovery (resolution_root); also used across tests.
tempfile = { workspace = true }

# Markdown event-stream parser. Used to mask code regions during inline-
# reference tokenization so `@`/`/` sigils inside fenced/inline/indented
# code blocks don't get expanded as file or skill references.
pulldown-cmark = { workspace = true }

taskmd-core = { workspace = true }
listenfd = { workspace = true }
nucleo-matcher = { workspace = true }

# Locating tmux on PATH at registry init (specs/tmux-integration/REQ-TMUX-003).
which = { workspace = true }

# Rust -> TypeScript type codegen for the SSE wire format.
# Used by the `export_sse_types` test in `src/api/wire.rs` to (re)generate
# `ui/src/generated/sse.ts` on every `cargo test` run. CI guards staleness
# via `git diff --exit-code ui/src/generated/` in `./dev.py check`.
ts-rs = { workspace = true, features = ["serde-compat", "chrono-impl"] }

[dev-dependencies]
# Re-declared with test-support so phoenix-core's #[cfg(test)] domain
# constructors (ContentBlock::tool_use, …) are visible to this crate's tests.
# Dev-only: production `cargo build` never enables the feature.
phoenix-core = { workspace = true, features = ["test-support"] }
# Re-declared with test-support so phoenix-llm's #[cfg(test)] registry
# constructors (ModelRegistry::new_empty, for_test_with_sonnet) are visible to
# this crate's runtime/api/chain tests. Dev-only.
phoenix-llm = { workspace = true, features = ["test-support"] }
# Re-declared with test-support so phoenix-terminal's #[cfg(test)] ANSI/OSC
# stream builders (full_command, TerminalStream) are visible to the api-layer
# WebSocket relay tests. Dev-only.
phoenix-terminal = { workspace = true, features = ["test-support"] }
# Re-declared with test-support so phoenix-db's #[cfg(test)] `create_conversation`
# explore-mode test wrapper is visible to this crate's tests. Dev-only.
phoenix-db = { workspace = true, features = ["test-support"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "trace"] }
prost = { workspace = true }
# Re-declared with test-support so runtime tests can drive the in-memory
# tmux backend (`phoenix_tools::tmux::fake_backend`).
phoenix-tools = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
rcgen = { workspace = true, features = ["pem", "aws_lc_rs"] }
# `test-util` enables `tokio::time::pause`/`advance`, used by the
# bounded-shutdown drain tests to exercise the SHUTDOWN_GRACE timeout
# without waiting the full real-time deadline. `full` does not include it.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
