[package]
name = "phoenix_ide"
version = "0.7.0"
edition = "2021"
rust-version = "1.94"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["macros", "ws"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "service", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "compression-br", "compression-gzip", "trace"] }

# Local TLS CA + leaf-cert issuance (separate workspace member to keep
# `phoenix-tls`'s cold-compile cost off `phoenix-tls` itself).
phoenix-tls = { path = "../phoenix-tls" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Socket configuration
socket2 = "0.6"

# Async utilities
async-trait = "0.1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"

# Static file embedding
rust-embed = "8"
mime_guess = "2"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
base64 = "0.22"
sha2 = "0.11"
rand = "0.10"
similar = "3"  # For generating diffs

# Process management
# Process management and PTY
nix = { version = "0.31", features = ["signal", "process", "term", "fs"] }
libc = "0.2"

# OSC 133 parsing for CommandTracker (REQ-TERM-021)
vte = "0.15"

# Gitignore-aware directory walking (for file search)
ignore = "0.4"

# Glob matching for search tool's include/exclude params
globset = "0.4"

# Regex for search tool
regex = "1"

# Markdown event-stream parser. Used to mask code regions during inline-
# reference tokenization so `@`/`/` sigils inside fenced/inline/indented
# code blocks don't get expanded as file or skill references.
pulldown-cmark = { version = "0.13", default-features = false }

# Browser automation
chromiumoxide = { version = "0.9", default-features = false, features = ["fetcher", "rustls", "zip0"] }
brush-parser = "0.4"
taskmd-core = ">=1.1,<2"
listenfd = "1.0.2"
nucleo-matcher = "0.3.1"

unicode-security = "0.1.2"

# Locating tmux on PATH at registry init (specs/tmux-integration/REQ-TMUX-003).
# Aligned with the `which 8` already pulled in transitively via chromiumoxide
# to avoid duplicate-major-version build cost.
which = "8"

# Rust -> TypeScript type codegen for the SSE wire format.
# Used by the `export_sse_types` test in `src/api/wire.rs` to (re)generate
# `ui/src/generated/sse.ts` on every `cargo test` run. CI guards staleness
# via `git diff --exit-code ui/src/generated/` in `./dev.py check`.
ts-rs = { version = "12", features = ["serde-compat", "chrono-impl"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
# `test-util` enables `tokio::time::pause`/`advance`, used by the
# bounded-shutdown drain tests to exercise the SHUTDOWN_GRACE timeout
# without waiting the full real-time deadline. `full` does not include it.
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
