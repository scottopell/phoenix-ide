[package]
name = "phoenix-monitor"
version = "0.8.0"
edition = "2021"
rust-version = "1.94"
description = "Phoenix IDE production monitor — TUI dashboard + headless CLI."

[[bin]]
name = "phoenix-monitor"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
rusqlite = "0.39"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[lints]
workspace = true
