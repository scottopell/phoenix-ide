[package]
name = "phoenix-agents"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "User-configured named workers and execution tiers for Phoenix IDE."

[lib]
path = "src/lib.rs"

[dependencies]
phoenix-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
