[package]
name = "phoenix-agents"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "User-configured named workers and execution tiers for Phoenix IDE."

[lib]
path = "src/lib.rs"

[dependencies]
phoenix-core = { path = "../phoenix-core" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
