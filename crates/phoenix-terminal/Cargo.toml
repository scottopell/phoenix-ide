[package]
name = "phoenix-terminal"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "PTY-backed terminal sessions for Phoenix IDE: spawn, relay, command tracking, and the per-WorkScope session registry. Terminal-core only — no axum/HTTP glue."

[lib]
path = "src/lib.rs"

[features]
# Exposes the ANSI/OSC test-stream builders and `full_command` helper
# (`#[cfg(test)]` only) to downstream crates' test builds. A `#[cfg(test)]`
# item is invisible across a crate boundary, so dependents that drive the
# CommandTracker in their own tests enable this feature via dev-dependencies.
# Off in production builds.
test-support = []

[dependencies]
# Shared domain vocabulary (WorkScope keys the session registry).
phoenix-core = { workspace = true }

# Async runtime + PTY readiness (AsyncFd is epoll-backed).
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }

# Async utilities for the WS<->PTY relay.
futures = { workspace = true }

# PTY / process management.
nix = { workspace = true, features = ["signal", "process", "term", "fs"] }
libc = { workspace = true }

# OSC 133 parsing for CommandTracker (REQ-TERM-021).
vte = { workspace = true }

tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
proptest = { workspace = true }
# `rt-multi-thread` supports #[tokio::test] and Runtime::new() in this crate's tests.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
