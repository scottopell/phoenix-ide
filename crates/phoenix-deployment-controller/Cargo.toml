[package]
name = "phoenix-deployment-controller"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Standalone Phoenix deployment orchestration and durable controller state"

[lib]
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.39", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[lints]
workspace = true
