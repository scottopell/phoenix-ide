[package]
name = "phoenix-llm"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "LLM provider abstraction for Phoenix IDE: the LlmService trait plus Anthropic, OpenAI, codex-bridge, and mock providers, the model registry, credential/base URL resolution, and SSE stream parsing. Depends only on phoenix-core — no axum/HTTP handler glue beyond the self-contained codex OAuth callback server."

[lib]
path = "src/lib.rs"

[features]
# Exposes the registry's test-only constructors (new_empty,
# for_test_with_sonnet) across the crate boundary. A `#[cfg(test)]` item is
# invisible to a downstream crate's tests; this feature makes them visible to
# phoenix-ide's integration-flavoured tests without leaking into production.
test-support = []

[dependencies]
# Shared domain vocabulary: ContentBlock/Usage (llm_types), runtime env probe,
# retry/quota policy, and the persisted error-kind schema.
phoenix-core = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true, features = ["sync"] }

# Loopback OAuth callback server for the ChatGPT/codex login flow
# (llm/codex_login). Self-contained — not wired into the phoenix-ide router.
axum = { workspace = true, features = ["ws"] }

# HTTP client for provider requests + SSE streaming
reqwest = { workspace = true, features = ["json", "stream", "rustls"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Async utilities
async-trait = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }

# Utilities
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["serde", "v4"] }
httpdate = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# test-support exposes phoenix-core's #[cfg(test)] constructors
# (PhoenixRuntimeEnvironment::with_root, ContentBlock::tool_use, …) across the
# crate boundary. Dev-only: production builds never enable the feature.
phoenix-core = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
