[package]
name = "phoenix-tls"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Local TLS certificate authority and leaf-cert issuance for Phoenix IDE."

[lib]
path = "src/lib.rs"

[[bin]]
name = "phoenix-tls"
path = "src/main.rs"

[dependencies]
rcgen = { workspace = true, features = ["pem", "aws_lc_rs", "x509-parser"] }
time = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
