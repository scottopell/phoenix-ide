[package]
name = "phoenix-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "MCP (Model Context Protocol) client engine for Phoenix IDE: the JSON-RPC protocol layer, stdio and Streamable HTTP transports, OAuth (DCR, PKCE), and the multi-server client manager. Transport-agnostic and Tool-trait-free — the thin `Tool` wrapper lives in phoenix-tools."

[lib]
path = "src/lib.rs"

[dependencies]
# Runtime-environment detection (config/data dir resolution for server configs
# and the OAuth token/registration store).
phoenix-core = { workspace = true }

# Async transport trait (`McpTransport`, `ServerMessageSink`).
async-trait = { workspace = true }

# Async runtime (subprocess stdio, locks, timeouts, the callback listener).
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }

# Streaming combinators for the HTTP SSE response body.
futures = { workspace = true }

# HTTP client for the MCP Streamable HTTP transport (specs/mcp/); `form`
# carries the OAuth token-endpoint grants (application/x-www-form-urlencoded).
reqwest = { workspace = true, features = ["json", "form", "stream", "rustls"] }
rustls = { workspace = true, features = ["std"] }
httpdate = { workspace = true }

# Serialization (JSON-RPC messages, server configs, OAuth records).
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Timestamps on OAuth token/registration records.
chrono = { workspace = true, features = ["serde"] }

# PKCE verifier/challenge and state-parameter encoding.
base64 = { workspace = true }
sha2 = { workspace = true }

# Random session/state identifiers.
uuid = { workspace = true, features = ["v4"] }

tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
futures = { workspace = true }
# test-util enables tokio::time::{pause, advance} for the deterministic
# timer/ordering tests in the protocol and lifecycle suites.
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
