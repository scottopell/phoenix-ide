[package]
name = "phoenix-state-machine"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Pure conversation state machine for Phoenix IDE: Elm-architecture reducer over the shared domain vocabulary. Two pure entry points (transition, handle_outcome) plus effect/outcome types. No I/O, HTTP, or persistence glue."

[lib]
path = "src/lib.rs"

[dependencies]
# Shared domain vocabulary (ConvState, Event, ContentBlock, db schema types,
# BashToolInput, QuotaDetails, LlmLanguage, Priority, …) — the reducer depends
# *down* onto this base crate.
phoenix-core = { workspace = true }

# `cd`-prefix stripping for bash command display data (effect.rs).
phoenix-bash-display = { workspace = true }

# Serialization for JSON-valued tool inputs / display data.
serde_json = { workspace = true }

# Timestamps on persisted messages and outcomes.
chrono = { workspace = true, features = ["serde"] }

# TransitionError and friends.
thiserror = { workspace = true }

# Server-generated message identifiers for synthesized messages.
uuid = { workspace = true, features = ["v4"] }

# Structured diagnostics from the reducer.
tracing = { workspace = true }

# Task status/priority constants for the propose-task acceptance gate.
taskmd-core = { workspace = true }

[dev-dependencies]
# Re-declared with test-support so phoenix-core's #[cfg(test)] domain
# constructors (ContentBlock::tool_use, …) are visible when this crate's own
# tests are built in isolation (`cargo test -p phoenix-state-machine`), not
# only when workspace feature unification happens to pull the feature in via
# phoenix-ide. Dev-only: production `cargo build` never enables it.
phoenix-core = { workspace = true, features = ["test-support"] }

# Property-based tests for the reducer's invariants.
proptest = { workspace = true }

# Deterministic RNG for the project proptest harness.
rand = { workspace = true }

# Temporary task-file fixtures for the propose-task acceptance tests.
tempfile = { workspace = true }

[lints]
workspace = true
