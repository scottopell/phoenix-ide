[package]
name = "phoenix-drive-turn"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false
description = "One-shot production Phoenix conversation runtime driver"

[[bin]]
name = "drive-turn"
path = "src/main.rs"

[dependencies]
phoenix_ide = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

[lints]
workspace = true
