[package]
name = "phoenix-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Tool implementations for Phoenix IDE: bash, patch, browser, tmux, search, keyword search, skills, and sub-agent coordination. The Tool trait, ToolContext, and ToolRegistry live here. Core-only — no axum/HTTP glue."

[lib]
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
phoenix-svg = { workspace = true }
# Shared domain vocabulary (llm_types, bash_types, tool_wire), the narrow
# LlmSelector/CompletionService capability traits, WorkScope, and TaskSource.
phoenix-core = { workspace = true }

# Terminal-core (ActiveTerminals, ShellIntegrationStatus) for the
# terminal-command tools.
phoenix-terminal = { workspace = true }

# Skill discovery + invocation for the `skill` tool.
phoenix-skills = { workspace = true }

# Named-agent discovery for the `spawn_agents` agent_type enum.
phoenix-agents = { workspace = true }

# Bash command display simplification (cd-prefix stripping for UI).
phoenix-bash-display = { workspace = true }

# MCP client engine (protocol, transports, OAuth, McpClientManager). The thin
# `Tool`-trait wrapper over it lives in `src/mcp.rs`.
phoenix-mcp = { workspace = true }

# Headless-browser engine (chromiumoxide/CDP driver, session manager,
# screencast broker). The browser_* tool impls here wrap this engine.
phoenix-browser = { workspace = true }

# Async tool trait.
async-trait = { workspace = true }

# Async runtime (process spawning, PTY, locks, cancellation).
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "sync", "time", "macros"] }
tokio-util = { workspace = true }
futures = { workspace = true }

# Serialization (tool inputs/outputs are JSON).
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Wall-clock timestamps for the work-scope inventory projection
# (Handle.started_at: SystemTime -> DateTime<Utc> on the wire).
chrono = { workspace = true, features = ["serde"] }
chrono-tz = { workspace = true }

# Chrome DevTools Protocol types used by the browser tool glue (CDP param
# structs passed to the engine's page handle). The engine itself lives in
# phoenix-browser.
chromiumoxide = { workspace = true, features = ["fetcher", "rustls", "zip0"] }

# Static-analysis bash parser for bash_check.
brush-parser = { workspace = true }

# Gitignore-aware directory walking + glob/regex matching for search.
ignore = { workspace = true }
globset = { workspace = true }
regex = { workspace = true }

# Diff generation for patch.
similar = { workspace = true }

# Confusable/homoglyph detection.
unicode-security = { workspace = true }

# Base64 (image payloads, screencast frames).
base64 = { workspace = true }

# Hashing (deterministic socket/session keying).
sha2 = { workspace = true }
hex = { workspace = true }

# UUIDs for browser scratch-file paths.
uuid = { workspace = true, features = ["v4"] }

# Locating tmux on PATH at registry init.
which = { workspace = true }

# Process-group / signal management for bash.
libc = { workspace = true }
fs2 = { workspace = true }
nono = { workspace = true }

# Typed errors.
thiserror = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
futures = { workspace = true }
# test-util enables tokio::time::{pause, advance} and #[tokio::test(start_paused)]
# for deterministic timer tests (e.g. the bash reader idle-flush timeout).
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "rt", "rt-multi-thread", "sync", "time", "macros", "test-util"] }

[lints]
workspace = true
