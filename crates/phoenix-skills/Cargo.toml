[package]
name = "phoenix-skills"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Skill discovery, metadata, and invocation for Phoenix IDE: filesystem and built-in skills, frontmatter parsing, and argument substitution. Core-only — no axum/HTTP glue."

[lib]
path = "src/lib.rs"

[dependencies]
# Shared domain vocabulary (`SkillInvocation`) and `LlmLanguage`.
phoenix-core = { workspace = true }

# Built-in skills are embedded into the binary and extracted to disk.
rust-embed = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
