[package]
name = "phoenix-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Shared domain vocabulary for Phoenix IDE: serializable types with no business logic. The acyclic base every other phoenix-ide crate depends on."

[lib]
path = "src/lib.rs"

[features]
# Exposes `#[cfg(test)]` domain constructors (e.g. ContentBlock::tool_use) to
# downstream crates' test builds. A `#[cfg(test)]` item is invisible across a
# crate boundary, so dependents that need these helpers in their own tests
# enable this feature via dev-dependencies. Off in production builds.
test-support = []

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { workspace = true, features = ["uuid1"] }
sha2 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
chrono-tz = { workspace = true }
taskmd-core = { workspace = true }
ts-rs = { workspace = true, features = ["serde-compat", "chrono-impl"] }
libc = { workspace = true }
nono = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }
url = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rustls-pki-types = { workspace = true }
rustls = { workspace = true, features = ["default"] }
x509-parser = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
phoenix-tls = { workspace = true }
rcgen = { workspace = true, features = ["pem", "aws_lc_rs"] }

[lints]
workspace = true
