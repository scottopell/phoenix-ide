[package]
name = "phoenix-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Shared domain vocabulary for Phoenix IDE: serializable types with no business logic. The acyclic base every other phoenix-ide crate depends on."

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
taskmd-core = ">=1.1,<2"

[lints]
workspace = true
