[package]
name = "phoenix-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Shared domain vocabulary for Phoenix IDE: serializable types with no business logic. The acyclic base every other phoenix-ide crate depends on."

[lib]
path = "src/lib.rs"

[features]
# Exposes `#[cfg(test)]` domain constructors (e.g. ContentBlock::tool_use) to
# downstream crates' test builds. A `#[cfg(test)]` item is invisible across a
# crate boundary, so dependents that need these helpers in their own tests
# enable this feature via dev-dependencies. Off in production builds.
test-support = []

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
taskmd-core = ">=1.1,<2"
ts-rs = { version = "12", features = ["serde-compat", "chrono-impl"] }
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"

[lints]
workspace = true
