[package]
name = "phoenix-browser"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Headless-browser engine for Phoenix IDE: the chromiumoxide/CDP driver, per-WorkScope session manager, console/profiling capture, and live-view screencast broker. Tool-free — the Tool-trait glue lives in phoenix-tools."

[lib]
path = "src/lib.rs"

[dependencies]
# WorkScope (session keying) and PhoenixRuntimeEnvironment (Chrome cache dir).
phoenix-core = { workspace = true }

# Browser automation via Chrome DevTools Protocol.
async-tungstenite = { workspace = true, features = ["handshake", "tokio-runtime"] }
chromiumoxide = { workspace = true, features = ["fetcher", "rustls", "zip0"] }

# Async runtime (CDP event pumps, broadcast channels, locks).
tokio = { workspace = true, features = ["full"] }

# Serialization (console entries, profiling state, screencast events).
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
url = { workspace = true }

# CDP event-stream combinators (StreamExt) and BoxFuture for the liveness hook.
futures = { workspace = true }

# Base64 (screencast frame payloads).
base64 = { workspace = true }

# Hashing (deterministic user-data-dir keying off WorkScope::stable_key).
sha2 = { workspace = true }

# Typed errors.
thiserror = { workspace = true }

tracing = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
phoenix-core = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true
