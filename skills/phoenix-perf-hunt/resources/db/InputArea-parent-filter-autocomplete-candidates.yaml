reason: |
  REJECTED by the shared Phoenix perf gate. The same browser_profile fingerprint
  was run against the parent commit and the candidate commit with no methodology
  warnings. The first controlled A/B showed statistically significant regression
  in react_actual_ms, script_ms, wall_ms, and long_tasks. A repeat optimized run
  was bimodal/noisy and did not produce any threshold-clearing significant win.
  Per the skill contract, theoretical duplicate-work removal is not sufficient;
  the raw samples do not support merging this as an optimization.
lessons: |
  Filtering autocomplete candidates in the parent and passing the filtered list
  to the dropdown looks structurally cheaper, but it does not improve the
  measured composer autocomplete-open scenario. Do not retry this technique
  without a new angle that explains and controls the bimodal React/browser work
  observed in the scenario. Treat previous no-reset measurements as invalid for
  claims; controlled reset + stats are required.
