reason: |
  REJECTED by the shared Phoenix perf gate. The rAF-coalesced textarea
  auto-resize change did not reduce React commits and significantly regressed
  react_actual_ms and wall_ms on the same composer-typing fingerprint. The
  optimization likely delayed resize work into additional frames rather than
  removing work from the controlled-input hot path.
lessons: |
  Do not rAF-coalesce InputArea's draft-driven auto-resize effect for the
  composer-typing scenario. The immediate layout read/write is not the measured
  bottleneck; adding a scheduled frame can make the burst slower. A future angle
  would need direct DOM/layout instrumentation that proves auto-resize itself is
  hot before changing this path again.
