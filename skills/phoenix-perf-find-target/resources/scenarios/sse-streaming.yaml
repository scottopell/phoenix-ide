# Scenario: SSE token streaming into the conversation view.
# Driven by skills/phoenix-perf-shared/scripts/run-scenario (agent-browser).
#
# Exercises the per-frame hot path: SSE token -> atom reducer -> streamingBuffer
# -> StreamingMessage re-render + FULL markdown re-parse per rAF
# (StreamingMessage.tsx:62, displayText = whole accumulated buffer).
#
# DETERMINISM: driven by the Mock LLM provider (not a live API). The prompt
# carries `[[perf:N]]` -> mock.rs streams exactly N deterministic words at a
# fixed cadence. Same N => byte-identical stream every run.
#
# PER-RUN STATE ISOLATION (the reset block): every run gets a BRAND-NEW mock
# conversation (no cross-run history accumulation) and a HARD document load
# (React mounts fresh + identically every run). Probes reset AFTER app-ready,
# so the React mount and the tiny seed response are excluded from the
# measured window identically on every run. Without this the samples are
# bimodal/incoherent and the harness is not a valid instrument.
#
# METRICS: react_commit_count / react_commit_ms are the live signal (React
# DevTools hook present under Vite). script_ms only trips on >50ms longtasks.
# Do NOT gate on wall_ms — mock's fixed cadence dominates wall time.
#
# SCALING: run at several `words` (e.g. 200/800/1800). reparse-growing-buffer
# predicts react_commit_ms grows super-linearly in `words`; a bounded buffer
# would grow ~linearly. A coherent monotone curve is required before any fix.

name: sse-streaming
covers:
  - ui/src/components/StreamingMessage.tsx
  - ui/src/components/MessageList.tsx
  - ui/src/hooks/useConnection.ts
  - ui/src/conversation/atom.ts

params:
  base_url: "{UI_URL}"              # Vite origin; proxies /api to Phoenix
  words: "800"                      # caller overrides via --subst words=N
  prompt: "[[perf:{words}]] stream the deterministic perf fixture"

runs: 20
warmup: 3

# Untimed per-run setup. Establishes an identical pristine state and puts the
# React mount + seed response OUTSIDE the measured window.
reset:
  fresh_conversation:
    api_base: "{base_url}"
    model: mock
    cwd: /tmp
    seed_text: "[[perf:5]]"         # tiny deterministic seed; fast, no rand
  url: "{base_url}/c/{slug}"        # {slug} is bound by fresh_conversation
  wait_app_ready:
    expr: >
      document.querySelector('textarea[placeholder="Type a message..."]')
      && document.readyState === 'complete'
      && document.querySelectorAll('.message.agent').length >= 1
      && !document.querySelector('.streaming-message')
    timeout_ms: 60000

# Measured interaction only — navigation is owned by reset.
steps:
  - eval: "window.__pp_pre = document.querySelectorAll('.message.agent').length"
  - click: 'textarea[placeholder="Type a message..."]'
  - type: { selector: 'textarea[placeholder="Type a message..."]', text: "{prompt}" }
  - click: '.input-send-btn'
  - wait-for-eval-predicate:
      expr: "document.querySelectorAll('.message.agent').length > window.__pp_pre && !document.querySelector('.streaming-message')"
      timeout_ms: 180000
