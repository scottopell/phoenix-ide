[workspace]
resolver = "2"
members = ["crates/phoenix-ide", "crates/phoenix-tls"]

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
float_cmp = "deny"
manual_memcpy = "deny"
redundant_allocation = "deny"
rc_buffer = "deny"
unnecessary_to_owned = "deny"
dbg_macro = "deny"
mod_module_files = "deny"
string_slice = "deny"

[workspace.lints.rust]
unused_extern_crates = "deny"
unused_allocation = "deny"
unused_assignments = "deny"
unused_comparisons = "deny"

[profile.release]
debug = true  # Include debug symbols for production debugging

# Cold-compile + link-time reductions for `./dev.py check` and dev builds.
# `line-tables-only` keeps file:line info (so panics + backtraces still
# resolve) but drops full DWARF type info, which is the bulk of what slows
# the linker on debug builds. `codegen-units = 256` gives rustc more
# parallelism on cold builds; dev is already opt-level=0 so monomorphized
# inlining loss is moot.
[profile.dev]
debug = "line-tables-only"
codegen-units = 256

[profile.test]
debug = "line-tables-only"
codegen-units = 256

# Optimize heavy dependencies even in debug builds to reduce:
# - Incremental build time
# - Binary size (prevents debug build linker hangs)
# - Memory pressure during linking
# These crates are rarely debugged and benefit from release optimizations.

[profile.dev.package.chromiumoxide]
opt-level = 3

# Heavy async/web dependencies
[profile.dev.package.tokio]
opt-level = 3

[profile.dev.package.reqwest]
opt-level = 3

# Database (rarely debugged)
[profile.dev.package.sqlx]
opt-level = 3
