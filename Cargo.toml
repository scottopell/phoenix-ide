[profile.release]
debug = true  # Include debug symbols for production debugging

# Size-optimized profile for the primary distributed binary. The `release`
# profile keeps full debug symbols (for core-dump symbolication of a running
# instance); `release-min` is what end users download. panic stays unwinding
# (the default): Phoenix is a long-running server where a panicking request
# handler must be isolated to its tokio task, not abort the process — the
# ~4MB of unwind tables that buys back is not worth losing that isolation.
[profile.release-min]
inherits = "release"
debug = false
strip = true
lto = "fat"
opt-level = "z"
codegen-units = 1

# Cold-compile + link-time reduction for `./dev.py check` and dev builds.
# `line-tables-only` keeps file:line info (so panics + backtraces still
# resolve) but drops full DWARF type info, which is the bulk of what slows
# the linker on debug builds.
#
# NOTE: do NOT bump `codegen-units` here. A previous iteration set it to
# 256 (matching dev's opt-0 default) but profile inheritance pushed that
# onto the opt-3 package overrides below, regressing cold-compile by ~30%
# on low-core CI runners. Defaults (256 dev opt-0, 16 dev-opt-3 inherited)
# are the right trade.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# Optimize heavy dependencies even in debug builds to reduce:
# - Incremental build time
# - Binary size (prevents debug build linker hangs)
# - Memory pressure during linking
# These crates are rarely debugged and benefit from release optimizations.

[profile.dev.package.chromiumoxide]
opt-level = 3

# Heavy async/web dependencies
[profile.dev.package.tokio]
opt-level = 3

[profile.dev.package.reqwest]
opt-level = 3

# Database (rarely debugged)
[profile.dev.package.sqlx]
opt-level = 3

[profile.dev.package.libsqlite3-sys]
opt-level = 2
