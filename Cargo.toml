async-trait = "0.1"
async-tungstenite = { version = "0.32", default-features = false }
axum = "0.8"
base64 = "0.22"
brush-parser = "0.4"
chromiumoxide = { version = "0.9", default-features = false }
chrono = "0.4"
chrono-tz = "0.10"
datadog-opentelemetry = "0.4"
flate2 = "1"
fs2 = "0.4"
futures = "0.3"
globset = "0.4"
hex = "0.4"
httpdate = "1.0.3"
hyper-util = "0.1"
if-addrs = "0.13"
ignore = "0.4"
libc = "0.2"
libsqlite3-sys = "0.37"
listenfd = "1.0.2"
mime_guess = "2"
nix = "0.31"
nono = { version = "0.53", default-features = false }
nucleo-matcher = "0.3.1"
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", default-features = false }
opentelemetry-proto = { version = "=0.31.0", default-features = false }
opentelemetry_sdk = "0.31"
percent-encoding = "2.3"
phoenix-agents = { path = "crates/phoenix-agents" }
phoenix-bash-display = { path = "crates/phoenix-bash-display" }
phoenix-browser = { path = "crates/phoenix-browser" }
phoenix-core = { path = "crates/phoenix-core" }
phoenix-db = { path = "crates/phoenix-db" }
phoenix-llm = { path = "crates/phoenix-llm" }
phoenix-mcp = { path = "crates/phoenix-mcp" }
phoenix-skills = { path = "crates/phoenix-skills" }
phoenix-state-machine = { path = "crates/phoenix-state-machine" }
phoenix-svg = { path = "crates/phoenix-svg" }
phoenix-terminal = { path = "crates/phoenix-terminal" }
phoenix-tls = { path = "crates/phoenix-tls" }
phoenix-tools = { path = "crates/phoenix-tools" }
phoenix-workflow = { path = "crates/phoenix-workflow" }
