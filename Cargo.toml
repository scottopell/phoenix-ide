[workspace]
resolver = "2"
members = ["crates/phoenix-bash-display", "crates/phoenix-browser", "crates/phoenix-core", "crates/phoenix-db", "crates/phoenix-drive-turn", "crates/phoenix-ide", "crates/phoenix-agents", "crates/phoenix-llm", "crates/phoenix-mcp", "crates/phoenix-skills", "crates/phoenix-state-machine", "crates/phoenix-svg", "crates/phoenix-terminal", "crates/phoenix-tls", "crates/phoenix-tools", "crates/phoenix-workflow"]

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
float_cmp = "deny"
manual_memcpy = "deny"
redundant_allocation = "deny"
rc_buffer = "deny"
unnecessary_to_owned = "deny"
dbg_macro = "deny"
mod_module_files = "deny"
string_slice = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
duration_suboptimal_units = "allow"
map_unwrap_or = "allow"
collapsible_match = "allow"
unnecessary_trailing_comma = "allow"
question_mark = "allow"
unnecessary_sort_by = "allow"

[workspace.lints.rust]
unused_extern_crates = "deny"
unused_allocation = "deny"
unused_assignments = "deny"
unused_comparisons = "deny"

# Single source of truth for dependency versions. Members inherit with
# `name = { workspace = true }` and add only `features` / `optional`.
