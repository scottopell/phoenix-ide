id: deferred-resolve-immediate-assertion-ts
language: TypeScript
severity: error
message: |
  Resolving or rejecting a deferred promise and asserting immediately does not
  prove the queued promise reaction ran. Await that exact promise path, or wait
  for a postcondition that changes only after the reaction.
note: "Anti-pattern: immediate assertion after deferred completion"
rule:
  pattern:
    context: expect($$$).$MATCHER($$$)
    selector: expression_statement
  follows:
    any:
      - pattern:
          context: $DEFERRED.resolve($$$);
          selector: expression_statement
      - pattern:
          context: $DEFERRED.reject($$$);
          selector: expression_statement
    stopBy: neighbor
