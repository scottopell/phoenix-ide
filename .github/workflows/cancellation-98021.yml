name: Cancellation 98021 round 2 qualification
on:
  push:
    branches: [qualification/cancellation-98021-round2]
permissions:
  contents: read
concurrency:
  group: cancellation-98021-round2
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Exact source and command evidence
        run: |
          printf 'CARGO_TARGET_DIR=%s/cancellation-98021-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p qualification-evidence
          printf '%s\n' 'EXCLUDED EXPECTED RED: authoritative_settlement_is_not_reclassified_by_legacy_cancel_observation; publisher override remains unfixed. This is slice qualification, not full-branch CI or merge readiness.' > qualification-evidence/remaining-failure.txt
          git rev-parse HEAD | tee qualification-evidence/head.txt
          printf '%s\n' 'source-parent=ff9bd30f87527d1484eb8768aed9761d4fb84435' > qualification-evidence/source-parent.txt
      - name: Four-package all-target check and ten named regressions
        shell: bash
        run: |
          set -uo pipefail
          run_check() {
            local name="$1" code; shift
            printf '%q ' "$@" > "qualification-evidence/$name.command"
            printf '\n' >> "qualification-evidence/$name.command"
            "$@" 2>&1 | tee "qualification-evidence/$name.log"
            code=${PIPESTATUS[0]}
            printf '%s\n' "$code" > "qualification-evidence/$name.exit"
            if [[ "$name" != compile && "$code" = 0 ]]; then
              grep -Eq 'test result: ok\. [1-9][0-9]* passed' "qualification-evidence/$name.log" || return 1
              grep -F "::$name ... ok" "qualification-evidence/$name.log" > /dev/null || return 1
            fi
            return "$code"
          }
          run_check compile cargo check --all-targets -p phoenix-core -p phoenix-state-machine -p phoenix-db -p phoenix_ide || exit "$?"
          result=0
          for test in \
            accepted_direct_turn_stop_replays_exact_command_not_replacement_generation \
            established_terminal_obligation_rejects_stop_without_revoking_owner \
            accepted_stop_fences_later_terminal_obligation \
            accepted_stop_finalization_must_commit_the_reducer_projection \
            stop_commit_error_is_classified_from_exact_durable_fact; do
            run_check "$test" cargo test -p phoenix-db "$test" || result=1
          done
          for test in \
            db_backed_targeted_stop_commits_projection_before_teardown_and_restart \
            targeted_stop_does_not_fabricate_idle_for_nonterminal_drain \
            direct_stop_storage_failure_cannot_abort_model_work \
            stale_direct_turn_stop_is_rejected_before_teardown \
            direct_turn_stop_cannot_fall_back_to_unowned_parent_work; do
            run_check "$test" cargo test -p phoenix_ide "$test" || result=1
          done
          grep -h 'test result:' qualification-evidence/*.log > qualification-evidence/test-counts.txt || true
          exit "$result"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cancellation-98021-round2-evidence
          path: qualification-evidence/
          if-no-files-found: error
      - name: Remove runner-owned target
        if: always()
        shell: bash
        run: |
          test "$CARGO_TARGET_DIR" = "$RUNNER_TEMP/cancellation-98021-target"
          rm -rf -- "$CARGO_TARGET_DIR"
