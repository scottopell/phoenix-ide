name: gix Close history probe
on:
  push:
    branches: [qualify/gix-close-history-70004]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: scripts/qualification/gix-close-history
    steps:
      - uses: actions/checkout@v6
      - run: |
          git --version
          rustc --version
          test -f Cargo.lock
          cargo tree --locked -e features > resolved-features.txt
          cargo metadata --locked --format-version 1 > metadata.json
          /usr/bin/time -v cargo build --locked --release 2>&1 | tee build.txt
          wc -c target/release/gix-close-history-probe
      - run: timeout 60s bash compare.sh "$PWD/target/release/gix-close-history-probe"
      - run: timeout 90s bash measure.sh "$PWD/target/release/gix-close-history-probe" 2>&1 | tee runtime.txt

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gix-probe-resolution
          path: |
            scripts/qualification/gix-close-history/Cargo.lock
            scripts/qualification/gix-close-history/resolved-features.txt
            scripts/qualification/gix-close-history/metadata.json
            scripts/qualification/gix-close-history/build.txt
            scripts/qualification/gix-close-history/runtime.txt
