name: gix Close history probe
on:
  push:
    branches: [qualify/gix-close-history-70004]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
        working-directory: scripts/qualification/gix-close-history
    steps:
      - uses: actions/checkout@v6
      - run: |
          git --version
          rustc --version
          test -f Cargo.lock
          cargo tree --locked -e features > resolved-features.txt
          cargo metadata --locked --format-version 1 > metadata.json
          /usr/bin/time -v cargo build --locked --release --bin typed-head 2>&1 | tee build.txt
      - run: timeout 120s bash decoder-build.sh 2>&1 | tee decoder-build.txt
      - run: timeout 60s bash decoder-compare.sh 2>&1 | tee decoder-compare.txt
      - run: timeout 60s bash head-compare.sh 2>&1 | tee head-compare.txt

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gix-probe-resolution
          path: |
            scripts/qualification/gix-close-history/Cargo.lock
            scripts/qualification/gix-close-history/resolved-features.txt
            scripts/qualification/gix-close-history/metadata.json
            scripts/qualification/gix-close-history/build.txt
            scripts/qualification/gix-close-history/decoder-*.txt
            scripts/qualification/gix-close-history/decoder-build/Cargo.lock
            scripts/qualification/gix-close-history/head-compare.txt
