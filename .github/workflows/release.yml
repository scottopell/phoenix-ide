name: Release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'prepare-main' || inputs.operation == 'prepare-incident-237100-arm64') && 'preparation' || 'release' }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - 'crates/phoenix-ide/Cargo.toml'
  workflow_dispatch:
    inputs:
      operation:
        description: Protected operation to run
        required: true
        default: retry-release
        type: choice
        options:
          - prepare-main
          - prepare-incident-237100-arm64
          - retry-release
      tag:
        description: Existing immutable release tag (retry-release only)
        required: false
        type: string

jobs:
  # Resolve the version from Cargo.toml and, if it has not been released yet,
  # create + push the tag at this main commit. Idempotent: an unrelated edit to
  # Cargo.toml whose version is already tagged is a no-op.
  gate:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      browser_cli: ${{ steps.capability.outputs.browser_cli }}
      preparation: ${{ steps.ver.outputs.preparation }}
      release: ${{ steps.ver.outputs.release }}
      create_tag: ${{ steps.ver.outputs.create_tag }}
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      channel: ${{ steps.ver.outputs.channel }}
      commit: ${{ steps.ver.outputs.commit }}
      macos_matrix: ${{ steps.macos.outputs.matrix }}
      operation: ${{ steps.macos.outputs.operation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # need existing tags to test for prior release

      - name: Resolve version, tag if new
        id: ver
        env:
          OPERATION: ${{ inputs.operation }}
          RETRY_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" = workflow_dispatch ]]; then
            case "$OPERATION" in
              prepare-incident-237100-arm64)
                [[ -z "$RETRY_TAG" ]] || {
                  echo "Incident preparation does not accept a release tag" >&2
                  exit 1
                }
                python3 scripts/incident_stapler_controller.py gate >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              prepare-main)
                [[ -z "$RETRY_TAG" ]] || {
                  echo "prepare-main does not accept a release tag" >&2
                  exit 1
                }
                VERSION=$(grep -m1 '^version' crates/phoenix-ide/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
                VERSION=$(python3 scripts/release_version.py validate "$VERSION") || {
                  echo "Current main version is not supported for desktop preparation: $VERSION" >&2
                  exit 1
                }
                case "$VERSION" in
                  *-rc.*) CHANNEL=rc ;;
                  *) CHANNEL=stable ;;
                esac
                echo "Preparing protected desktop artifacts from exact main commit $GITHUB_SHA without a tag or release."
                echo "preparation=true" >> "$GITHUB_OUTPUT"
                echo "release=false" >> "$GITHUB_OUTPUT"
                echo "create_tag=false" >> "$GITHUB_OUTPUT"
                echo "tag=" >> "$GITHUB_OUTPUT"
                echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
                echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              retry-release)
                TAG=$RETRY_TAG
                VERSION=$(python3 scripts/release_version.py validate-tag "$TAG") || {
                  echo "Manual retry requires a supported existing release tag: $TAG" >&2
                  exit 1
                }
                case "$VERSION" in
                  *-rc.*) CHANNEL=rc ;;
                  *) CHANNEL=stable ;;
                esac
                git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || {
                  echo "Manual dispatch cannot create missing tag $TAG" >&2
                  exit 1
                }
                TAG_COMMIT=$(git rev-list -n 1 "$TAG")
                git merge-base --is-ancestor "$TAG_COMMIT" origin/main || {
                  echo "Tagged commit $TAG_COMMIT is not on main" >&2
                  exit 1
                }
                echo "Retrying $TAG from its immutable main commit $TAG_COMMIT."
                echo "preparation=false" >> "$GITHUB_OUTPUT"
                echo "release=true" >> "$GITHUB_OUTPUT"
                echo "create_tag=false" >> "$GITHUB_OUTPUT"
                echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
                echo "commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              *)
                echo "Unsupported release operation: $OPERATION" >&2
                exit 1
                ;;
            esac
          fi

          VERSION=$(grep -m1 '^version' crates/phoenix-ide/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          [ -n "$VERSION" ] || { echo "Could not read version from crates/phoenix-ide/Cargo.toml"; exit 1; }
          VERSION=$(python3 scripts/release_version.py validate "$VERSION") || {
            echo "Release version must be a supported X.Y.Z or X.Y.Z-rc.N version before a tag may be created: $VERSION"
            exit 1
          }
          case "$VERSION" in
            *-rc.*) CHANNEL=rc ;;
            *) CHANNEL=stable ;;
          esac
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "preparation=false" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_COMMIT" = "$GITHUB_SHA" ]; then
              echo "Tag $TAG already points at this exact commit — retrying its release."
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "create_tag=false" >> "$GITHUB_OUTPUT"
            else
              echo "Tag $TAG already points at $TAG_COMMIT, not $GITHUB_SHA — nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "create_tag=false" >> "$GITHUB_OUTPUT"
            fi
          else
            git tag --list 'v*' | python3 scripts/release_version.py validate-new-from-tags "$VERSION" >/dev/null || {
              echo "Release version $VERSION must be newer than every supported release tag." >&2
              exit 1
            }
            echo "Tag $TAG is eligible for creation at exact commit $GITHUB_SHA."
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select protected macOS architecture matrix
        id: macos
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "operation=$OPERATION" >> "$GITHUB_OUTPUT"
          else
            echo "operation=" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$OPERATION" == prepare-incident-237100-arm64 ]]; then
            echo 'matrix={"include":[{"runner":"macos-15","target":"aarch64-apple-darwin","asset":"phoenix_ide-aarch64-apple-darwin"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"runner":"macos-15","target":"aarch64-apple-darwin","asset":"phoenix_ide-aarch64-apple-darwin"},{"runner":"macos-15-intel","target":"x86_64-apple-darwin","asset":"phoenix_ide-x86_64-apple-darwin"}]}' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve browser CLI from immutable source
        id: capability
        env:
          SOURCE_COMMIT: ${{ steps.ver.outputs.commit }}
          RELEASE: ${{ steps.ver.outputs.release }}
        run: |
          browser_cli=false
          if [[ "$RELEASE" == true ]] && git cat-file -e "$SOURCE_COMMIT:crates/phoenix-tools/src/bin/phoenix-browser.rs" 2>/dev/null; then
            browser_cli=true
          fi
          echo "browser_cli=$browser_cli" >> "$GITHUB_OUTPUT"

  tag-release:
    needs: gate
    if: needs.gate.outputs.create_tag == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.commit }}
          fetch-depth: 0
      - name: Create exact release tag
        run: |
          TAG=${{ needs.gate.outputs.tag }}
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null && {
            echo "Tag $TAG appeared after the gate; refusing replacement." >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  build-linux:
    needs: [gate, tag-release]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.release == 'true' && (needs.tag-release.result == 'success' || needs.tag-release.result == 'skipped') }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.commit }}
      - name: Install musl compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = aarch64-unknown-linux-musl ] && ! command -v aarch64-linux-musl-gcc >/dev/null; then
            sudo ln -s "$(command -v musl-gcc)" /usr/local/bin/aarch64-linux-musl-gcc
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install and verify Rust target
        run: |
          rustup target add "${{ matrix.target }}"
          rustup target list --installed | grep -Fx "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: ui
      - name: Restore tracked UI placeholder and verify clean source
        run: |
          git restore ui/dist/.gitkeep
          test -z "$(git status --porcelain)"
      - name: Build Linux binaries
        run: |
          cargo build --profile release-min --features phoenix_ide/datadog-tracing --target "${{ matrix.target }}"
          cargo build --release --features phoenix_ide/datadog-tracing --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release-min/phoenix_ide" "phoenix_ide-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/phoenix_ide" "phoenix_ide-${{ matrix.target }}-debug"
        env:
          CC_x86_64_unknown_linux_musl: x86_64-linux-musl-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-musl-gcc
      - name: Build and smoke native Linux browser CLI
        if: needs.gate.outputs.browser_cli == 'true'
        run: |
          cargo build --locked -p phoenix-tools --bin phoenix-browser --profile release-min --target "${{ matrix.target }}"
          browser="target/${{ matrix.target }}/release-min/phoenix-browser"
          case "${{ matrix.target }}" in
            x86_64-*) file "$browser" | grep -E 'ELF 64-bit.*x86-64.*(statically linked|static-pie linked)' ;;
            aarch64-*) file "$browser" | grep -E 'ELF 64-bit.*ARM aarch64.*(statically linked|static-pie linked)' ;;
          esac
          "$browser" --help
          "$browser" --json schema snapshot
          cp "$browser" "phoenix-browser-${{ matrix.target }}"
        env:
          CC_x86_64_unknown_linux_musl: x86_64-linux-musl-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-musl-gcc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.target }}-release-assets
          path: |
            phoenix_ide-${{ matrix.target }}*
            phoenix-browser-${{ matrix.target }}

  build-macos:
    environment: macos-release-signing
    needs: [gate, tag-release]
    if: ${{ !cancelled() && needs.gate.result == 'success' && (needs.gate.outputs.preparation == 'true' || (needs.gate.outputs.release == 'true' && (needs.tag-release.result == 'success' || needs.tag-release.result == 'skipped'))) }}
    strategy:
      matrix: ${{ fromJSON(needs.gate.outputs.macos_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.commit }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: ui
      - name: Restore tracked UI placeholder and verify clean source
        run: |
          git restore ui/dist/.gitkeep
          test -z "$(git status --porcelain)"
      - name: Build native macOS binary
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          cargo build --profile release-min --features phoenix_ide/datadog-tracing --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release-min/phoenix_ide" "$RUNNER_TEMP/release-assets/${{ matrix.asset }}"
      - name: Build native macOS browser CLI
        if: needs.gate.outputs.release == 'true' && needs.gate.outputs.browser_cli == 'true'
        run: |
          cargo build --locked -p phoenix-tools --bin phoenix-browser --profile release-min --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release-min/phoenix-browser" "$RUNNER_TEMP/release-assets/phoenix-browser-${{ matrix.target }}"
      - name: Materialize exact incident packaging controller outside candidate source
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare-incident-237100-arm64'
        env:
          CONTROLLER_COMMIT: ${{ github.sha }}
        run: |
          umask 077
          test "$(git rev-parse HEAD)" = '237100c79d9ce672867b284167a099fa0b7a2bcf'
          test -z "$(git status --porcelain)"
          git show "$CONTROLLER_COMMIT:scripts/incident_stapler_controller.py" > "$RUNNER_TEMP/incident_stapler_controller.py"
          python3 "$RUNNER_TEMP/incident_stapler_controller.py" gate > "$RUNNER_TEMP/incident-gate.txt"
          python3 "$RUNNER_TEMP/incident_stapler_controller.py" write-wrapper "$RUNNER_TEMP/incident-xcrun"
          test -z "$(git status --porcelain)"
      - name: Sign, verify, notarize, and package protected macOS assets
        timeout-minutes: ${{ needs.gate.outputs.operation == 'prepare-incident-237100-arm64' && 30 || 360 }}
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          umask 077
          for name in \
            DEVELOPER_ID_P12_BASE64 \
            DEVELOPER_ID_P12_PASSWORD \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_API_KEY
          do
            [[ -n "${!name}" ]] || { echo "Missing required secret: $name" >&2; exit 1; }
          done
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "APPLE_TEAM_ID must be a 10-character team ID" >&2; exit 1; }
          [[ "$APP_STORE_CONNECT_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "APP_STORE_CONNECT_KEY_ID must be a 10-character key ID" >&2; exit 1; }
          [[ "$APP_STORE_CONNECT_ISSUER_ID" =~ ^[0-9A-Fa-f-]{36}$ ]] || { echo "APP_STORE_CONNECT_ISSUER_ID must be a UUID" >&2; exit 1; }
          P12_PATH="$RUNNER_TEMP/developer-id.p12"
          ASC_KEY_PATH="$RUNNER_TEMP/phoenix-notary-api-key.p8"
          KEYCHAIN_PATH="$RUNNER_TEMP/phoenix-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | /usr/bin/base64 -D > "$P12_PATH"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$ASC_KEY_PATH"
          chmod 600 "$P12_PATH" "$ASC_KEY_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          identities=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk '/"Developer ID Application:/ {print $2}')
          [[ $(printf '%s\n' "$identities" | sed '/^$/d' | wc -l | tr -d ' ') -eq 1 ]] || {
            echo "expected exactly one Developer ID Application identity" >&2
            exit 1
          }
          MACOS_SIGNING_IDENTITY=$identities
          APP_STORE_CONNECT_API_KEY_PATH=$ASC_KEY_PATH
          codesign --force --sign "$MACOS_SIGNING_IDENTITY" --options runtime --timestamp "$RUNNER_TEMP/release-assets/${{ matrix.asset }}"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/release-assets/${{ matrix.asset }}"
          export MACOS_SIGNING_IDENTITY APPLE_TEAM_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_API_KEY_PATH
          if [[ "${{ needs.gate.outputs.release }}" == true && "${{ needs.gate.outputs.browser_cli }}" == true ]]; then
            bash scripts/sign-notarize-browser-cli.sh \
              "$RUNNER_TEMP/release-assets/phoenix-browser-${{ matrix.target }}" "${{ matrix.target }}"
          fi
          receipt_args=()
          if [[ "${{ needs.gate.outputs.preparation }}" == true ]]; then
            receipt_args+=("$RUNNER_TEMP/release-assets/PREPARATION-RECEIPT-${{ matrix.target }}.json")
          fi
          package_env=()
          if [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.operation }}" == prepare-incident-237100-arm64 ]]; then
            package_env=(env "XCRUN=$RUNNER_TEMP/incident-xcrun")
          fi
          "${package_env[@]}" macos/Phoenix/scripts/package-desktop-release.sh \
            "$RUNNER_TEMP/release-assets/${{ matrix.asset }}" \
            "${{ matrix.target }}" \
            "v${{ needs.gate.outputs.version }}" \
            "${{ needs.gate.outputs.commit }}" \
            "$RUNNER_TEMP/release-assets" \
            "${receipt_args[@]}"
          if [[ "${{ needs.gate.outputs.preparation }}" == true ]]; then
            short_commit=${{ needs.gate.outputs.commit }}
            short_commit=${short_commit:0:12}
            standalone="$RUNNER_TEMP/release-assets/${{ matrix.asset }}"
            archive="$RUNNER_TEMP/release-assets/Phoenix-macos-${{ matrix.target }}-v${{ needs.gate.outputs.version }}.zip"
            prepared_standalone="$RUNNER_TEMP/release-assets/${{ matrix.asset }}-prepared-$short_commit"
            prepared_archive="$RUNNER_TEMP/release-assets/Phoenix-macos-${{ matrix.target }}-prepared-$short_commit.zip"
            mv "$standalone" "$prepared_standalone"
            mv "$archive" "$prepared_archive"
            manifest="$RUNNER_TEMP/release-assets/PREPARATION-SHA256SUMS-${{ matrix.target }}"
            receipt="$RUNNER_TEMP/release-assets/PREPARATION-RECEIPT-${{ matrix.target }}.json"
            (
              cd "$RUNNER_TEMP/release-assets"
              shasum -a 256 "$(basename "$prepared_standalone")" "$(basename "$prepared_archive")" \
                > "$(basename "$manifest")"
              shasum -a 256 -c "$(basename "$manifest")"
            )
            python3 - "$receipt" "$manifest" <<'PY'
          import json
          import sys
          from pathlib import Path

          receipt_path, manifest_path = map(Path, sys.argv[1:])
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          digests = {}
          for line in manifest_path.read_text(encoding="utf-8").splitlines():
              digest, name = line.split(maxsplit=1)
              digests[name] = digest
          if len(digests) != 2:
              raise SystemExit("preparation manifest must contain exactly two payloads")
          receipt["sha256"] = digests
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          fi
      - name: Record separate incident controller provenance
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare-incident-237100-arm64'
        run: |
          python3 "$RUNNER_TEMP/incident_stapler_controller.py" provenance \
            > "$RUNNER_TEMP/release-assets/INCIDENT-CONTROLLER-PROVENANCE-aarch64-apple-darwin.json"
      - name: Remove protected material
        if: always()
        run: |
          cleanup_failed=0
          KEYCHAIN_PATH="$RUNNER_TEMP/phoenix-signing.keychain-db"
          security list-keychains -d user -s login.keychain-db || cleanup_failed=1
          if [[ -e "$KEYCHAIN_PATH" ]]; then
            security lock-keychain "$KEYCHAIN_PATH" || cleanup_failed=1
            security delete-keychain "$KEYCHAIN_PATH" || cleanup_failed=1
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/phoenix-notary-api-key.p8" || cleanup_failed=1
          rm -rf "$RUNNER_TEMP"/phoenix-browser-notary.* || cleanup_failed=1
          rm -f "$RUNNER_TEMP/incident-xcrun" "$RUNNER_TEMP/incident_stapler_controller.py" "$RUNNER_TEMP/incident-gate.txt" || cleanup_failed=1
          [[ ! -e "$KEYCHAIN_PATH" ]]
          [[ ! -e "$RUNNER_TEMP/developer-id.p12" ]]
          [[ ! -e "$RUNNER_TEMP/phoenix-notary-api-key.p8" ]]
          exit "$cleanup_failed"
      - name: Check isolated signed-helper startup
        timeout-minutes: 5
        run: |
          umask 077
          short_commit="${{ needs.gate.outputs.commit }}"
          short_commit=${short_commit:0:12}
          qa="$GITHUB_WORKSPACE/qa-artifacts/release-qa/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.target }}"
          mkdir -p "$qa"
          if [[ "${{ needs.gate.outputs.preparation }}" == true ]]; then
            standalone="$RUNNER_TEMP/release-assets/${{ matrix.asset }}-prepared-$short_commit"
            archive="$RUNNER_TEMP/release-assets/Phoenix-macos-${{ matrix.target }}-prepared-$short_commit.zip"
          else
            standalone="$RUNNER_TEMP/release-assets/${{ matrix.asset }}"
            archive="$RUNNER_TEMP/release-assets/Phoenix-macos-${{ matrix.target }}-${{ needs.gate.outputs.tag }}.zip"
          fi
          node --eval '
            const { checkSignedHelper } = require("./scripts/check-signed-helper.cjs");
            const [archive, standalone, sha, version, target, output] = process.argv.slice(1);
            const preflightCodes = new Set([
              "requires-macos-host", "expected-full-sha-required", "expected-version-required",
              "requires-native-matching-host", "qa-workspace-boundary", "output-must-be-fresh",
              "qa-output-parent-boundary", "production-path-refused"
            ]);
            checkSignedHelper({ archive, standalone, sha, version, target, output }).then(() => {
              console.log("Signed-helper headless acceptance passed; sanitized receipt saved.");
            }).catch(error => {
              const code = preflightCodes.has(error.message) ? error.message : "acceptance-failed-see-sanitized-receipt";
              console.error(`Signed-helper acceptance failed: ${code}; private details withheld.`);
              process.exitCode = 1;
            });
          ' \
            "$archive" \
            "$standalone" \
            "${{ needs.gate.outputs.commit }}" \
            "${{ needs.gate.outputs.version }}" \
            "${{ matrix.target }}" \
            "$qa/runtime"
          if [[ "${{ needs.gate.outputs.preparation }}" == true ]]; then
            cp "$qa/runtime/acceptance-receipt.json" \
              "$RUNNER_TEMP/release-assets/HEADLESS-ACCEPTANCE-${{ matrix.target }}.json"
          fi
      - name: Retain successful headless acceptance receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: headless-acceptance-${{ matrix.target }}-${{ needs.gate.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}-success
          path: qa-artifacts/release-qa/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.target }}/runtime/acceptance-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain failed headless acceptance receipt
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: headless-acceptance-${{ matrix.target }}-${{ needs.gate.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}-failure
          path: qa-artifacts/release-qa/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.target }}/runtime/acceptance-receipt.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.gate.outputs.release == 'true'
        with:
          name: macos-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/release-assets/${{ matrix.asset }}
            ${{ runner.temp }}/release-assets/phoenix-browser-${{ matrix.target }}
            ${{ runner.temp }}/release-assets/Phoenix-macos-${{ matrix.target }}-${{ needs.gate.outputs.tag }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.gate.outputs.preparation == 'true'
        with:
          name: desktop-preparation-${{ matrix.target }}-${{ needs.gate.outputs.commit }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [gate, tag-release, build-linux, build-macos]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.release == 'true' && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' && (needs.tag-release.result == 'success' || (needs.tag-release.result == 'skipped' && needs.gate.outputs.create_tag == 'false')) }}
    environment: macos-release-signing
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-release-assets'
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: 'macos-*'
          merge-multiple: true
      - name: Publish one checksummed asset set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          required=(
            phoenix_ide-x86_64-unknown-linux-musl
            phoenix_ide-aarch64-unknown-linux-musl
            phoenix_ide-x86_64-unknown-linux-musl-debug
            phoenix_ide-aarch64-unknown-linux-musl-debug
            phoenix_ide-x86_64-apple-darwin
            phoenix_ide-aarch64-apple-darwin
            Phoenix-macos-x86_64-apple-darwin-${{ needs.gate.outputs.tag }}.zip
            Phoenix-macos-aarch64-apple-darwin-${{ needs.gate.outputs.tag }}.zip
          )
          if [[ "${{ needs.gate.outputs.browser_cli }}" == true ]]; then
            required+=(
              phoenix-browser-x86_64-unknown-linux-musl
              phoenix-browser-aarch64-unknown-linux-musl
              phoenix-browser-x86_64-apple-darwin
              phoenix-browser-aarch64-apple-darwin
            )
          fi
          for asset in "${required[@]}"; do
            test -f "$asset" || { echo "missing required release asset: $asset"; exit 1; }
          done
          sha256sum "${required[@]}" > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq "${#required[@]}"

          notes_source="${{ needs.gate.outputs.commit }}:docs/releases/${{ needs.gate.outputs.tag }}.md"
          if git cat-file -e "$notes_source" 2>/dev/null; then
            export RELEASE_NOTES_FILE="$RUNNER_TEMP/release-notes.md"
            git show "$notes_source" > "$RELEASE_NOTES_FILE"
          fi

          assets=("${required[@]}" SHA256SUMS)
          bash scripts/publish-release-assets.sh \
            scottopell/phoenix-ide \
            "${{ needs.gate.outputs.tag }}" \
            "${{ needs.gate.outputs.commit }}" \
            "${{ needs.gate.outputs.channel }}" \
            "${assets[@]}"
