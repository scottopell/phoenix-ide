name: Release

# Releases are triggered by a version bump landing on `main`, never by a
# human pushing a tag. This makes two invariants structural rather than
# disciplinary:
#   - the release tag always points at a commit that is on `main` (the
#     workflow only ever tags the commit that triggered it), and
#   - the tag always carries the `v` prefix the build expects (the workflow
#     generates it from Cargo.toml — it cannot be fat-fingered).
# A bump PR merged into `main` is the entire release action.

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'crates/phoenix-ide/Cargo.toml'
  # Manual re-trigger (e.g. to retry a failed build for the current version).
  workflow_dispatch: {}

jobs:
  # Resolve the version from Cargo.toml and, if it has not been released yet,
  # create + push the tag at this main commit. Idempotent: an unrelated edit to
  # Cargo.toml whose version is already tagged is a no-op.
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.ver.outputs.release }}
      tag: ${{ steps.ver.outputs.tag }}
      commit: ${{ steps.ver.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need existing tags to test for prior release

      - name: Resolve version, tag if new
        id: ver
        run: |
          VERSION=$(grep -m1 '^version' crates/phoenix-ide/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          [ -n "$VERSION" ] || { echo "Could not read version from crates/phoenix-ide/Cargo.toml"; exit 1; }
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Release version must be a stable X.Y.Z version before a tag may be created: $VERSION"
            exit 1
          }
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_COMMIT" = "$GITHUB_SHA" ]; then
              echo "Tag $TAG already points at this exact commit — retrying its release."
              echo "release=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag $TAG already points at $TAG_COMMIT, not $GITHUB_SHA — nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Tagging $(git rev-parse --short HEAD) as $TAG"
            # Annotated tags need a committer identity; the runner has none.
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.tag }}
      - name: Install musl compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = aarch64-unknown-linux-musl ] && ! command -v aarch64-linux-musl-gcc >/dev/null; then
            sudo ln -s "$(command -v musl-gcc)" /usr/local/bin/aarch64-linux-musl-gcc
          fi
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Install and verify Rust target
        run: |
          rustup target add "${{ matrix.target }}"
          rustup target list --installed | grep -Fx "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: ui
      - name: Restore tracked UI placeholder and verify clean source
        run: |
          git restore ui/dist/.gitkeep
          test -z "$(git status --porcelain)"
      - name: Build Linux binaries
        run: |
          cargo build --profile release-min --features phoenix_ide/datadog-tracing --target "${{ matrix.target }}"
          cargo build --release --features phoenix_ide/datadog-tracing --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release-min/phoenix_ide" "phoenix_ide-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/phoenix_ide" "phoenix_ide-${{ matrix.target }}-debug"
        env:
          CC_x86_64_unknown_linux_musl: x86_64-linux-musl-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-musl-gcc
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}-release-assets
          path: phoenix_ide-${{ matrix.target }}*

  build-macos:
    environment: macos-release-signing
    needs: gate
    if: needs.gate.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: phoenix_ide-aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: phoenix_ide-x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: ui
      - name: Restore tracked UI placeholder and verify clean source
        run: |
          git restore ui/dist/.gitkeep
          test -z "$(git status --porcelain)"
      - name: Build native macOS binary
        run: |
          cargo build --profile release-min --features phoenix_ide/datadog-tracing --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release-min/phoenix_ide" "${{ matrix.asset }}"
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ runner.temp }}-${{ github.run_id }}
        run: |
          : "${MACOS_CERTIFICATE_P12_BASE64:?MACOS_CERTIFICATE_P12_BASE64 is required}"
          : "${MACOS_CERTIFICATE_PASSWORD:?MACOS_CERTIFICATE_PASSWORD is required}"
          CERTIFICATE_PATH="$RUNNER_TEMP/phoenix-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/phoenix-signing.keychain-db"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
      - name: Sign standalone macOS helper
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          : "${MACOS_SIGNING_IDENTITY:?MACOS_SIGNING_IDENTITY is required}"
          codesign --force --sign "$MACOS_SIGNING_IDENTITY" --options runtime --timestamp "${{ matrix.asset }}"
          codesign --verify --strict --verbose=2 "${{ matrix.asset }}"
      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/phoenix-signing.keychain-db" || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: ${{ matrix.asset }}

  build-macos-desktop:
    environment: macos-release-signing
    needs: [gate, build-macos]
    if: needs.gate.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            sidecar: phoenix_ide-aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            sidecar: phoenix_ide-x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: sidecar
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ runner.temp }}-${{ github.run_id }}
        run: |
          : "${MACOS_CERTIFICATE_P12_BASE64:?MACOS_CERTIFICATE_P12_BASE64 is required}"
          : "${MACOS_CERTIFICATE_PASSWORD:?MACOS_CERTIFICATE_PASSWORD is required}"
          CERTIFICATE_PATH="$RUNNER_TEMP/phoenix-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/phoenix-signing.keychain-db"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
      - name: Build, notarize, and package Phoenix.app
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          chmod +x "sidecar/${{ matrix.sidecar }}"
          macos/Phoenix/scripts/package-desktop-release.sh \
            "sidecar/${{ matrix.sidecar }}" \
            "${{ matrix.target }}" \
            "${{ needs.gate.outputs.tag }}" \
            "${{ needs.gate.outputs.commit }}" \
            desktop-assets
      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/phoenix-signing.keychain-db" || true
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: desktop-assets/Phoenix-macos-${{ matrix.target }}-${{ needs.gate.outputs.tag }}.zip

  publish:
    needs: [gate, build-linux, build-macos, build-macos-desktop]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-release-assets-${{ needs.gate.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release-assets'
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: 'macos-*'
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: 'desktop-*'
          merge-multiple: true
      - name: Publish one checksummed asset set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          required=(
            phoenix_ide-x86_64-unknown-linux-musl
            phoenix_ide-aarch64-unknown-linux-musl
            phoenix_ide-x86_64-apple-darwin
            phoenix_ide-aarch64-apple-darwin
            Phoenix-macos-x86_64-apple-darwin-${{ needs.gate.outputs.tag }}.zip
            Phoenix-macos-aarch64-apple-darwin-${{ needs.gate.outputs.tag }}.zip
          )
          for asset in "${required[@]}"; do
            test -f "$asset" || { echo "missing required release asset: $asset"; exit 1; }
          done
          sha256sum phoenix_ide-* Phoenix-macos-* > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 8

          assets=(phoenix_ide-* Phoenix-macos-* SHA256SUMS)
          bash scripts/publish-release-assets.sh \
            scottopell/phoenix-ide \
            "${{ needs.gate.outputs.tag }}" \
            "${{ needs.gate.outputs.commit }}" \
            "${assets[@]}"
