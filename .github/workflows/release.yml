name: Release

# Releases are triggered by a version bump landing on `main`, never by a
# human pushing a tag. This makes two invariants structural rather than
# disciplinary:
#   - the release tag always points at a commit that is on `main` (the
#     workflow only ever tags the commit that triggered it), and
#   - the tag always carries the `v` prefix the build expects (the workflow
#     generates it from Cargo.toml — it cannot be fat-fingered).
# A bump PR merged into `main` is the entire release action.

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'crates/phoenix-ide/Cargo.toml'
  # Manual re-trigger (e.g. to retry a failed build for the current version).
  workflow_dispatch: {}

jobs:
  # Resolve the version from Cargo.toml and, if it has not been released yet,
  # create + push the tag at this main commit. Idempotent: an unrelated edit to
  # Cargo.toml whose version is already tagged is a no-op.
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.ver.outputs.release }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need existing tags to test for prior release

      - name: Resolve version, tag if new
        id: ver
        run: |
          VERSION=$(grep -m1 '^version' crates/phoenix-ide/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          [ -n "$VERSION" ] || { echo "Could not read version from crates/phoenix-ide/Cargo.toml"; exit 1; }
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tagging $(git rev-parse --short HEAD) as $TAG"
            # Annotated tags need a committer identity; the runner has none.
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.tag }}
      - run: sudo apt-get install -y musl-tools
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: ui
      - name: Restore tracked UI placeholder and verify clean source
        run: |
          git restore ui/dist/.gitkeep
          test -z "$(git status --porcelain)"
      - name: Build Linux binaries
        run: |
          cargo build --profile release-min --target x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release-min/phoenix_ide phoenix_ide-x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/phoenix_ide phoenix_ide-x86_64-unknown-linux-musl-debug
        env:
          CC_x86_64_unknown_linux_musl: x86_64-linux-musl-gcc
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: phoenix_ide-x86_64-unknown-linux-musl*

  build-macos:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: phoenix_ide-aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin
            asset: phoenix_ide-x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: ui
      - name: Restore tracked UI placeholder and verify clean source
        run: |
          git restore ui/dist/.gitkeep
          test -z "$(git status --porcelain)"
      - name: Build native macOS binary
        run: |
          cargo build --profile release-min --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release-min/phoenix_ide" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: ${{ matrix.asset }}

  publish:
    needs: [gate, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release-assets'
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: 'macos-*'
          merge-multiple: true
      - name: Publish one checksummed asset set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum phoenix_ide-* > SHA256SUMS
          gh release create "${{ needs.gate.outputs.tag }}" \
            --repo scottopell/phoenix-ide \
            --title "${{ needs.gate.outputs.tag }}" \
            --generate-notes \
            phoenix_ide-* SHA256SUMS
