name: Settled reading browser QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ui/**'
      - '.github/workflows/settled-reading-qa.yml'
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - '.github/workflows/settled-reading-qa.yml'

permissions:
  contents: read

jobs:
  delayed-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - run: corepack enable
      - run: corepack prepare pnpm@11.0.8 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: Focused executor and fixture tests
        working-directory: ui
        run: pnpm exec vitest run src/components/VirtualTranscript.test.tsx src/components/MessageList.test.tsx src/components/viewer-find src/fixtures/messageList/scenarios.test.ts src/components/QuestionPanel.test.tsx src/components/InputArea.test.tsx src/pages/ConversationPage.archived.test.tsx scripts/capture-ladle-surface.test.mjs
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: ui
      - name: Settled image and Find finalization navigation controls
        working-directory: ui
        env:
          PHOENIX_LADLE: '1'
          CAPTURE_STORIES: delayed-image-scroll,find-identical-finalization
        run: node scripts/capture-message-list.mjs
      - name: Question refresh and confirmation focus controls
        working-directory: ui
        env:
          PHOENIX_LADLE: '1'
          PLAYWRIGHT_INSTALLED_ONLY: '1'
          CAPTURE_STORIES: question-focus
        run: node scripts/capture-conversation-panel.mjs
      - name: Composer consumed and absent insertion focus controls
        working-directory: ui
        env:
          PHOENIX_LADLE: '1'
          PLAYWRIGHT_INSTALLED_ONLY: '1'
          CAPTURE_STORIES: composer-focus
          CAPTURE_VIEWPORT: desktop-dark
        run: node scripts/capture-product-conversation.mjs
      - name: Ember tracking saved observation / 393px and desktop journeys
        working-directory: ui
        env:
          PHOENIX_LADLE: '1'
          PLAYWRIGHT_INSTALLED_ONLY: '1'
          CAPTURE_STORIES: ember-tracking-observations,ember-tracking-fallback
          CAPTURE_VIEWPORT: tracking-393-dark
          PRODUCT_CONVERSATION_QA_OUT: qa-artifacts/tracking-mobile
        run: node scripts/capture-product-conversation.mjs
      - name: Ember tracking saved observation / desktop journey
        working-directory: ui
        env:
          PHOENIX_LADLE: '1'
          PLAYWRIGHT_INSTALLED_ONLY: '1'
          CAPTURE_STORIES: ember-tracking-observations,ember-tracking-fallback
          CAPTURE_VIEWPORT: desktop-dark
          PRODUCT_CONVERSATION_QA_OUT: qa-artifacts/tracking-desktop
        run: node scripts/capture-product-conversation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settled-reading-${{ github.sha }}
          path: ui/qa-artifacts/
