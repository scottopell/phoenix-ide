name: Close exact-source qualification

on:
  workflow_dispatch:
  push:
    branches: [feat/unified-close-receipts, refactor/git-lifecycle-do-less]

permissions:
  contents: read

concurrency:
  group: close-qualification-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  git-lifecycle-public-http:
    if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/git-lifecycle-do-less'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: close-http-qualification
      - uses: astral-sh/setup-uv@v7
      - name: Verify disposable runner dependencies
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -VV
          /usr/bin/tmux -V
          /usr/bin/git --version
          /usr/bin/unshare --version
          /usr/bin/setpriv --version
      - name: Build and record reviewed source as the runner
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/close-http-evidence"
          payload="$RUNNER_TEMP/close-http-payload"
          mkdir -p "$evidence" "$payload"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          printf '%s\n' "$GITHUB_SHA" > "$payload/source.sha"
          git rev-parse HEAD^{tree} > "$evidence/source.tree"
          cp "$payload/source.sha" "$evidence/source.sha"
          cp tests/e2e/{run.py,coordinator_home_resolution_contract.py} "$payload/"
          PHOENIX_BUILD_GIT_SHA="$GITHUB_SHA" PHOENIX_BUILD_GIT_DIRTY=clean \
            cargo build --locked --bin phoenix_ide --target-dir "$GITHUB_WORKSPACE/target" \
            2>&1 | tee "$evidence/build.log"
          test -z "$(git status --porcelain)"
          uv pip install --python /usr/bin/python3 --target "$payload/deps" --only-binary :all: --no-deps \
            httpx==0.28.1 httpx-sse==0.4.3 httpcore==1.0.9 h11==0.16.0 \
            anyio==4.11.0 idna==3.11 certifi==2025.11.12 typing-extensions==4.15.0
          tar -C "$payload" -cf "$RUNNER_TEMP/close-http-payload.tar" run.py coordinator_home_resolution_contract.py source.sha deps
          sha256sum target/debug/phoenix_ide "$RUNNER_TEMP/close-http-payload.tar" > "$evidence/input-sha256.txt"
      - name: Run only the public Git lifecycle with the real Close detector
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/close-http-evidence"
          sha256sum --check "$evidence/input-sha256.txt"
          mapfile -t digests < <(cut -d ' ' -f 1 "$evidence/input-sha256.txt")
          timeout --kill-after=10s 2m bash scripts/ci/close-unprivileged-qualification.sh \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/target/debug/phoenix_ide" \
            "$RUNNER_TEMP/close-http-payload.tar" "$(id -u)" git_lifecycle_public_http "${digests[@]}" \
            2>&1 | tee "$evidence/git-lifecycle-http.log"
          grep -E "^\[e2e\] isolated server source=$GITHUB_SHA uid=[1-9][0-9]* pid=[1-9][0-9]*$" "$evidence/git-lifecycle-http.log"
          grep -E '^  ✓ git_lifecycle_public_http +[0-9.]+s$' "$evidence/git-lifecycle-http.log"
          grep -F '✓ all 1 e2e scenarios passed' "$evidence/git-lifecycle-http.log"
      - name: Build and inventory exact Runtime controls
        id: controls
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/close-http-evidence"
          cargo test --locked -p phoenix_ide --lib --no-run --message-format=json \
            --target-dir "$GITHUB_WORKSPACE/target" > "$evidence/writer-control-build.jsonl"
          runtime_test_binary="$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "phoenix_ide" and .profile.test == true and .executable != null) | .executable' "$evidence/writer-control-build.jsonl")"
          test -x "$runtime_test_binary"
          printf 'PHOENIX_RUNTIME_TEST_BINARY=%s\n' "$runtime_test_binary" >> "$GITHUB_ENV"
          printf 'PHOENIX_BASH_LAUNCH_TEST_EXE=%s\n' "$GITHUB_WORKSPACE/target/debug/phoenix_ide" >> "$GITHUB_ENV"
          printf 'PHOENIX_BASH_LAUNCH_TEST_REQUIRED=1\n' >> "$GITHUB_ENV"
          (cd crates/phoenix-ide && "$runtime_test_binary" --list) | tee "$evidence/runtime-inventory.log"
      - name: Verify concurrent generic dispatch after native Observe adoption
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/close-http-evidence"
          selector=generic_dispatch_and_failure_preserve_observe_adopted_legacy_initial
          cargo test --locked -p phoenix-db --lib "$selector" -- --nocapture 2>&1 | tee "$evidence/$selector.log"
          grep -E "^test .*::$selector \.\.\. ok$" "$evidence/$selector.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$evidence/$selector.log"
      - name: Required production writer detection on the ordinary Linux runner
        if: ${{ !cancelled() && steps.controls.outcome == 'success' }}
        shell: bash
        run: bash scripts/ci/close-ordinary-writer-qualification.sh "$PHOENIX_RUNTIME_TEST_BINARY" "$RUNNER_TEMP/close-http-evidence"
      - name: Run the isolated writer veto and captured-loss Retry controls
        if: ${{ !cancelled() && steps.controls.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/close-http-evidence"
          for test_name in \
            runtime::close_retirement::tests::quarantine_rejects_live_linux_descriptor_writer_before_deletion \
            runtime::executor::creation_completion_lifecycle_tests::native_close_admission_tests::worktree_physical::registered_native_close_captured_loss_public_retry_with_production_detector_reclaims_and_replays; do
            log="$evidence/${test_name##*::}.log"
            grep -Fx "$test_name: test" "$evidence/runtime-inventory.log"
            timeout --kill-after=10s 6m bash scripts/ci/close-unprivileged-qualification.sh \
              "$GITHUB_WORKSPACE" "$PHOENIX_RUNTIME_TEST_BINARY" "$PHOENIX_BASH_LAUNCH_TEST_EXE" \
              "$(id -u)" "$test_name" --exact --nocapture --test-threads=1 2>&1 | tee "$log"
            grep -F "$test_name ... ok" "$log"
            grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log"
          done
      - name: Run shared inspection, fetched pin, strict Retry gap and deadline controls
        if: ${{ !cancelled() && steps.controls.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/close-http-evidence"
          for selector in \
            shared_close_inspection_distinguishes_absence_from_quarantine_probe_failure \
            stranded_generic_dispatch_cannot_reenter_original_worktree \
            generic_close_worker_survives_waiter_drop_and_serializes_reinspection \
            failed_pre_runtime_worktree_reinspection_persists_typed_residual \
            anchored_native_retry_assessment_preserves_writer_inspection_gap \
            registered_native_close_origin_only_fetched_pin_public_retry_preserves_owner_ref \
            detached_unreachable_commits_until_rejects_expired_deadline_before_repository_access \
            detached_reachability_evidence_until_rejects_expired_deadline_before_repository_access; do
            test_name="$(grep -E "::${selector}: test$" "$evidence/runtime-inventory.log" | sed 's/: test$//')"
            log="$evidence/$selector.log"
            (cd crates/phoenix-ide && timeout --kill-after=10s 2m "$PHOENIX_RUNTIME_TEST_BINARY" "$test_name" --exact --nocapture --test-threads=1) 2>&1 | tee "$log"
            grep -F "$test_name ... ok" "$log"
            grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: close-http-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/close-http-evidence/
          if-no-files-found: error
          retention-days: 14
  specifications:
    if: github.event_name != 'push' || github.ref == 'refs/heads/feat/unified-close-receipts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PHOENIX_CHECK_ALL: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: close-specification-qualification
      - uses: astral-sh/setup-uv@v7
      - name: Install pinned specification checker
        run: cargo install allium-cli --version 3.5.0 --locked
      - name: Validate exact-source Allium and specification shape
        shell: bash
        env:
          PHOENIX_CHECK_DIAGNOSTIC_DIR: ${{ github.workspace }}/evidence/specifications-diagnostics
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source.sha
          ./dev.py check --lanes allium,spec-shape 2>&1 | tee evidence/specifications.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: close-specifications-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  frontend:
    if: github.event_name != 'push' || github.ref == 'refs/heads/feat/unified-close-receipts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PHOENIX_CHECK_ALL: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v7
      - name: Upgrade corepack
        run: |
          npm i -g corepack@latest
          corepack enable
      - name: Install locked UI dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: Validate exact-source Close frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source.sha
          (cd ui && pnpm exec vitest run src/components/WorkActions.test.tsx) 2>&1 | tee evidence/close-work-actions-tests.log
          (cd ui && pnpm exec vitest run src/components/QuestionPanel.test.tsx) 2>&1 | tee evidence/close-question-panel-tests.log
          (cd ui && pnpm exec vitest run src/components/CoordinatorQuestionDock.test.tsx) 2>&1 | tee evidence/close-coordinator-question-dock-tests.log
          (cd ui && pnpm exec vitest run src/pages/ProductConversationPage.test.tsx) 2>&1 | tee evidence/close-product-page-tests.log
          ./dev.py check --lanes tsc,ui-lint 2>&1 | tee evidence/frontend-checks.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: close-frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  database:
    if: github.event_name != 'push' || github.ref == 'refs/heads/feat/unified-close-receipts'
    runs-on: ubuntu-latest
    # The exact-source DB and runtime suites share this job. Hosted cold builds
    # and repeated Cargo invocations exceeded 60m before physical actor coverage.
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          components: rustfmt
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: close-database-qualification
      - name: Pin source and prepare hosted-only formatting proposal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source.sha
          git rev-parse HEAD^{tree} | tee evidence/source.tree
          cargo fmt --all
          git diff --binary > evidence/hosted-format.patch
          git restore --worktree .
          git diff --exit-code
      - name: Retain hosted formatting proposal
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: close-format-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/hosted-format.patch
          if-no-files-found: error
      - name: Prepare disposable tmux integration dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y tmux coreutils
          { tmux -V; /usr/bin/timeout --version; /usr/bin/unshare --version; /usr/bin/setpriv --version; } | tee evidence/tmux-versions.log
          bash -n scripts/ci/close-unprivileged-qualification.sh
      - name: Validate Close loss wire and identity contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p phoenix-core --lib domain::close::tests:: -- --nocapture --test-threads=1 2>&1 | tee evidence/close-domain.log
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' evidence/close-domain.log
          grep -F 'test domain::close::tests::enums_expose_exact_persisted_strings ... ok' evidence/close-domain.log
          cargo test -p phoenix-core --lib domain::executing_source::tests:: -- --nocapture --test-threads=1 2>&1 | tee evidence/executing-source.log
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' evidence/executing-source.log
          for case in accepts_exact_executing_occurrence rejects_non_executing_state_and_blank_or_wrong_source_identity rejects_wrong_tool_name_and_payload_disagreement rejects_missing_duplicate_remaining_and_completed_occurrences; do
            grep -Fx "test domain::executing_source::tests::$case ... ok" evidence/executing-source.log
          done
      # Fail at the public retry boundary before paying for full DB regressions.
      # The same binary/inventory is reused by all later runtime gates.
      - name: Compile exact runtime fixtures for focused public journeys
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p phoenix_ide --bin phoenix_ide --message-format=json > evidence/runtime-launcher-build.jsonl
          launch_exe="$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "phoenix_ide" and (.target.kind | index("bin")) != null and .executable != null) | .executable' evidence/runtime-launcher-build.jsonl)"
          test -n "$launch_exe"
          test -x "$launch_exe"
          export PHOENIX_BASH_LAUNCH_TEST_EXE="$(realpath "$launch_exe")"
          export PHOENIX_BASH_LAUNCH_TEST_REQUIRED=1
          printf 'PHOENIX_BASH_LAUNCH_TEST_REQUIRED=1\n' >> "$GITHUB_ENV"
          printf 'PHOENIX_BASH_LAUNCH_TEST_EXE=%s\n' "$PHOENIX_BASH_LAUNCH_TEST_EXE" >> "$GITHUB_ENV"
          cargo test -p phoenix_ide --lib --no-run --message-format=json > evidence/runtime-build.jsonl
          runtime_test_binary="$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "phoenix_ide" and .profile.test == true and .executable != null) | .executable' evidence/runtime-build.jsonl)"
          test -n "$runtime_test_binary"
          test -x "$runtime_test_binary"
          export PHOENIX_RUNTIME_TEST_BINARY="$runtime_test_binary"
          printf 'PHOENIX_RUNTIME_TEST_BINARY=%s\n' "$runtime_test_binary" >> "$GITHUB_ENV"
          (cd crates/phoenix-ide && "$runtime_test_binary" --list) 2>&1 | tee evidence/runtime-inventory.log
          grep -E 'native_close_application::tests::.*: test$|native_close_admission_tests::.*: test$' evidence/runtime-inventory.log > evidence/runtime-selected-tests.txt
      - name: Required production writer detection on the ordinary Linux runner
        if: success() || failure()
        shell: bash
        run: |
          bash scripts/ci/close-ordinary-writer-qualification.sh "$PHOENIX_RUNTIME_TEST_BINARY" "$GITHUB_WORKSPACE/evidence"

      - name: Required public Worktree retirement with production writer detector
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test -n "${PHOENIX_RUNTIME_TEST_BINARY:-}"
          test_name='runtime::executor::creation_completion_lifecycle_tests::native_close_admission_tests::worktree_physical::registered_native_close_with_production_detector_retires_worktree_and_replays'
          grep -Fx "$test_name: test" evidence/runtime-selected-tests.txt
          timeout --kill-after=10s 6m bash scripts/ci/close-unprivileged-qualification.sh "$GITHUB_WORKSPACE" "$PHOENIX_RUNTIME_TEST_BINARY" "$PHOENIX_BASH_LAUNCH_TEST_EXE" "$(id -u)" "$test_name" --exact --nocapture --test-threads=1 2>&1 | tee evidence/public-worktree-production-detector.log
          grep -F "$test_name ... ok" evidence/public-worktree-production-detector.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' evidence/public-worktree-production-detector.log

      - name: Retain bounded failing writer-process attribution
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          timeout 10s node scripts/ci/close-writer-process-diagnostic.mjs evidence/public-worktree-production-detector.log > evidence/public-worktree-process-attribution.jsonl

      - name: Required captured-loss public cleanup and explicit retry reclaim
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test -n "${PHOENIX_RUNTIME_TEST_BINARY:-}"
          failed=0
          for test in \
            registered_native_close_captured_loss_public_retry_with_production_detector_reclaims_and_replays \
            registered_native_close_captured_loss_retry_stop_during_assessment_preserves_worktree_and_history \
            registered_native_close_captured_loss_retry_stop_while_prepared_preserves_worktree \
            registered_native_close_captured_loss_retry_stop_before_writer_refuses_dispatch \
            registered_native_close_captured_loss_retry_stop_before_physical_observation_retains_stopped_result; do
            test_name="runtime::executor::creation_completion_lifecycle_tests::native_close_admission_tests::worktree_physical::$test"
            if ! grep -Fx "$test_name: test" evidence/runtime-inventory.log; then
              failed=1
              continue
            fi
            if ! timeout --kill-after=10s 6m bash scripts/ci/close-unprivileged-qualification.sh "$GITHUB_WORKSPACE" "$PHOENIX_RUNTIME_TEST_BINARY" "$PHOENIX_BASH_LAUNCH_TEST_EXE" "$(id -u)" "$test_name" --exact --nocapture --test-threads=1 2>&1 | tee "evidence/$test.log"; then
              failed=1
              continue
            fi
            grep -F "$test_name ... ok" "evidence/$test.log" || failed=1
            grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "evidence/$test.log" || failed=1
          done
          test "$failed" -eq 0

      - name: Execute pending-mutation, anchored-gap, and live-writer regressions
        if: success() || failure()
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PHOENIX_RUNTIME_TEST_BINARY:-}"
          failed=0
          # Scoped clean-writer fixtures isolate source custody; they do not replace production-detector acceptance.
          for test_name in \
            runtime::executor::creation_completion_lifecycle_tests::native_close_admission_tests::worktree_physical::registered_native_close_captured_loss_retry_stop_during_physical_mutation_does_not_revalidate_pending_ticks \
            runtime::executor::creation_completion_lifecycle_tests::native_close_admission_tests::worktree_physical::registered_native_close_captured_loss_retry_resumes_physical_mutation_after_pending_ticks \
            runtime::close_retirement::tests::anchored_native_retry_assessment_preserves_writer_inspection_gap \
            runtime::close_retirement::tests::quarantine_rejects_live_linux_descriptor_writer_before_deletion; do
            if ! grep -Fx "$test_name: test" evidence/runtime-inventory.log; then
              failed=1
              continue
            fi
            log="evidence/${test_name##*::}.log"
            if ! timeout --kill-after=10s 2m bash scripts/ci/close-unprivileged-qualification.sh "$GITHUB_WORKSPACE" "$PHOENIX_RUNTIME_TEST_BINARY" "$PHOENIX_BASH_LAUNCH_TEST_EXE" "$(id -u)" "$test_name" --exact --nocapture --test-threads=1 2>&1 | tee "$log"; then
              failed=1
              continue
            fi
            grep -F "$test_name ... ok" "$log" || failed=1
            grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log" || failed=1
          done
          test "$failed" -eq 0

      - name: Capture bounded intermittent retry and assessment evidence
        if: success() || failure()
        timeout-minutes: 16
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PHOENIX_RUNTIME_TEST_BINARY:-}"
          failed=0
          for selector in \
            registered_native_close_captured_loss_public_retry_with_production_detector_reclaims_and_replays \
            registered_native_close_captured_loss_retry_stop_during_assessment_preserves_worktree_and_history; do
            test_name="runtime::executor::creation_completion_lifecycle_tests::native_close_admission_tests::worktree_physical::$selector"
            grep -Fx "$test_name: test" evidence/runtime-inventory.log
            # Fixed independent samples, not retries: every failure remains fatal.
            # Preserve each process's evidence even when another sample fails.
            for sample in 1 2 3 4; do
              log="evidence/$selector-sample-$sample.log"
              if ! timeout --kill-after=10s 90s bash scripts/ci/close-unprivileged-qualification.sh "$GITHUB_WORKSPACE" "$PHOENIX_RUNTIME_TEST_BINARY" "$PHOENIX_BASH_LAUNCH_TEST_EXE" "$(id -u)" "$test_name" --exact --nocapture --test-threads=1 2>&1 | tee "$log"; then
                failed=1
                continue
              fi
              grep -F "$test_name ... ok" "$log" || failed=1
              grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log" || failed=1
            done
          done
          test "$failed" -eq 0

      # Prepare inventory for failure-path diagnostics; full DB regressions remain success-gated.
      # DB receipts still require their own selector and execution checks.
      - name: Compile database tests and inventory exact selectors
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p phoenix-db --lib --no-run 2>&1 | tee evidence/compile.log
          cargo test -p phoenix-db --lib -- --list 2>&1 | tee evidence/inventory.log
          grep -E '^close_foundation::tests::.*: test$|^migrations::close_completion_allowance_tests::migration_176_.*: test$|^migrations::retry_tmux_dispatch_tests::.*: test$|^migrations::native_close_retry_origin_gate::tests::.*: test$|^migrations::native_close_origin_owner_cleanup_tests::.*: test$|^migrations::tests::(migration_(184|185|186|187)_.*|close_tail_upgrades_base_171_and_main_172_to_cached_schema_idempotently): test$|^native_close::.*: test$' evidence/inventory.log > evidence/selected-tests.txt
          test -s evidence/selected-tests.txt
          grep -F 'close_foundation::tests::inspection_aggregate_validator_preserves_exact_content_and_empty_generation_rules: test' evidence/selected-tests.txt
          for test in \
            initial_effect_admission_rejects_retained_losses_even_in_anomalous_phase \
            initial_loss_inspection_is_retained_and_terminalized_atomically_without_dispatch \
            initial_loss_terminalization_guards_authority_and_rolls_back_late_failure \
            first_effect_refuses_missing_dispatch_mismatched_binding_and_completed_resource \
            first_effect_callback_is_refused_on_source_loss_and_preserves_exact_result \
            first_effect_callback_holds_writer_reservation_against_source_update \
            initial_worktree_entry_requires_exact_dispatch_and_refuses_completed_reentry \
            initial_worktree_entry_rejects_durable_source_revocation_before_handoff \
            initial_worktree_metadata_requires_exact_original_dispatched_authority_and_live_source \
