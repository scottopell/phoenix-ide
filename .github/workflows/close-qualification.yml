name: Close exact-source qualification

on:
  workflow_dispatch:
  push:
    branches: [feat/unified-close-receipts]

permissions:
  contents: read

concurrency:
  group: close-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  database:
    runs-on: ubuntu-latest
    # The exact-source DB and runtime suites share this job. Hosted cold builds
    # and repeated Cargo invocations exceeded 60m before physical actor coverage.
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          components: rustfmt
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: close-database-qualification
      - name: Pin source and prepare hosted-only formatting proposal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source.sha
          git rev-parse HEAD^{tree} | tee evidence/source.tree
          cargo fmt --all
          git diff --binary > evidence/hosted-format.patch
          git restore --worktree .
          git diff --exit-code
      - name: Retain hosted formatting proposal
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: close-format-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/hosted-format.patch
          if-no-files-found: error
      - name: Compile database tests and inventory exact selectors
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p phoenix-db --lib --no-run 2>&1 | tee evidence/compile.log
          cargo test -p phoenix-db --lib -- --list 2>&1 | tee evidence/inventory.log
          grep -E '^close_foundation::tests::.*: test$|^migrations::close_completion_allowance_tests::migration_159_.*: test$|^native_close::.*: test$' evidence/inventory.log > evidence/selected-tests.txt
          test -s evidence/selected-tests.txt
          grep -F 'stopped_original_retirement_proof_rejects_missing_and_excluded_provenance: test' evidence/selected-tests.txt
          grep -F 'dispatched_absence_retry_resumes_retirement_with_retained_snapshot: test' evidence/selected-tests.txt
          grep -F 'ordinary_and_replay_stop_fence_native_retry_and_suppress_existing_allowance: test' evidence/selected-tests.txt
          grep -F 'rejected_source_state_write_rolls_back_native_fence: test' evidence/selected-tests.txt
          grep -F 'startup_and_observer_interrupt_native_retry_from_original_pending_plan_preserving_allowance: test' evidence/selected-tests.txt
          grep -F 'migration_159_excludes_legacy_sealed_inventory_and_preserves_shared_g2_capture: test' evidence/selected-tests.txt
          grep -F 'native_retry_success_requires_exact_live_receipt_effect_and_evidence_before_replay: test' evidence/selected-tests.txt
          grep -F 'native_retry_finalizes_exact_g1_successes_without_rebinding_current_g2: test' evidence/selected-tests.txt
          grep -F 'retry_interruption_uses_pending_effect_not_successful_prior_resource: test' evidence/selected-tests.txt
          for test in \
            explicit_retry_receipt_lookup_returns_none_without_admission_or_outbox_changes \
            explicit_retry_receipt_lookup_replays_successor_without_predecessor_proof \
            explicit_retry_receipt_lookup_revalidates_source_before_existing_receipt \
            explicit_retry_receipt_lookup_refuses_nonretry_and_conflicting_source_binding; do
            grep -F "close_foundation::tests::native_retry::$test: test" evidence/selected-tests.txt
          done
          for test in \
            migration_163_upgrades_populated_162_without_rebinding_g1_or_g2 \
            migration_163_g1_failure_guards_preserve_g2_and_exact_pending_children \
            migration_163_upgrade_preserves_installed_source_fence_behavior \
            migration_163_unknown_installed_prefix_rolls_back_both_trigger_rewrites; do
            grep -F "close_foundation::tests::native_retry::$test: test" evidence/selected-tests.txt
          done
          for test in \
            generic_resource_failure_still_terminalizes_and_replays_non_native_retry \
            native_resource_failure_uses_g1_pending_tail_and_exact_stopped_replay \
            native_resource_failure_refuses_full_identity_and_caller_evidence_mismatches \
            native_resource_failure_replay_refuses_a_stopped_predecessor_after_successor_admission \
            native_resource_failure_requires_truthful_original_process_success \
            native_resource_failure_rolls_back_late_outbox_and_outcome_message_errors; do
            grep -F "close_foundation::tests::native_retry::$test: test" evidence/selected-tests.txt
          done
          for test in \
            native_retry_execution_context_reads_original_typed_plan_without_mutation \
            native_retry_execution_context_checks_live_source_before_retained_receipt \
            native_retry_execution_context_refuses_forged_receipt_wrong_failed_run_and_stopped_latest; do
            grep -F "close_foundation::tests::native_retry::$test: test" evidence/selected-tests.txt
          done
          for test in \
            native_retry_pre_admission_context_reads_exact_stopped_g1_without_mutation \
            native_retry_pre_admission_context_keeps_historical_stopped_readable_and_rejects_running_successor; do
            grep -F "close_foundation::tests::native_retry::$test: test" evidence/selected-tests.txt
          done
          for test in \
            native_retry_dispatch_uses_original_g1_under_g2_and_replays_without_mutation \
            native_retry_dispatch_refuses_forged_identity_non_worktree_and_success \
            native_retry_dispatch_checks_stale_source_before_retained_dispatch_replay \
            generic_retry_dispatch_refuses_native_current_g1_with_stale_source \
            native_retry_dispatch_replays_historical_g1_without_retimestamping \
            native_retry_raw_dispatch_rejects_backdated_new_row \
            native_retry_raw_dispatch_rejects_g2_and_malformed_plan_without_legacy_fallthrough \
            migration_164_preserves_populated_163_rows_and_rewrites_only_dispatch_authority \
            non_native_retry_dispatch_retains_legacy_current_snapshot_authority; do
            grep -F "close_foundation::tests::native_retry::$test: test" evidence/selected-tests.txt
          done
          for test in \
            native_retry_worktree_metadata_is_source_bound_to_pending_original_g1_effect \
            migration_165_unknown_second_authority_prefix_rolls_back_first_rewrite_and_ledger \
            migration_165_refuses_native_g2_legacy_metadata_authority; do
            grep -F "close_foundation::tests::native_retry::$test: test" evidence/selected-tests.txt
          done
          for test in \
            native_scope_retirement_requires_g1_worktree_success_and_separate_scope_success \
            native_scope_retirement_rejects_forged_identity_kind_precondition_and_empty_reason \
            native_scope_retirement_rechecks_source_before_lifecycle_mutation \
            generic_scope_retirement_refuses_native_completed_retry_even_with_current_g1 \
            native_scope_retirement_preserves_unresolved_ownership_repair_blocker \
            native_scope_retirement_refuses_stopped_latest_run_without_mutation; do
            grep -F "close_foundation::tests::native_retry::$test: test" evidence/selected-tests.txt
          done
          for test in \
            aggregate_component_requires_exact_canonical_byte_lengths_and_unique_scopes \
            original_snapshots_require_matching_captured_scopes_and_nonempty_values; do
            grep -F "native_close::retry_execution::snapshot_tests::$test: test" evidence/selected-tests.txt
          done
      - name: Execute migration163 populated upgrade and authority regressions
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p phoenix-db --lib close_foundation::tests::native_retry::migration_163_ -- --nocapture --test-threads=1 2>&1 | tee evidence/migration163.log
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' evidence/migration163.log
      - name: Execute complete Close foundation module
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p phoenix-db --lib close_foundation::tests:: -- --nocapture --test-threads=1 2>&1 | tee evidence/close-foundation.log
      - name: Execute migration159 regression module selectors
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p phoenix-db --lib migrations::close_completion_allowance_tests::migration_159_ -- --nocapture --test-threads=1 2>&1 | tee evidence/migration159.log
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' evidence/migration159.log
      - name: Execute native Close DB request and observation tests
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p phoenix-db --lib native_close:: -- --nocapture --test-threads=1 2>&1 | tee evidence/native-close-db.log
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' evidence/native-close-db.log
      - name: Qualify migration-tail regression modules
        shell: bash
        run: |
          set -euo pipefail
          for module in migrations::conversation_tools_tests:: lineage::tests::goal_tools_tests::; do
            name="${module//::/-}"
            cargo test -p phoenix-db --lib "$module" -- --nocapture --test-threads=1 2>&1 | tee "evidence/$name.log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "evidence/$name.log"
          done
      - name: Qualify shared WorkScope lifecycle regression boundaries
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            database_authority_identity_is_stable_across_clones_only \
            close_attempt_retires_its_captured_active_user_owner_scope \
            completed_close_attempt_cannot_authorize_scope_retirement \
            close_attempt_cannot_authorize_uncaptured_scope_retirement \
            successful_retirement_preserves_conversation_and_scope_history; do
            grep -F "tests::$test: test" evidence/inventory.log
            cargo test -p phoenix-db --lib "tests::$test" -- --exact --nocapture --test-threads=1 2>&1 | tee "evidence/$test.log"
            grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored;' "evidence/$test.log"
          done
      - name: Retain early DB qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: close-db-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
      - name: Execute native Close runtime matcher and actor ownership tests
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p phoenix_ide --lib --no-run --message-format=json > evidence/runtime-build.jsonl
          runtime_test_binary="$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "phoenix_ide" and .profile.test == true and .executable != null) | .executable' evidence/runtime-build.jsonl)"
          test -n "$runtime_test_binary"
          test -x "$runtime_test_binary"
          export PHOENIX_RUNTIME_TEST_BINARY="$runtime_test_binary"
          printf 'PHOENIX_RUNTIME_TEST_BINARY=%s\n' "$runtime_test_binary" >> "$GITHUB_ENV"
          (cd crates/phoenix-ide && "$runtime_test_binary" --list) 2>&1 | tee evidence/runtime-inventory.log
          grep -E 'native_close_application::tests::.*: test$|native_close_admission_tests::.*: test$' evidence/runtime-inventory.log > evidence/runtime-selected-tests.txt
          grep -F 'native_close_admission_tests::native_close_backend_requires_actor_database_authority_not_matching_path: test' evidence/runtime-selected-tests.txt
          test -s evidence/runtime-selected-tests.txt
          grep -F 'stopped_live_source_refuses_exact_observe_replay_before_database_lookup: test' evidence/runtime-selected-tests.txt
          grep -E '^runtime::close_retirement::lease_custody::tests::.*: test$' evidence/runtime-inventory.log > evidence/lease-custody-selected-tests.txt
          test "$(wc -l < evidence/lease-custody-selected-tests.txt | tr -d ' ')" -gt 0
          grep -F 'runtime::close_retirement::lease_custody::tests::failed_acquisition_retains_partial_permits_without_inventing_tmux_authority: test' evidence/lease-custody-selected-tests.txt
          grep -F 'runtime::close_retirement::lease_custody::tests::multi_scope_reopen_error_returns_every_exact_permit: test' evidence/lease-custody-selected-tests.txt
          grep -F 'runtime::close_retirement::lease_custody::tests::unresolved_tmux_retry_keeps_original_partial_custody_and_deadline: test' evidence/lease-custody-selected-tests.txt
          (cd crates/phoenix-ide && "$PHOENIX_RUNTIME_TEST_BINARY" runtime::close_retirement::lease_custody::tests:: --nocapture --test-threads=1) 2>&1 | tee evidence/lease-custody-execution.log
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' evidence/lease-custody-execution.log
          (cd crates/phoenix-ide && "$PHOENIX_RUNTIME_TEST_BINARY" native_close_application::tests:: --nocapture --test-threads=1) 2>&1 | tee evidence/native-close-runtime-matcher.log
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' evidence/native-close-runtime-matcher.log
          (cd crates/phoenix-ide && "$PHOENIX_RUNTIME_TEST_BINARY" native_close_admission_tests:: --nocapture --test-threads=1) 2>&1 | tee evidence/native-close-runtime-actor.log
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' evidence/native-close-runtime-actor.log
      - name: Qualify native Close public adapter parsing and discovery
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'coordinator_tools::close_conversation::tests::native_close_parser_accepts_only_exact_action_coordinates: test' evidence/runtime-inventory.log
          grep -F 'coordinator_tools::tests::native_close_tool_requires_trusted_source_before_target_lookup: test' evidence/runtime-inventory.log
          (cd crates/phoenix-ide && "$PHOENIX_RUNTIME_TEST_BINARY" coordinator_tools::close_conversation::tests:: --nocapture --test-threads=1) 2>&1 | tee evidence/native-close-public-parser.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' evidence/native-close-public-parser.log
          for test in native_close_tool_requires_trusted_source_before_target_lookup coordinator_bash_is_available_without_platform_sandbox_support coordinator_question_registry_preserves_exact_authority; do
            (cd crates/phoenix-ide && "$PHOENIX_RUNTIME_TEST_BINARY" "coordinator_tools::tests::$test" --exact --nocapture --test-threads=1) 2>&1 | tee "evidence/$test.log"
            grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored;' "evidence/$test.log"
          done
      - name: Qualify original-bound native retry assessment
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'runtime::native_close_application::retry::tests::explicit_retry_source_requires_exact_live_occurrence_and_exact_intent: test' evidence/runtime-inventory.log
          grep -F 'runtime::close_retirement::native_retry::tests::native_retry_only_terminal_facts_release_settlement_authority: test' evidence/runtime-inventory.log
          (cd crates/phoenix-ide && "$PHOENIX_RUNTIME_TEST_BINARY" native_close_application::retry::tests:: --nocapture --test-threads=1) 2>&1 | tee evidence/native-close-retry-source.log
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' evidence/native-close-retry-source.log
          (cd crates/phoenix-ide && "$PHOENIX_RUNTIME_TEST_BINARY" close_retirement::native_retry::tests:: --nocapture --test-threads=1) 2>&1 | tee evidence/native-close-retry-execution.log
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' evidence/native-close-retry-execution.log
          grep -F 'runtime::close_retirement::tests::native_retry_source_actor_completes_original_worktree_and_scope_under_new_generation: test' evidence/runtime-inventory.log
          grep -F 'runtime::close_retirement::tests::native_retry_pending_worktree_uses_g1_under_g2_and_refuses_live_drift: test' evidence/runtime-inventory.log
          grep -F 'runtime::close_retirement::tests::native_retry_refuses_missing_duplicate_and_mismatched_original_evidence: test' evidence/runtime-inventory.log
          grep -F 'runtime::close_retirement::tests::native_retry_assessment_keeps_exact_snapshot_and_does_not_dispatch: test' evidence/runtime-inventory.log
          (cd crates/phoenix-ide && "$PHOENIX_RUNTIME_TEST_BINARY" close_retirement::tests::native_retry_ --nocapture --test-threads=1) 2>&1 | tee evidence/native-close-retry-assessment.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' evidence/native-close-retry-assessment.log
      - name: Qualify Coordinator Goal discovery migration ledger
        shell: bash
        run: |
          set -euo pipefail
          (cd crates/phoenix-ide && "$PHOENIX_RUNTIME_TEST_BINARY" coordinator_tools::goals::tests:: --nocapture --test-threads=1) 2>&1 | tee evidence/coordinator-goal-tools.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' evidence/coordinator-goal-tools.log
      - name: Require exact source formatting
        if: success() || failure()
        shell: bash
        run: |
          test ! -s evidence/hosted-format.patch
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: close-exact-source-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
