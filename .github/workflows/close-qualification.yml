name: Close exact-source qualification

on:
  workflow_dispatch:
  push:
    branches: [feat/unified-close-receipts]

permissions:
  contents: read

concurrency:
  group: close-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  specifications:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PHOENIX_CHECK_ALL: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: close-specification-qualification
      - uses: astral-sh/setup-uv@v7
      - name: Install pinned specification checker
        run: cargo install allium-cli --version 3.5.0 --locked
      - name: Validate exact-source Allium and specification shape
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source.sha
          ./dev.py check --lanes allium,spec-shape 2>&1 | tee evidence/specifications.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: close-specifications-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PHOENIX_CHECK_ALL: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v7
      - name: Upgrade corepack
        run: |
          npm i -g corepack@latest
          corepack enable
      - name: Install locked UI dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: Validate exact-source Close frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source.sha
          (cd ui && pnpm exec vitest run src/components/WorkActions.test.tsx) 2>&1 | tee evidence/close-work-actions-tests.log
          (cd ui && pnpm exec vitest run src/pages/ProductConversationPage.test.tsx) 2>&1 | tee evidence/close-product-page-tests.log
          ./dev.py check --lanes tsc,ui-lint 2>&1 | tee evidence/frontend-checks.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: close-frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  database:
    runs-on: ubuntu-latest
    # The exact-source DB and runtime suites share this job. Hosted cold builds
    # and repeated Cargo invocations exceeded 60m before physical actor coverage.
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          components: rustfmt
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: close-database-qualification
      - name: Pin source and prepare hosted-only formatting proposal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source.sha
          git rev-parse HEAD^{tree} | tee evidence/source.tree
          cargo fmt --all
          git diff --binary > evidence/hosted-format.patch
          git restore --worktree .
          git diff --exit-code
      - name: Retain hosted formatting proposal
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: close-format-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/hosted-format.patch
          if-no-files-found: error
      - name: Prepare disposable tmux integration dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y tmux coreutils
          { tmux -V; /usr/bin/timeout --version; } | tee evidence/tmux-versions.log
      - name: Validate Close loss wire and identity contract
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p phoenix-core --lib domain::close::tests:: -- --nocapture --test-threads=1 2>&1 | tee evidence/close-domain.log
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' evidence/close-domain.log
          grep -F 'test domain::close::tests::enums_expose_exact_persisted_strings ... ok' evidence/close-domain.log
      - name: Compile database tests and inventory exact selectors
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p phoenix-db --lib --no-run 2>&1 | tee evidence/compile.log
          cargo test -p phoenix-db --lib -- --list 2>&1 | tee evidence/inventory.log
          grep -E '^close_foundation::tests::.*: test$|^migrations::close_completion_allowance_tests::migration_172_.*: test$|^migrations::tests::migration_(180|181|182)_.*: test$|^native_close::.*: test$' evidence/inventory.log > evidence/selected-tests.txt
          test -s evidence/selected-tests.txt
          grep -F 'close_foundation::tests::inspection_aggregate_validator_preserves_exact_content_and_empty_generation_rules: test' evidence/selected-tests.txt
          for test in \
            initial_effect_admission_rejects_retained_losses_even_in_anomalous_phase \
            initial_loss_inspection_is_retained_and_terminalized_atomically_without_dispatch \
            initial_loss_terminalization_guards_authority_and_rolls_back_late_failure \
            first_effect_refuses_missing_dispatch_mismatched_binding_and_completed_resource \
            first_effect_callback_is_refused_on_source_loss_and_preserves_exact_result \
            first_effect_callback_holds_writer_reservation_against_source_update \
            initial_worktree_entry_requires_exact_dispatch_and_refuses_completed_reentry \
            initial_worktree_entry_rejects_durable_source_revocation_before_handoff \
            initial_worktree_metadata_requires_exact_original_dispatched_authority_and_live_source \
            initial_work_scope_retirement_rejects_unresolved_originals_then_commits_proof_atomically; do
            grep -Fx "native_close::initial::tests::$test: test" evidence/selected-tests.txt
          done
          grep -F 'stopped_original_retirement_proof_rejects_missing_and_excluded_provenance: test' evidence/selected-tests.txt
          grep -F 'dispatched_absence_retry_resumes_retirement_with_retained_snapshot: test' evidence/selected-tests.txt
          grep -F 'ordinary_and_replay_stop_fence_native_retry_and_suppress_existing_allowance: test' evidence/selected-tests.txt
          grep -F 'rejected_source_state_write_rolls_back_native_fence: test' evidence/selected-tests.txt
          for test in \
            initial_all_success_interruption_does_not_admit_automatic_completion_successor \
            historical_live_all_success_completion_replay_is_effect_free \
            concurrent_historical_completion_replays_share_one_successor \
            stale_source_refuses_historical_completion_replay_and_startup_revokes_handoff \
            idle_source_after_historical_completion_replay_stops_effect_free_successor_with_mandatory_failure \
            historical_uncertain_completion_failure_cannot_rewrite_history_disposition; do
            grep -Fx "close_foundation::tests::native_retry::$test: test" evidence/selected-tests.txt
          done
          grep -F 'startup_and_observer_interrupt_native_retry_from_original_pending_plan_preserving_allowance: test' evidence/selected-tests.txt
          grep -F 'migration_172_excludes_legacy_sealed_inventory_and_preserves_shared_g2_capture: test' evidence/selected-tests.txt
          grep -Fx 'close_foundation::tests::native_retry::migration_179_populated_upgrade_preserves_retry_and_adds_initial_source_authority: test' evidence/selected-tests.txt
          grep -F 'migration_180_upgrades_authentic_179_initial_source_fence_schema: test' evidence/selected-tests.txt
          grep -F 'migration_181_adds_unbackfilled_initial_completion_successor_authority: test' evidence/selected-tests.txt
          grep -Fx 'migrations::tests::migration_182_preserves_existing_losses_and_adds_ignored_category: test' evidence/selected-tests.txt
          grep -F 'native_retry_success_requires_exact_live_receipt_effect_and_evidence_before_replay: test' evidence/selected-tests.txt
          grep -F 'native_retry_finalizes_exact_g1_successes_without_rebinding_current_g2: test' evidence/selected-tests.txt
          grep -F 'retry_interruption_uses_pending_effect_not_successful_prior_resource: test' evidence/selected-tests.txt
          for test in \
            explicit_retry_receipt_lookup_returns_none_without_admission_or_outbox_changes \
            explicit_retry_receipt_lookup_replays_successor_without_predecessor_proof \
            explicit_retry_receipt_lookup_revalidates_source_before_existing_receipt \
            explicit_retry_receipt_lookup_refuses_nonretry_and_conflicting_source_binding; do
            grep -F "close_foundation::tests::native_retry::$test: test" evidence/selected-tests.txt
          done
          for test in \
            migration_176_upgrades_populated_162_without_rebinding_g1_or_g2 \
            migration_176_g1_failure_guards_preserve_g2_and_exact_pending_children \
            migration_176_upgrade_preserves_installed_source_fence_behavior \
            migration_176_unknown_installed_prefix_rolls_back_both_trigger_rewrites; do
            grep -F "close_foundation::tests::native_retry::$test: test" evidence/selected-tests.txt
          done
          for test in \
            generic_resource_failure_still_terminalizes_and_replays_non_native_retry \
            native_resource_failure_uses_g1_pending_tail_and_exact_stopped_replay \
            native_resource_failure_refuses_full_identity_and_caller_evidence_mismatches \
            native_resource_failure_replay_refuses_a_stopped_predecessor_after_successor_admission \
            native_resource_failure_requires_truthful_original_process_success \
            native_resource_failure_rolls_back_late_outbox_and_outcome_message_errors; do
            grep -F "close_foundation::tests::native_retry::$test: test" evidence/selected-tests.txt
          done
          for test in \
            native_retry_execution_context_reads_original_typed_plan_without_mutation \
            native_retry_execution_context_checks_live_source_before_retained_receipt \
            native_retry_execution_context_refuses_forged_receipt_wrong_failed_run_and_stopped_latest; do
            grep -F "close_foundation::tests::native_retry::$test: test" evidence/selected-tests.txt
          done
          for test in \
            native_retry_pre_admission_context_reads_exact_stopped_g1_without_mutation \
            native_retry_pre_admission_context_keeps_historical_stopped_readable_and_rejects_running_successor; do
            grep -F "close_foundation::tests::native_retry::$test: test" evidence/selected-tests.txt
          done
          for test in \
            native_retry_dispatch_uses_original_g1_under_g2_and_replays_without_mutation \
            native_retry_dispatch_refuses_forged_identity_non_worktree_and_success \
            native_retry_dispatch_checks_stale_source_before_retained_dispatch_replay \
            generic_retry_dispatch_refuses_native_current_g1_with_stale_source \
            native_retry_dispatch_replays_historical_g1_without_retimestamping \
            native_retry_raw_dispatch_rejects_backdated_new_row \
            native_retry_raw_dispatch_rejects_g2_and_malformed_plan_without_legacy_fallthrough \
            migration_177_preserves_populated_163_rows_and_rewrites_only_dispatch_authority \
            non_native_retry_dispatch_retains_legacy_current_snapshot_authority; do
            grep -F "close_foundation::tests::native_retry::$test: test" evidence/selected-tests.txt
          done
          for test in \
            native_retry_worktree_metadata_is_source_bound_to_pending_original_g1_effect \
            migration_178_unknown_second_authority_prefix_rolls_back_first_rewrite_and_ledger \
            migration_178_refuses_native_g2_legacy_metadata_authority; do
            grep -F "close_foundation::tests::native_retry::$test: test" evidence/selected-tests.txt
          done
          for test in \
            native_scope_retirement_requires_g1_worktree_success_and_separate_scope_success \
            native_scope_retirement_rejects_forged_identity_kind_precondition_and_empty_reason \
            native_scope_retirement_rechecks_source_before_lifecycle_mutation \
            generic_scope_retirement_refuses_native_completed_retry_even_with_current_g1 \
            native_scope_retirement_preserves_unresolved_ownership_repair_blocker \
            native_scope_retirement_refuses_stopped_latest_run_without_mutation; do
            grep -F "close_foundation::tests::native_retry::$test: test" evidence/selected-tests.txt
          done
          for test in \
            aggregate_component_requires_exact_canonical_byte_lengths_and_unique_scopes \
            original_snapshots_require_matching_captured_scopes_and_nonempty_values; do
            grep -F "native_close::retry_execution::snapshot_tests::$test: test" evidence/selected-tests.txt
          done
          for test in \
            initial_process_first_effect_preserves_nested_error_and_confirms_release \
            initial_pty_process_first_effect_preserves_nested_error_and_confirms_release \
            initial_process_first_effect_rejects_invalid_dispatch_binding_and_source_without_callback \
            initial_process_first_effect_revalidates_after_independent_writer_revokes_source \
            initial_process_first_effect_prior_success_or_retirement_blocks_only_exact_resource \
            initial_process_authorization_requires_exact_durable_source_scope_snapshot_and_dispatch \
            initial_process_authorization_rejects_missing_dispatch_and_stopped_or_changed_source \
            initial_process_authorization_rejects_source_changed_then_restored \
            initial_process_authorization_rejects_prior_process_success_or_positive_retirement \
            exact_initial_process_entry_is_per_resource_not_whole_kind \
            exact_initial_process_entry_missing_dispatch_never_invokes_handoff \
            exact_initial_process_entry_rejects_stopped_and_restored_source_without_handoff \
            exact_initial_process_entry_requires_original_binding_and_preserves_local_refusal \
            exact_initial_process_entry_revalidates_after_independent_writer_revokes_source \
            exact_initial_process_entry_releases_writer_before_retained_cleanup_finishes; do
            grep -F "close_foundation::tests::native_retry::$test: test" evidence/selected-tests.txt
          done
      - name: Execute migration176 populated upgrade and authority regressions
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p phoenix-db --lib close_foundation::tests::native_retry::migration_176_ -- --nocapture --test-threads=1 2>&1 | tee evidence/migration176.log
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' evidence/migration176.log
      - name: Execute native source-fence migration upgrade
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p phoenix-db --lib close_foundation::tests::native_retry::migration_179_populated_upgrade_preserves_retry_and_adds_initial_source_authority -- --exact --nocapture --test-threads=1 2>&1 | tee evidence/migration179.log
          grep -E 'test result: ok\. 1 passed; 0 failed; 0 ignored;' evidence/migration179.log
      - name: Execute initial-interruption migration upgrade
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p phoenix-db --lib migrations::tests::migration_180_upgrades_authentic_179_initial_source_fence_schema -- --exact --nocapture --test-threads=1 2>&1 | tee evidence/migration180.log
          grep -E 'test result: ok\. 1 passed; 0 failed; 0 ignored;' evidence/migration180.log
      - name: Execute initial completion retry-admission migration upgrade
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p phoenix-db --lib migrations::tests::migration_181_adds_unbackfilled_initial_completion_successor_authority -- --exact --nocapture --test-threads=1 2>&1 | tee evidence/migration181.log
          grep -E 'test result: ok\. 1 passed; 0 failed; 0 ignored;' evidence/migration181.log
      - name: Execute populated ignored-loss migration upgrade
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p phoenix-db --lib migrations::tests::migration_182_preserves_existing_losses_and_adds_ignored_category -- --exact --nocapture --test-threads=1 2>&1 | tee evidence/migration182.log
          grep -E 'test result: ok\. 1 passed; 0 failed; 0 ignored;' evidence/migration182.log
      - name: Execute complete Close foundation module
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p phoenix-db --lib close_foundation::tests:: -- --nocapture --test-threads=1 2>&1 | tee evidence/close-foundation.log
          grep -F 'test close_foundation::tests::inspection_aggregate_validator_preserves_exact_content_and_empty_generation_rules ... ok' evidence/close-foundation.log
          for test in \
            initial_process_first_effect_preserves_nested_error_and_confirms_release \
            initial_pty_process_first_effect_preserves_nested_error_and_confirms_release \
            initial_process_first_effect_rejects_invalid_dispatch_binding_and_source_without_callback \
            initial_process_first_effect_revalidates_after_independent_writer_revokes_source \
            initial_process_first_effect_prior_success_or_retirement_blocks_only_exact_resource \
            initial_process_authorization_requires_exact_durable_source_scope_snapshot_and_dispatch \
            initial_process_authorization_rejects_missing_dispatch_and_stopped_or_changed_source \
            initial_process_authorization_rejects_source_changed_then_restored \
            initial_process_authorization_rejects_prior_process_success_or_positive_retirement \
            exact_initial_process_entry_is_per_resource_not_whole_kind \
            exact_initial_process_entry_missing_dispatch_never_invokes_handoff \
            exact_initial_process_entry_rejects_stopped_and_restored_source_without_handoff \
            exact_initial_process_entry_requires_original_binding_and_preserves_local_refusal \
            exact_initial_process_entry_revalidates_after_independent_writer_revokes_source \
            exact_initial_process_entry_releases_writer_before_retained_cleanup_finishes; do
            grep -F "test close_foundation::tests::native_retry::$test ... ok" evidence/close-foundation.log
          done
      - name: Execute migration172 regression module selectors
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p phoenix-db --lib migrations::close_completion_allowance_tests::migration_172_ -- --nocapture --test-threads=1 2>&1 | tee evidence/migration172.log
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' evidence/migration172.log
      - name: Execute native Close DB request and observation tests
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p phoenix-db --lib native_close:: -- --nocapture --test-threads=1 2>&1 | tee evidence/native-close-db.log
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' evidence/native-close-db.log
          for test in \
            initial_effect_admission_rejects_retained_losses_even_in_anomalous_phase \
            initial_loss_inspection_is_retained_and_terminalized_atomically_without_dispatch \
            initial_loss_terminalization_guards_authority_and_rolls_back_late_failure \
            first_effect_refuses_missing_dispatch_mismatched_binding_and_completed_resource \
            first_effect_callback_is_refused_on_source_loss_and_preserves_exact_result \
            first_effect_callback_holds_writer_reservation_against_source_update; do
            grep -F "test native_close::initial::tests::$test ... ok" evidence/native-close-db.log
          done
      - name: Execute complete migrations regression module
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p phoenix-db --lib migrations:: -- --nocapture --test-threads=1 2>&1 | tee evidence/migrations-full.log
          grep -E 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' evidence/migrations-full.log
      - name: Qualify migration-tail regression modules
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for module in migrations::conversation_tools_tests:: lineage::tests::goal_tools_tests:: conversation_goals::prepared::tests::; do
            name="${module//::/-}"
            if ! cargo test -p phoenix-db --lib "$module" -- --nocapture --test-threads=1 2>&1 | tee "evidence/$name.log"; then
              failed=1
            fi
            grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "evidence/$name.log" || failed=1
          done
          grep -Fx 'test lineage::tests::goal_tools_tests::canonical_goal_tools_prefixes_upgrade_reopen_and_remain_idempotent ... ok' evidence/lineage-tests-goal_tools_tests-.log || failed=1
          test "$failed" -eq 0
      - name: Qualify shared WorkScope lifecycle regression boundaries
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            database_authority_identity_is_stable_across_clones_only \
            close_attempt_retires_its_captured_active_user_owner_scope \
            completed_close_attempt_cannot_authorize_scope_retirement \
            close_attempt_cannot_authorize_uncaptured_scope_retirement \
            successful_retirement_preserves_conversation_and_scope_history; do
            grep -F "tests::$test: test" evidence/inventory.log
            cargo test -p phoenix-db --lib "tests::$test" -- --exact --nocapture --test-threads=1 2>&1 | tee "evidence/$test.log"
            grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored;' "evidence/$test.log"
          done
      - name: Retain early DB qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: close-db-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
      - name: Execute native Close runtime matcher and actor ownership tests
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p phoenix_ide --bin phoenix_ide --message-format=json > evidence/runtime-launcher-build.jsonl
          launch_exe="$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "phoenix_ide" and (.target.kind | index("bin")) != null and .executable != null) | .executable' evidence/runtime-launcher-build.jsonl)"
          test -n "$launch_exe"
          test -x "$launch_exe"
          export PHOENIX_BASH_LAUNCH_TEST_EXE="$(realpath "$launch_exe")"
          export PHOENIX_BASH_LAUNCH_TEST_REQUIRED=1
          printf 'PHOENIX_BASH_LAUNCH_TEST_REQUIRED=1\n' >> "$GITHUB_ENV"
          printf 'PHOENIX_BASH_LAUNCH_TEST_EXE=%s\n' "$PHOENIX_BASH_LAUNCH_TEST_EXE" >> "$GITHUB_ENV"
          cargo test -p phoenix_ide --lib --no-run --message-format=json > evidence/runtime-build.jsonl
          runtime_test_binary="$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "phoenix_ide" and .profile.test == true and .executable != null) | .executable' evidence/runtime-build.jsonl)"
          test -n "$runtime_test_binary"
          test -x "$runtime_test_binary"
          export PHOENIX_RUNTIME_TEST_BINARY="$runtime_test_binary"
          printf 'PHOENIX_RUNTIME_TEST_BINARY=%s\n' "$runtime_test_binary" >> "$GITHUB_ENV"
          (cd crates/phoenix-ide && "$runtime_test_binary" --list) 2>&1 | tee evidence/runtime-inventory.log
          grep -E 'native_close_application::tests::.*: test$|native_close_admission_tests::.*: test$' evidence/runtime-inventory.log > evidence/runtime-selected-tests.txt
          grep -F 'native_close_admission_tests::native_close_backend_requires_actor_database_authority_not_matching_path: test' evidence/runtime-selected-tests.txt
          grep -F 'native_close_admission_tests::bash_stage2_stop_ack::bash_stage_two_stop_ack_reaches_real_second_writer_and_cleans_once: test' evidence/runtime-selected-tests.txt
          grep -F 'native_close_admission_tests::bash_stage2_unknown_release::bash_second_writer_injected_unknown_release_quarantines_original_owner: test' evidence/runtime-selected-tests.txt
          grep -F 'native_close_admission_tests::bash_stage2_unknown_release::bash_second_writer_unknown_release_retains_owner_after_public_close_waiter_drop: test' evidence/runtime-selected-tests.txt
          for test in \
            native_close_retires_one_registered_real_bash_group \
