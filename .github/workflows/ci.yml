name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-worker-budget:
    name: check worker budget (exact source)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PHOENIX_CHECK_ALL: ""
      PHOENIX_CHECK_BASE: origin/main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Focused command-construction regressions (no compiler)
        run: |
          python -m unittest discover -s tests/devpy -p test_check_plan.py
          PHOENIX_CHECK_WORKERS=1 python -m unittest discover -s tests/devpy -p test_check_plan.py

  plan_check:
    name: plan check lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      clippy: ${{ steps.plan.outputs.clippy }}
      e2e: ${{ steps.plan.outputs.e2e }}
      ui: ${{ steps.plan.outputs.ui }}
      fast: ${{ steps.plan.outputs.fast }}
      active_lanes: ${{ steps.plan.outputs.active_lanes }}
    env:
      PHOENIX_CHECK_ALL: ${{ github.event_name == 'push' && '1' || '' }}
      PHOENIX_CHECK_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Compute check plan
        id: plan
        run: |
          ./dev.py check-plan --format github-env > check-plan.env
          cat check-plan.env
          cat check-plan.env >> "$GITHUB_OUTPUT"

  check-rust:
    name: check (rust)
    needs: plan_check
    if: ${{ needs.plan_check.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      PHOENIX_CHECK_ALL: ${{ github.event_name == 'push' && '1' || '' }}
      PHOENIX_CHECK_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
      PHOENIX_CHECK_CARGO_TEST_TIMEOUT_SECS: "1200"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          target: x86_64-unknown-linux-musl
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
          shared-key: check-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v1-rust
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Configure git identity
        run: |
          git config --global user.email "ci@phoenix-ide.invalid"
          git config --global user.name "Phoenix CI"
      - name: Install musl compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: ./dev.py check (rust,cargo-fmt)
        run: ./dev.py check --lanes rust,cargo-fmt
      - name: Check production feature on musl
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo check --target x86_64-unknown-linux-musl --features phoenix_ide/datadog-tracing

  check-clippy:
    name: check (clippy)
    needs: plan_check
    if: ${{ needs.plan_check.outputs.clippy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      PHOENIX_CHECK_ALL: ${{ github.event_name == 'push' && '1' || '' }}
      PHOENIX_CHECK_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
          shared-key: check-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v1-rust
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Configure git identity
        run: |
          git config --global user.email "ci@phoenix-ide.invalid"
          git config --global user.name "Phoenix CI"
      - name: ./dev.py check (clippy)
        run: ./dev.py check --lanes clippy

  check-e2e:
    name: check (e2e)
    needs: plan_check
    if: ${{ needs.plan_check.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      PHOENIX_CHECK_ALL: ${{ github.event_name == 'push' && '1' || '' }}
      PHOENIX_CHECK_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
          shared-key: check-e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v1-rust
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Configure git identity
        run: |
          git config --global user.email "ci@phoenix-ide.invalid"
          git config --global user.name "Phoenix CI"
      - name: ./dev.py check (e2e)
        run: ./dev.py check --lanes e2e

  check-ui:
    name: check (ui/specs)
    needs: plan_check
    if: ${{ needs.plan_check.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      PHOENIX_CHECK_ALL: ${{ github.event_name == 'push' && '1' || '' }}
      PHOENIX_CHECK_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
          shared-key: check-ui
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v1-rust
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Upgrade corepack
        run: |
          npm i -g corepack@latest
          corepack enable
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install ast-grep
        run: npm i -g @ast-grep/cli
      - name: Install allium-cli
        env:
          ALLIUM_VERSION: 3.5.0
        run: |
          if ! allium --version 2>/dev/null | grep -q "$ALLIUM_VERSION"; then
            cargo install allium-cli --version "$ALLIUM_VERSION" --locked
          fi
      - name: Configure git identity
        run: |
          git config --global user.email "ci@phoenix-ide.invalid"
          git config --global user.name "Phoenix CI"
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: ./dev.py check (ui/specs)
        run: ./dev.py check --lanes tsc,ui-lint,vitest,ast-grep,allium,spec-shape,spec-anchors,pkglock

  check-finalization-geometry:
    name: check (assistant finalization geometry)
    needs: plan_check
    if: ${{ needs.plan_check.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install fixture dependencies and browser
        working-directory: ui
        run: |
          npm i -g corepack@latest
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Qualify exact-source geometry and reader ownership
        env:
          LADLE_URL: http://127.0.0.1:61129
          PHOENIX_LADLE: '1'
        run: |
          mkdir -p ui/qa-artifacts/assistant-finalization
          git rev-parse HEAD > ui/qa-artifacts/assistant-finalization/source.txt
          server=''
          stop_server() {
            if [ -n "$server" ]; then kill -- -"$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true; server=''; fi
          }
          start_server() {
            setsid python3 -c 'import runpy,os; d=runpy.run_path("dev.py"); env=d["node_env"](); os.chdir("ui"); os.execvpe("node",["node","node_modules/@ladle/react/lib/cli/cli.js","serve","--host","127.0.0.1","--port","61129"],env)' >> ui/qa-artifacts/assistant-finalization/ladle.log 2>&1 &
            server=$!
            for attempt in $(seq 1 60); do
              if curl -fsS "$LADLE_URL" >/dev/null; then return; fi
              sleep 1
            done
            return 1
          }
          trap stop_server EXIT
          sha256sum ui/src/index.css ui/src/components/StreamingMessage.tsx ui/src/components/MessageComponents.tsx > ui/qa-artifacts/assistant-finalization/source-files.sha256
          start_server
          cd ui
          node scripts/capture-assistant-finalization.mjs
          node scripts/capture-streaming-table.mjs
          node scripts/capture-assistant-finalization-transcript.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-finalization-geometry-${{ github.sha }}
          path: ui/qa-artifacts/

  check-fast:
    name: check (task validation)
    needs: plan_check
    if: ${{ needs.plan_check.outputs.fast == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PHOENIX_CHECK_ALL: ${{ github.event_name == 'push' && '1' || '' }}
      PHOENIX_CHECK_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Test roadmap Issue reducer
        run: node --test scripts/roadmap-issue-reducer.test.mjs
      - name: ./dev.py check (task)
        run: ./dev.py check --lanes task

  notify-main-failure:
    name: Open issue on main CI failure
    needs: [plan_check, check-rust, check-clippy, check-e2e, check-ui, check-fast]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(join(needs.*.result, ','), 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the CI-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CI failing on main"
          number=$(gh issue list --repo "$REPO" --state open --search "$title in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" \
              --body "Still failing at \`$SHA\` — $RUN_URL"
          else
            body=$(printf 'CI is failing on `main`.\n\nFirst seen at `%s`\nRun: %s' "$SHA" "$RUN_URL")
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi

  close-main-failure:
    name: Close CI-failure issue on green
    needs: [plan_check, check-rust, check-clippy, check-e2e, check-ui, check-fast]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(join(needs.*.result, ','), 'failure') && !contains(join(needs.*.result, ','), 'cancelled') && !contains(join(needs.*.result, ','), 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close the open CI-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          title="CI failing on main"
          number=$(gh issue list --repo "$REPO" --state open --search "$title in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "Green again at \`$SHA\`. Closing."
            gh issue close "$number" --repo "$REPO"
          fi
