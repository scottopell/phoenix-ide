name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ./dev.py check
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # GH runners have outbound network — let network-gated Rust tests run
      # instead of auto-skipping. (dev.py probes and would skip on failure;
      # leaving this unset keeps the probe authoritative.)
      CARGO_TERM_COLOR: always
      # sccache wraps rustc and content-addresses every compilation, so a PR
      # reuses object files for any crate whose source is unchanged vs the
      # cached build — including across Cargo.lock changes that defeat the
      # rust-cache target/ snapshot. Backs up the Cache Cargo step below.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      # --- Toolchains -----------------------------------------------------

      # Reads rust-toolchain.toml: pins 1.94.1, pulls rustfmt + clippy and
      # the x86_64-unknown-linux-musl target declared there.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false # Swatinem below gives finer control + bin caching

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Keep ~/.cargo/bin (cargo-nextest, allium) across runs.
          cache-bin: true
          # One bucket shared by main + every PR (no per-branch key). A PR
          # whose Cargo.lock differs from main misses the exact key but hits
          # rust-cache's restore-key prefix and warm-starts from main's
          # dependency artifacts, recompiling only what actually changed.
          # (An earlier `key: profile-${hashFiles('Cargo.toml')}` exiled every
          # branch with any Cargo.toml delta to its own cold bucket that the
          # post-step never re-saved — persistent full cold compiles.)
          shared-key: check
          # Only main writes the bucket; PRs restore it read-only, so one
          # continuously-warm cache survives instead of PR branches evicting
          # main's under the 10 GB limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Bump to force a cold rebuild after a [profile] edit (the only
          # change that silently invalidates a restored target/).
          prefix-key: v1-rust

      # Installs the sccache binary and wires up the GitHub Actions cache
      # backend it writes to. RUSTC_WRAPPER / SCCACHE_GHA_ENABLED are set at
      # the job level so every cargo invocation (including dev.py's) routes
      # rustc through sccache.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # Reads packageManager from ui/package.json — single source of truth.
        with:
          package_json_file: ui/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # dev.py's ensure_corepack_pnpm() enforces a corepack floor (pnpm 11.x
      # signing keys). The corepack bundled with older Node LTS is too old;
      # install the latest so dev.py's preflight passes.
      - name: Upgrade corepack
        run: |
          npm i -g corepack@latest
          corepack enable

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        # dev.py runs via `uv run` (PEP 723 inline deps incl. taskmd).

      # --- Optional check dependencies (so nothing is skipped) ------------

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install ast-grep
        run: npm i -g @ast-grep/cli

      # allium-cli has no prebuilt binstall artifact; compile it. Cached in
      # ~/.cargo/bin by the rust-cache step above (cache-bin: true).
      - name: Install allium-cli
        run: |
          if ! command -v allium >/dev/null 2>&1; then
            cargo install allium-cli --locked
          fi

      # Chrome on PATH → dev.py's _classify_browser_env() sets
      # PHOENIX_CHROME_EXECUTABLE and the browser tests run instead of
      # auto-skipping.
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-dependencies: true

      # --- Repo prep ------------------------------------------------------

      # Some Rust tests run `git commit`; give git an identity. dev.py
      # already disables gpgsign for child processes if signing probes fail.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@phoenix-ide.invalid"
          git config --global user.name "Phoenix CI"

      # Install UI deps up front with the frozen lockfile so dev.py's own
      # ensure_ui_deps() finds node_modules and skips a non-frozen install
      # (which could otherwise drift the lockfile and trip pkglock-clean).
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ui

      # --- The gate -------------------------------------------------------

      - name: ./dev.py check
        run: ./dev.py check

  # A failed `check` on main would otherwise be silent. Track it as a single
  # deduplicated issue: open (or comment on) it on failure, close it on the
  # next green push. PR failures are visible on the PR itself, so these only
  # fire for pushes to main.
  notify-main-failure:
    name: Open issue on main CI failure
    needs: check
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the CI-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CI failing on main"
          number=$(gh issue list --repo "$REPO" --state open --search "$title in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" \
              --body "Still failing at \`$SHA\` — $RUN_URL"
          else
            body=$(printf 'CI is failing on `main`.\n\nFirst seen at `%s`\nRun: %s' "$SHA" "$RUN_URL")
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi

  close-main-failure:
    name: Close CI-failure issue on green
    needs: check
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close the open CI-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          title="CI failing on main"
          number=$(gh issue list --repo "$REPO" --state open --search "$title in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "Green again at \`$SHA\`. Closing."
            gh issue close "$number" --repo "$REPO"
          fi
