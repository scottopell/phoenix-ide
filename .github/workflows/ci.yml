name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan_check:
    name: plan check lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      clippy: ${{ steps.plan.outputs.clippy }}
      e2e: ${{ steps.plan.outputs.e2e }}
      ui: ${{ steps.plan.outputs.ui }}
      fast: ${{ steps.plan.outputs.fast }}
      active_lanes: ${{ steps.plan.outputs.active_lanes }}
    env:
      PHOENIX_CHECK_ALL: ${{ github.event_name == 'push' && '1' || '' }}
      PHOENIX_CHECK_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Compute check plan
        id: plan
        run: |
          ./dev.py check-plan --format github-env | tee check-plan.env
          cat check-plan.env >> "$GITHUB_OUTPUT"

  check-rust:
    name: check (rust)
    needs: plan_check
    if: ${{ needs.plan_check.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      PHOENIX_CHECK_ALL: ${{ github.event_name == 'push' && '1' || '' }}
      PHOENIX_CHECK_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
          shared-key: check-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v1-rust
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Configure git identity
        run: |
          git config --global user.email "ci@phoenix-ide.invalid"
          git config --global user.name "Phoenix CI"
      - name: ./dev.py check (rust,cargo-fmt)
        run: ./dev.py check --lanes rust,cargo-fmt

  check-clippy:
    name: check (clippy)
    needs: plan_check
    if: ${{ needs.plan_check.outputs.clippy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      PHOENIX_CHECK_ALL: ${{ github.event_name == 'push' && '1' || '' }}
      PHOENIX_CHECK_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
          shared-key: check-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v1-rust
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Configure git identity
        run: |
          git config --global user.email "ci@phoenix-ide.invalid"
          git config --global user.name "Phoenix CI"
      - name: ./dev.py check (clippy)
        run: ./dev.py check --lanes clippy

  check-e2e:
    name: check (e2e)
    needs: plan_check
    if: ${{ needs.plan_check.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      PHOENIX_CHECK_ALL: ${{ github.event_name == 'push' && '1' || '' }}
      PHOENIX_CHECK_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
          shared-key: check-e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v1-rust
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Configure git identity
        run: |
          git config --global user.email "ci@phoenix-ide.invalid"
          git config --global user.name "Phoenix CI"
      - name: ./dev.py check (e2e)
        run: ./dev.py check --lanes e2e

  check-ui:
    name: check (ui/specs)
    needs: plan_check
    if: ${{ needs.plan_check.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      PHOENIX_CHECK_ALL: ${{ github.event_name == 'push' && '1' || '' }}
      PHOENIX_CHECK_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
          shared-key: check-ui
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v1-rust
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Upgrade corepack
        run: |
          npm i -g corepack@latest
          corepack enable
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install ast-grep
        run: npm i -g @ast-grep/cli
      - name: Install allium-cli
        env:
          ALLIUM_VERSION: 3.5.0
        run: |
          if ! allium --version 2>/dev/null | grep -q "$ALLIUM_VERSION"; then
            cargo install allium-cli --version "$ALLIUM_VERSION" --locked
          fi
      - name: Configure git identity
        run: |
          git config --global user.email "ci@phoenix-ide.invalid"
          git config --global user.name "Phoenix CI"
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: ./dev.py check (ui/specs)
        run: ./dev.py check --lanes tsc,ui-lint,vitest,ast-grep,allium,spec-shape,spec-anchors,pkglock

  check-fast:
    name: check (task validation)
    needs: plan_check
    if: ${{ needs.plan_check.outputs.fast == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PHOENIX_CHECK_ALL: ${{ github.event_name == 'push' && '1' || '' }}
      PHOENIX_CHECK_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: ./dev.py check (task)
        run: ./dev.py check --lanes task

  notify-main-failure:
    name: Open issue on main CI failure
    needs: [plan_check, check-rust, check-clippy, check-e2e, check-ui, check-fast]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(join(needs.*.result, ','), 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the CI-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CI failing on main"
          number=$(gh issue list --repo "$REPO" --state open --search "$title in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" \
              --body "Still failing at \`$SHA\` — $RUN_URL"
          else
            body=$(printf 'CI is failing on `main`.\n\nFirst seen at `%s`\nRun: %s' "$SHA" "$RUN_URL")
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi

  close-main-failure:
    name: Close CI-failure issue on green
    needs: [plan_check, check-rust, check-clippy, check-e2e, check-ui, check-fast]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(join(needs.*.result, ','), 'failure') && !contains(join(needs.*.result, ','), 'cancelled') && !contains(join(needs.*.result, ','), 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close the open CI-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          title="CI failing on main"
          number=$(gh issue list --repo "$REPO" --state open --search "$title in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "Green again at \`$SHA\`. Closing."
            gh issue close "$number" --repo "$REPO"
          fi
