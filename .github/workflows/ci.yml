name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-worker-budget:
    name: check worker budget (exact source)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PHOENIX_CHECK_ALL: ""
      PHOENIX_CHECK_BASE: origin/main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Focused command-construction regressions (no compiler)
        run: |
          python -m unittest discover -s tests/devpy -p test_check_plan.py
          PHOENIX_CHECK_WORKERS=1 python -m unittest discover -s tests/devpy -p test_check_plan.py

  plan_check:
    name: plan check lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      clippy: ${{ steps.plan.outputs.clippy }}
      e2e: ${{ steps.plan.outputs.e2e }}
      ui: ${{ steps.plan.outputs.ui }}
      fast: ${{ steps.plan.outputs.fast }}
      active_lanes: ${{ steps.plan.outputs.active_lanes }}
    env:
      PHOENIX_CHECK_ALL: ${{ github.event_name == 'push' && '1' || '' }}
      PHOENIX_CHECK_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Compute check plan
        id: plan
        run: |
          ./dev.py check-plan --format github-env > check-plan.env
          cat check-plan.env
          cat check-plan.env >> "$GITHUB_OUTPUT"

  check-rust:
    name: check (rust)
    needs: plan_check
    if: ${{ needs.plan_check.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      PHOENIX_CHECK_ALL: ${{ github.event_name == 'push' && '1' || '' }}
      PHOENIX_CHECK_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
      PHOENIX_CHECK_CARGO_TEST_TIMEOUT_SECS: "1500"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          target: x86_64-unknown-linux-musl
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
          shared-key: check-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v1-rust
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Configure git identity
        run: |
          git config --global user.email "ci@phoenix-ide.invalid"
          git config --global user.name "Phoenix CI"
      - name: Install musl compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: ./dev.py check (rust,cargo-fmt)
        run: ./dev.py check --lanes rust,cargo-fmt
      - name: Check production feature on musl
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo check --target x86_64-unknown-linux-musl --features phoenix_ide/datadog-tracing

  check-clippy:
    name: check (clippy)
    needs: plan_check
    if: ${{ needs.plan_check.outputs.clippy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      PHOENIX_CHECK_ALL: ${{ github.event_name == 'push' && '1' || '' }}
      PHOENIX_CHECK_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
          shared-key: check-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v1-rust
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Configure git identity
        run: |
          git config --global user.email "ci@phoenix-ide.invalid"
          git config --global user.name "Phoenix CI"
      - name: ./dev.py check (clippy)
        run: ./dev.py check --lanes clippy

  check-e2e:
    name: check (e2e)
    needs: plan_check
    if: ${{ needs.plan_check.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      PHOENIX_CHECK_ALL: ${{ github.event_name == 'push' && '1' || '' }}
      PHOENIX_CHECK_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
          shared-key: check-e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v1-rust
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Configure git identity
        run: |
          git config --global user.email "ci@phoenix-ide.invalid"
          git config --global user.name "Phoenix CI"
      - name: ./dev.py check (e2e)
        run: ./dev.py check --lanes e2e

  qualify-history-realserver:
    name: typed codegen and isolated instrumented opening witness (not shipping)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'qualification/continuation-opening-codegen' || github.head_ref == 'integration/v013-history-current-main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      RAYON_NUM_THREADS: "2"
      RUST_TEST_THREADS: "2"
      APP_ROOT: ${{ github.workspace }}/pinned-app
      APP_BUILD_RECEIPT: ${{ github.workspace }}/history-build.json
      PHOENIX_CHECK_ALL: "1"
      PHOENIX_CHECK_WORKERS: "2"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 353a1b98cbb566d25c9f84ba415bcec683db4d63
          path: pinned-app
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.95.0'
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pinned-app -> target
          shared-key: check-e2e
          prefix-key: v1-rust
          save-if: false
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: pinned-app/ui/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - name: Compiler-free harness regressions
        working-directory: harness
        run: |
          uv run tests/e2e/history_browser.test.py
          node --test ui/scripts/qualify-history-realserver.selftest.mjs
          node --check ui/scripts/qualify-history-realserver.mjs
      - name: Build separate stock and controlled UI artifacts (not runtime qualification)
        timeout-minutes: 10
        working-directory: pinned-app/ui
        run: |
          pnpm install --frozen-lockfile
          node node_modules/vite/bin/vite.js build
          node node_modules/vite/bin/vite.js build --config vite.controlled-functional.config.ts --mode controlled-functional
          python3 - <<'PY'
          import importlib.util,json
          from pathlib import Path
          root=Path.cwd().parent
          spec=importlib.util.spec_from_file_location('artifact', root.parent/'harness/tests/e2e/history_controlled_artifact.py')
          import sys
          module=importlib.util.module_from_spec(spec); sys.modules[spec.name]=module; spec.loader.exec_module(module)
          source='353a1b98cbb566d25c9f84ba415bcec683db4d63'; tree='4efd49a3b7746a3093ce9dce3dac37c1175b5d54'
          for mode,name in [('stock_natural','stock-natural-build.json'),('controlled_functional','controlled-functional-build.json')]:
              module.admit_artifact(root, root/'ui'/name, source, tree, mode)
          (root.parent/'opening-ui-build-owner.json').write_text(json.dumps({'app_source':source,'app_tree':tree,
              'ui_artifacts':module.build_owner_binding(root), 'scope':'hosted exact-source two-build attestation; not runtime acceptance'},indent=2))
          PY
      - name: Genuine typed-contract codegen through existing dev.py
        timeout-minutes: 10
        shell: bash
        working-directory: pinned-app
        run: |
          test "$(git rev-parse HEAD)" = 353a1b98cbb566d25c9f84ba415bcec683db4d63
          test "$(git rev-parse HEAD^{tree})" = 4efd49a3b7746a3093ce9dce3dac37c1175b5d54
          test "$(git merge-base HEAD 1f9529c634a074c6ab6ea36eb15ca284770df1a5)" = 1f9529c634a074c6ab6ea36eb15ca284770df1a5
          git config user.email ci@phoenix-ide.invalid
          git config user.name 'Phoenix CI'
          ./dev.py codegen 2>&1 | tee "$GITHUB_WORKSPACE/opening-codegen.log"
          git diff --exit-code -- Cargo.lock ui/pnpm-lock.yaml
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path.cwd()
          files = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in sorted((root / 'ui/src/generated').glob('*.ts'))}
          telemetry = {str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
                       for path in [root/'ui/scripts/qualify-view-telemetry.mjs',
                                    root/'ui/scripts/view-telemetry-diagnostics.mjs',
                                    root/'tests/e2e/view_telemetry_sink.py',
                                    root/'tests/e2e/assert_view_telemetry.py']}
          pathlib.Path('../opening-codegen-receipt.json').write_text(json.dumps({
              'app_source': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'app_tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'app_base': subprocess.check_output(['git','merge-base','HEAD','1f9529c634a074c6ab6ea36eb15ca284770df1a5'],text=True).strip(),
              'telemetry_modules': telemetry,
              'harness_source': '${{ github.event.pull_request.head.sha }}',
              'rustc': subprocess.check_output(['rustc','--version'],text=True).strip(),
              'cargo_lock_sha256': hashlib.sha256((root/'Cargo.lock').read_bytes()).hexdigest(),
              'codegen_command': './dev.py codegen', 'generated_files': files}, indent=2))
          PY
      - name: Execute owned Coordinator continuation admission fixture
        shell: bash
        working-directory: pinned-app
        run: |
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          command=['cargo','test','-p','phoenix-db','coordinator_continuation_commit_admits_automatic_work','--','--nocapture','--test-threads=1']
          out=Path.cwd().parent
          git=lambda *args:subprocess.check_output(['git',*args],text=True).strip()
          try:
              completed=subprocess.run(command,capture_output=True,text=True,timeout=900)
          except subprocess.TimeoutExpired as error:
              text=lambda value:value.decode('utf-8','replace') if isinstance(value,bytes) else (value or '')
              (out/'opening-coordinator-home-fixture.log').write_text(text(error.stdout)+text(error.stderr))
              (out/'opening-coordinator-home-fixture-receipt.json').write_text(json.dumps({
                  'app_source':git('rev-parse','HEAD'),'app_tree':git('rev-parse','HEAD^{tree}'),
                  'app_base':'1f9529c634a074c6ab6ea36eb15ca284770df1a5',
                  'command':command,'exit_status':None,'timed_out':True,'timeout_seconds':900,
                  'scope':'failed actual DB fixture timeout, not qualification'},indent=2))
              raise
          (out/'opening-coordinator-home-fixture.log').write_text(completed.stdout+completed.stderr)
          (out/'opening-coordinator-home-fixture-receipt.json').write_text(json.dumps({
              'app_source':git('rev-parse','HEAD'),'app_tree':git('rev-parse','HEAD^{tree}'),
              'app_base':'1f9529c634a074c6ab6ea36eb15ca284770df1a5',
              'command':command,'exit_status':completed.returncode,
              'scope':'actual DB owned-home continuation admission test, not app/browser qualification'},indent=2))
          assert completed.returncode == 0, 'owned Coordinator fixture failed; see retained log'
          assert '1 passed; 0 failed' in completed.stdout, completed.stdout
          PY
      - name: Verify and retain instrumented libtest executable (not shipping runtime)
        shell: bash
        working-directory: pinned-app
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re, shutil, subprocess
          root = pathlib.Path.cwd()
          selector = ['cargo', 'test', '--no-run', '--message-format=json']
          try:
              selected = subprocess.run(selector, capture_output=True, text=True, timeout=900)
          except subprocess.TimeoutExpired as error:
              (root.parent/'opening-instrumented-selector.log').write_bytes((error.stdout or b'')+(error.stderr or b''))
              raise
          (root.parent/'opening-instrumented-selector.log').write_text(selected.stdout+selected.stderr)
          assert selected.returncode == 0, 'libtest artifact metadata selection failed'
          artifacts = [json.loads(line) for line in selected.stdout.splitlines() if line.startswith('{')]
          candidates = [pathlib.Path(artifact['executable']) for artifact in artifacts
                        if artifact.get('reason') == 'compiler-artifact'
                        and artifact.get('target',{}).get('name') == 'phoenix_ide'
                        and 'lib' in artifact.get('target',{}).get('kind',[])
                        and artifact.get('profile',{}).get('test') is True
                        and artifact.get('executable')]
          assert len(candidates) == 1, f'ambiguous instrumented libtest candidates: {candidates}'
          executable = candidates[0]
          assert executable.resolve().is_relative_to((root/'target').resolve())
          listed = subprocess.run([str(executable), '--list'], capture_output=True, text=True, timeout=10)
          assert listed.returncode == 0 and 'opening_qualifier::actual_server_opening_qualifier: test' in listed.stdout
          destination = root.parent/'opening-instrumented-libtest'
          shutil.copyfile(executable, destination)
          destination.chmod(0o700)
          command = [str(destination), 'opening_qualifier::', '--nocapture', '--test-threads=1']
          completed = subprocess.run(command, capture_output=True, text=True, timeout=120)
          (root.parent/'opening-instrumented-unit.log').write_text(completed.stdout+completed.stderr)
          receipt = json.loads((root.parent/'opening-codegen-receipt.json').read_text())
          ui_owner = json.loads((root.parent/'opening-ui-build-owner.json').read_text())
          assert ui_owner['app_source'] == receipt['app_source'] and ui_owner['app_tree'] == receipt['app_tree']
          receipt['ui_artifacts'] = ui_owner['ui_artifacts']
          receipt.update({'evidence_class':'instrumented_cfg_test_library_not_shipping_runtime',
                          'executable_sha256':hashlib.sha256(destination.read_bytes()).hexdigest(),
                          'compiled_executable_path':str(executable.relative_to(root)),
                          'compiler_artifact_selector':selector,
                          'ui_lock_sha256':hashlib.sha256((root/'ui/pnpm-lock.yaml').read_bytes()).hexdigest(),
                          'ui_files':{str(path.relative_to(root/'ui/dist')):hashlib.sha256(path.read_bytes()).hexdigest()
                                      for path in sorted((root/'ui/dist').rglob('*'))
                                      if path.is_file() and path.name != '.gitkeep'},
                          'focused_test_command':command[1:], 'focused_test_exit':completed.returncode,
                          'ignored_driver':'opening_qualifier::actual_server_opening_qualifier'})
          (root.parent/'opening-instrumented-receipt.json').write_text(json.dumps(receipt,indent=2))
          assert completed.returncode == 0, 'instrumentation guard tests failed; see retained log'
          assert '11 passed; 0 failed; 1 ignored' in completed.stdout, completed.stdout
          witness_name = 'api::view_journey::tests::collector_witness_requires_real_auth_and_validation_and_counts_each_acceptance'
          assert witness_name + ': test' in listed.stdout
          witness_command = [str(destination), witness_name, '--exact', '--nocapture', '--test-threads=1']
          witness = subprocess.run(witness_command, capture_output=True, text=True, timeout=120)
          (root.parent/'opening-collector-witness-unit.log').write_text(witness.stdout+witness.stderr)
          receipt.update({'collector_witness_command':witness_command[1:],
                          'collector_witness_exit':witness.returncode})
          (root.parent/'opening-instrumented-receipt.json').write_text(json.dumps(receipt,indent=2))
          assert witness.returncode == 0, 'real collector witness regression failed; see retained log'
          assert '1 passed; 0 failed;' in witness.stdout, witness.stdout
          sdk_name = 'api::view_journey::tests::pinned_default_layer_emits_typed_sdk_metadata_separately_from_journey_fields'
          assert sdk_name + ': test' in listed.stdout
          sdk_command = [str(destination), sdk_name, '--exact', '--nocapture', '--test-threads=1']
          sdk = subprocess.run(sdk_command, capture_output=True, text=True, timeout=120)
          (root.parent/'opening-sdk-metadata-unit.log').write_text(sdk.stdout+sdk.stderr)
          sdk_passed = int('1 passed; 0 failed;' in sdk.stdout)
          receipt.update({'sdk_metadata_command':sdk_command[1:], 'sdk_metadata_exit':sdk.returncode,
                          'sdk_metadata_passed':sdk_passed})
          (root.parent/'opening-instrumented-receipt.json').write_text(json.dumps(receipt,indent=2))
          assert sdk.returncode == 0 and sdk_passed == 1, 'real default SDK layer regression failed or ran zero tests; see retained log'
          production_tests = [
              'api::view_journey::tests::production_attribute_capacity_preserves_complete_ready_collector_schema',
              'logging::tests::otel_limits_are_conservative_and_event_free',
              'logging::tests::otel_filter_is_a_spans_only_allowlist',
          ]
          receipt['production_capacity_tests'] = []
          (root.parent/'opening-production-capacity-unit.log').write_text('')
          for name in production_tests:
              assert name + ': test' in listed.stdout
              command = [str(destination), name, '--exact', '--nocapture', '--test-threads=1']
              outcome = subprocess.run(command, capture_output=True, text=True, timeout=120)
              for metric in re.findall(r'collector_capacity cap=\d+ attributes=\d+ dropped=\d+ otlp_span_bytes=\d+ semantic_kv_bytes=\d+ sdk_kv_bytes=\d+', outcome.stdout):
                  print(metric, flush=True)
              with (root.parent/'opening-production-capacity-unit.log').open('a') as log:
                  log.write(outcome.stdout+outcome.stderr)
              passed = int('1 passed; 0 failed;' in outcome.stdout)
              receipt['production_capacity_tests'].append({'command':command[1:], 'exit':outcome.returncode, 'passed':passed})
              (root.parent/'opening-instrumented-receipt.json').write_text(json.dumps(receipt,indent=2))
              assert outcome.returncode == 0 and passed == 1, 'production capacity/privacy guard failed or ran zero tests; see retained log'
          PY
      - name: Compiler-free instrumented harness regressions
        working-directory: harness
        run: |
          uv run --with opentelemetry-proto==1.39.0 tests/e2e/history_opening_browser.test.py
          uv run tests/e2e/history_controlled_artifact.test.py
          node --test ui/scripts/history-controlled-functional.selftest.mjs
          node --check ui/scripts/qualify-history-controlled-functional.mjs
          node --test ui/scripts/qualify-history-opening-realserver.selftest.mjs
          node --test ui/scripts/history-joint-telemetry.selftest.mjs
          node --test ui/scripts/history-postfault-baseline.selftest.mjs
          node --test ui/scripts/history-opening-navigation.selftest.mjs
          node --test ui/scripts/replay-history-opening-recorder.selftest.mjs
          node --test ui/scripts/global-chapter-cache.selftest.mjs
          test -f ../pinned-app/ui/scripts/view-telemetry-diagnostics.mjs
          node --check ../pinned-app/ui/scripts/qualify-view-telemetry.mjs
          node --check ../pinned-app/ui/scripts/view-telemetry-diagnostics.mjs
          cd ../pinned-app/ui
          pnpm exec vitest run scripts/qualify-view-telemetry.test.mjs scripts/view-telemetry-diagnostics.test.mjs src/hooks/conversationViewDiagnostics.test.ts src/hooks/conversationViewJourney.test.ts src/hooks/conversationViewTelemetry.test.ts src/hooks/conversationViewLifecycle.test.ts src/hooks/useConversationViewJourney.test.tsx qualification/viewReporterBuild.test.ts qualification/viewReporterManifest.test.ts --maxWorkers=2
          cd ../../harness
          node --check ui/scripts/qualify-history-opening-realserver.mjs
      - name: Full UI source qualification at exact pinned app (no filtered retry)
        timeout-minutes: 10
        shell: bash
        working-directory: pinned-app
        run: |
          set -o pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path.cwd(); out=root.parent
          sha=lambda path:hashlib.sha256(path.read_bytes()).hexdigest()
          git=lambda *args:subprocess.check_output(['git','-C',str(root),*args],text=True).strip()
          receipt={'app_source':git('rev-parse','HEAD'),'app_tree':git('rev-parse','HEAD^{tree}'),
                   'app_base':'1f9529c634a074c6ab6ea36eb15ca284770df1a5',
                   'harness_source':subprocess.check_output(['git','-C',str(out/'harness'),'rev-parse','HEAD'],text=True).strip(),
                   'command':'PHOENIX_CHECK_ALL=1 PHOENIX_CHECK_WORKERS=2 ./dev.py check --lanes tsc,ui-lint,vitest',
                   'vitest_config_sha256':sha(root/'ui/vitest.config.ts'),
                   'ui_lock_sha256':sha(root/'ui/pnpm-lock.yaml'),
                   'scope':'full pinned app UI source/tests (tsc,eslint,all Vitest); not ancillary spec/ast-grep group; no filtering/retry/runtime/overhead clearance'}
          (out/'pinned-app-full-ui-receipt.json').write_text(json.dumps(receipt,indent=2))
          PY
          set +e
          PHOENIX_CHECK_ALL=1 PHOENIX_CHECK_WORKERS=2 ./dev.py check --lanes tsc,ui-lint,vitest 2>&1 | tee "$GITHUB_WORKSPACE/pinned-app-full-ui.log"
          ui_status=${PIPESTATUS[0]}
          set -e
          python3 - "$ui_status" <<'PY'
          import json,sys
          from pathlib import Path
          path=Path.cwd().parent/'pinned-app-full-ui-receipt.json'
          receipt=json.loads(path.read_text()); receipt['exit_status']=int(sys.argv[1])
          receipt['result_counts_authority']='retained full console log, not inferred or fabricated'
          path.write_text(json.dumps(receipt,indent=2))
          PY
          exit "$ui_status"
      - name: Prepare owned Chromium for instrumented actual-server witness
        working-directory: pinned-app/ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Exact Linux owned Chrome group, executable shim and real layout qualification
        working-directory: pinned-app
        timeout-minutes: 15
        env:
          CHROME_QUALIFICATION_OUTPUT: ${{ github.workspace }}/owned-chrome-linux
        run: |
          export PHOENIX_CHROME_EXECUTABLE="$(cd ui && node -e 'console.log(require("playwright").chromium.executablePath())')"
          cargo build -p phoenix-tools --bin phoenix-browser
          export PHOENIX_TEST_CHROME=1
          bash "$GITHUB_WORKSPACE/harness/scripts/qualify-owned-chrome-teardown.sh"
      - name: Controlled-functional six-report witness (separate from immutable stock baseline)
        working-directory: harness
        run: |
          chmod 700 ../opening-instrumented-libtest
          uv run --with opentelemetry-proto==1.39.0 tests/e2e/history_opening_browser.py \
            --joint-telemetry --controlled-functional \
            --app-root "$GITHUB_WORKSPACE/pinned-app" \
            --instrumented-exe "$GITHUB_WORKSPACE/opening-instrumented-libtest" \
            --instrumented-receipt "$GITHUB_WORKSPACE/opening-instrumented-receipt.json" \
            --output "$GITHUB_WORKSPACE/opening-browser-evidence" --timeout 420
      - name: Retain receipts on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: opening-codegen-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            opening-codegen-receipt.json
            opening-codegen.log
            opening-coordinator-home-fixture.log
            opening-coordinator-home-fixture-receipt.json
            pinned-app/ui/src/generated/
            opening-instrumented-libtest
            opening-instrumented-receipt.json
            opening-ui-build-owner.json
            pinned-app/ui/stock-natural-build.json
            pinned-app/ui/controlled-functional-build.json
            pinned-app/ui/dist-controlled-functional/
            opening-instrumented-unit.log
            opening-collector-witness-unit.log
            opening-sdk-metadata-unit.log
            opening-production-capacity-unit.log
            opening-instrumented-selector.log
            opening-browser-evidence/
            pinned-app-full-ui.log
            pinned-app-full-ui-receipt.json
            owned-chrome-linux/

  check-ui:
    name: check (ui/specs)
    needs: plan_check
    if: ${{ needs.plan_check.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      PHOENIX_CHECK_ALL: ${{ github.event_name == 'push' && '1' || '' }}
      PHOENIX_CHECK_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
          shared-key: check-ui
          save-if: ${{ github.ref == 'refs/heads/main' }}
          prefix-key: v1-rust
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Upgrade corepack
        run: |
          npm i -g corepack@latest
          corepack enable
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install ast-grep
        run: npm i -g @ast-grep/cli
      - name: Install allium-cli
        env:
          ALLIUM_VERSION: 3.5.0
        run: |
          if ! allium --version 2>/dev/null | grep -q "$ALLIUM_VERSION"; then
            cargo install allium-cli --version "$ALLIUM_VERSION" --locked
          fi
      - name: Configure git identity
        run: |
          git config --global user.email "ci@phoenix-ide.invalid"
          git config --global user.name "Phoenix CI"
      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: ./dev.py check (ui/specs)
        run: ./dev.py check --lanes tsc,ui-lint,vitest,ast-grep,allium,spec-shape,spec-anchors,pkglock

  check-fast:
    name: check (task validation)
    needs: plan_check
    if: ${{ needs.plan_check.outputs.fast == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PHOENIX_CHECK_ALL: ${{ github.event_name == 'push' && '1' || '' }}
      PHOENIX_CHECK_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Test roadmap Issue reducer
        run: node --test scripts/roadmap-issue-reducer.test.mjs
      - name: ./dev.py check (task)
        run: ./dev.py check --lanes task

  notify-main-failure:
    name: Open issue on main CI failure
    needs: [plan_check, check-rust, check-clippy, check-e2e, check-ui, check-fast]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(join(needs.*.result, ','), 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the CI-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CI failing on main"
          number=$(gh issue list --repo "$REPO" --state open --search "$title in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" \
              --body "Still failing at \`$SHA\` — $RUN_URL"
          else
            body=$(printf 'CI is failing on `main`.\n\nFirst seen at `%s`\nRun: %s' "$SHA" "$RUN_URL")
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi

  close-main-failure:
    name: Close CI-failure issue on green
    needs: [plan_check, check-rust, check-clippy, check-e2e, check-ui, check-fast]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(join(needs.*.result, ','), 'failure') && !contains(join(needs.*.result, ','), 'cancelled') && !contains(join(needs.*.result, ','), 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close the open CI-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          title="CI failing on main"
          number=$(gh issue list --repo "$REPO" --state open --search "$title in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "Green again at \`$SHA\`. Closing."
            gh issue close "$number" --repo "$REPO"
          fi
