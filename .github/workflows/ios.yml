name: iOS

# The iOS client is Swift and cannot be covered by ./dev.py check (Linux
# lanes), so it gets its own macOS job: generate the Xcode project from
# project.yml, build, and run the unit-test target on a simulator. Path-
# filtered — Rust/UI-only changes never pay for a macOS runner.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + unit tests (simulator)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios/PhoenixMobile
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[] | .[] | .name | select(startswith("iPhone"))] | first // empty')
          if [ -z "$DEVICE" ]; then
            echo "No available iPhone simulator found" >&2
            xcrun simctl list devices >&2
            exit 1
          fi
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project PhoenixMobile.xcodeproj \
            -scheme PhoenixMobile \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""
