name: Sidebar visual QA
on:
  pull_request:
    paths:
      - 'ui/**'
      - '.github/workflows/sidebar-visual-qa.yml'
permissions:
  contents: read
jobs:
  sidebar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - run: corepack enable && corepack prepare pnpm@11.0.8 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: Typecheck and sidebar regressions
        working-directory: ui
        run: |
          pnpm exec tsc --noEmit
          pnpm exec vitest run src/fixtures/sidebar/scenarios.test.ts src/components/Sidebar.test.tsx src/components/ConversationList.test.tsx
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: ui
      - name: Capture unchanged-product baseline with identical fixture
        working-directory: ui
        env:
          PHOENIX_LADLE: '1'
          CAPTURE_STORIES: sidebar-visual-normal,sidebar-visual-narrow
          SIDEBAR_VISUAL_BASELINE: '1'
          SIDEBAR_QA_OUT: qa-artifacts/sidebar/before
        run: |
          cp src/components/ConversationList.css /tmp/sidebar-list-fixed.css
          cp src/components/Sidebar.css /tmp/sidebar-fixed.css
          cp src/components/EmberEntry.css /tmp/sidebar-ember-fixed.css
          trap 'cp /tmp/sidebar-list-fixed.css src/components/ConversationList.css; cp /tmp/sidebar-fixed.css src/components/Sidebar.css; cp /tmp/sidebar-ember-fixed.css src/components/EmberEntry.css' EXIT
          git show 6cebf545fe6d16ed02c134a873ab254fea3ad29b:ui/src/components/ConversationList.css > src/components/ConversationList.css
          git show 6cebf545fe6d16ed02c134a873ab254fea3ad29b:ui/src/components/EmberEntry.css > src/components/EmberEntry.css
          : > src/components/Sidebar.css
          for viewport in desktop touch; do
            CAPTURE_VIEWPORT="$viewport" node scripts/capture-sidebar.mjs
          done
      - name: Capture sidebar geometry
        working-directory: ui
        env:
          PHOENIX_LADLE: '1'
          CAPTURE_STORIES: sidebar-visual-normal,sidebar-visual-narrow
          SIDEBAR_QA_OUT: qa-artifacts/sidebar/after
        run: |
          for viewport in desktop touch; do
            CAPTURE_VIEWPORT="$viewport" node scripts/capture-sidebar.mjs
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sidebar-visual-qa
          path: ui/qa-artifacts/sidebar/
          if-no-files-found: error
