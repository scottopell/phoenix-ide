name: Bash launch settlement

# macOS-only: CI's rust lane runs these tests on Linux with the native launcher
# required. This job is the only CI that compiles the macOS process-identity
# and launcher paths (ADR-213).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'crates/phoenix-core/src/process_identity.rs'
      - 'crates/phoenix-core/src/platform.rs'
      - 'crates/phoenix-tools/src/bash.rs'
      - 'crates/phoenix-tools/src/bash/**'
      - 'crates/phoenix-ide/src/main.rs'
      - 'crates/phoenix-ide/src/runtime/close_retirement.rs'
      - '.github/workflows/bash-launch.yml'
  push:
    branches: [main]
    paths:
      - 'crates/phoenix-core/src/process_identity.rs'
      - 'crates/phoenix-core/src/platform.rs'
      - 'crates/phoenix-tools/src/bash.rs'
      - 'crates/phoenix-tools/src/bash/**'
      - 'crates/phoenix-ide/src/main.rs'
      - 'crates/phoenix-ide/src/runtime/close_retirement.rs'
      - '.github/workflows/bash-launch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bash-launch-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fault-tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Bash launch faults (macos-latest, exact head)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      PHOENIX_BASH_LAUNCH_TEST_EXE: ${{ github.workspace }}/target/debug/phoenix_ide
      PHOENIX_BASH_LAUNCH_TEST_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bash-launch-macos
          prefix-key: v1-rust
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build native launcher executable
        run: |
          cargo build -p phoenix_ide --bin phoenix_ide
          test -x "$PHOENIX_BASH_LAUNCH_TEST_EXE"
      # One invocation: a second one recompiled phoenix-db and phoenix_ide.
      - name: Launch, identity, and Close writer regressions
        run: |
          cat > "$RUNNER_TEMP/nextest.toml" <<'TOML'
          [profile.default]
          fail-fast = false

          [test-groups]
          serial-runtime = { max-threads = 1 }

          [[profile.default.overrides]]
          filter = 'package(phoenix_ide)'
          test-group = 'serial-runtime'
          TOML
          cargo nextest --config-file "$RUNNER_TEMP/nextest.toml" run \
            -p phoenix-core -p phoenix-tools -p phoenix_ide --lib -j 1 --success-output final -E '
              (package(phoenix-core) and (test(process_identity::tests) or test(domain::tool_wire::bash_tmux_wire_tests)))
              or (package(phoenix-tools) and (test(bash::operations::tests) or test(bash::launch_protocol::tests)
                or test(bash::ring::tests) or test(bash::registry::tests) or test(bash::reaper::tests)
                or test(bash::handle::native_retirement::tests)))
              or (package(phoenix_ide) and (test(browser_retirement)
                or test(coordinator_bash_executes_owned_home_with_zero_ordinary_conversations)
                or test(real_bash_wait_zero_and_normal_bounds_preserve_child_without_replay)
                or test(conversation_runtime_dispatches_real_zero_and_normal_bash_waits)
                or test(macos_disposable_writer_scan_finds_same_user_process_cwd)
                or test(macos_vnode_fd_read_unavailable_is_not_a_changed_sample)
                or test(macos_process_inventory_excludes_foreign_uid_before_inspection)
                or test(selected_macos_pid_with_changed_uid_fails_closed_as_process_changed)
                or test(process_disappearance_and_pid_reuse_are_gaps_not_writers_or_clean)
                or test(macos_process_inventory_failures_are_absent_evidence)
                or test(expired_macos_process_inventory_stops_before_listing)
                or test(macos_process_inventory_retries_full_buffer_and_accepts_complete_list)
                or test(macos_disposable_detached_worktree_retires_with_real_writer_scans)))'
