name: Bash launch settlement

on:
  pull_request:
    paths:
      - 'crates/phoenix-tools/src/bash/**'
      - 'crates/phoenix-core/src/process_identity.rs'
      - 'crates/phoenix-core/src/domain/tool_wire.rs'
      - '.github/workflows/bash-launch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fault-tests:
    name: Bash launch faults (${{ matrix.os }}, exact head)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: Generate wire contracts
        run: ./dev.py codegen
      - name: Fault-injected launch and identity regressions
        run: |
          cargo test -p phoenix-core process_identity::tests
          cargo test -p phoenix-tools bash::operations::tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bash-wire-${{ matrix.os }}
          path: ui/src/generated/
