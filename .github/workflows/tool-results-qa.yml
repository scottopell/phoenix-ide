name: Tool results rendered QA
on:
  pull_request:
    paths:
      - 'ui/**'
      - '.github/workflows/tool-results-qa.yml'
permissions:
  contents: read
jobs:
  tool-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Materialize integration tree against PR base
        env:
          INTEGRATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          printf '%s\n' "$INTEGRATION_BASE" > /tmp/tool-results-base.txt
          git fetch --no-tags origin "$INTEGRATION_BASE"
          git -c user.name='Hosted QA' -c user.email='qa@example.invalid' merge --no-commit --no-ff FETCH_HEAD
          git write-tree | tee /tmp/tool-results-merge-tree.txt
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - run: corepack enable
      - run: corepack prepare pnpm@11.0.8 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - name: Qualify shared rendering and commenting integration
        working-directory: ui
        run: |
          pnpm exec tsc --noEmit
          pnpm exec vitest run src/components/MessageComponents.test.tsx src/components/AssistantMessageChrome.test.tsx src/components/DraftAnnotationCards.test.tsx src/components/InlineMessageReaction.test.tsx src/components/ReactionPill.test.tsx src/components/InputArea.test.tsx src/conversation/AnnotationDraftStore.test.ts src/fixtures/toolResults/scenarios.test.ts
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: ui
      - name: Capture same-fixture empty-toolbar control
        working-directory: ui
        env:
          CAPTURE_STORIES: mobile-spacing-compact
          TOOL_RESULTS_BASELINE: '1'
          TOOL_RESULTS_QA_OUT: qa-artifacts/tool-results/before
        run: |
          cp src/components/MessageComponents.tsx /tmp/MessageComponents.fixed.tsx
          trap 'cp /tmp/MessageComponents.fixed.tsx src/components/MessageComponents.tsx' EXIT
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'src/components/MessageComponents.tsx';
          const source = readFileSync(file, 'utf8');
          const predicate = '!(suppressMessageCopy && visibleToolUseId && !isFirstInTurn)';
          if (source.split(predicate).length !== 2) throw new Error('expected exactly one selected-tool chrome predicate');
          writeFileSync(file, source.replace(predicate, 'true'));
          JS
          PHOENIX_LADLE=1 node scripts/capture-tool-results.mjs
      - name: Capture synthetic expanded tools
        run: PHOENIX_LADLE=1 node scripts/capture-tool-results.mjs
        working-directory: ui
        env:
          CAPTURE_STORIES: mobile-spacing-compact
      - name: Record integration provenance
        if: always()
        run: |
          mkdir -p ui/qa-artifacts/tool-results
          cp /tmp/tool-results-merge-tree.txt ui/qa-artifacts/tool-results/merge-tree.txt
          cp /tmp/tool-results-base.txt ui/qa-artifacts/tool-results/integration-base.txt
          git rev-parse HEAD > ui/qa-artifacts/tool-results/pr-head.txt
          git diff --name-status HEAD > ui/qa-artifacts/tool-results/main-integration-files.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tool-results-rendered-qa
          path: ui/qa-artifacts/tool-results/
          if-no-files-found: error
