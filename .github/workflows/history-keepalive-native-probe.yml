name: Synthetic keepalive native isolation

on:
  push:
    branches: [qualification/history-keepalive-native-probe]

permissions:
  contents: read

jobs:
  probe:
    name: four-cell synthetic transport probe (not joint qualification)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Attest exact probe source
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          node - <<'NODE' > probe-source.json
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const crypto = require('node:crypto');
          const files = ['ui/scripts/probe-view-keepalive.mjs', 'ui/scripts/probe-view-keepalive.test.mjs'];
          const sha = data => crypto.createHash('sha256').update(data).digest('hex');
          const hashes = Object.fromEntries(files.map(file => {
            if (!fs.lstatSync(file).isFile() || fs.lstatSync(file).isSymbolicLink()) throw new Error('invalid probe source');
            const actual = fs.readFileSync(file);
            if (!actual.equals(cp.execFileSync('git', ['show', 'HEAD:' + file]))) throw new Error('probe source mismatch');
            return [file, sha(actual)];
          }));
          console.log(JSON.stringify({scope: 'synthetic_direct_keepalive_isolation_not_app_qualification', source: cp.execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim(), tree: cp.execFileSync('git', ['rev-parse', 'HEAD^{tree}'], {encoding: 'utf8'}).trim(), hashes}, null, 2));
          NODE
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install frozen probe dependencies (hosted only)
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Offline probe controls
        working-directory: ui
        run: |
          node --check scripts/probe-view-keepalive.mjs
          node --check scripts/probe-view-keepalive.test.mjs
          node node_modules/vitest/vitest.mjs run --maxWorkers 2 scripts/probe-view-keepalive.test.mjs
      - name: Install Chromium (hosted only)
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Run exactly one four-cell synthetic experiment
        working-directory: ui
        run: timeout --signal=TERM --kill-after=5s 75s node scripts/probe-view-keepalive.mjs --run-native > ../probe-receipt.json
      - name: Preserve bounded experiment receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-keepalive-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            probe-source.json
            probe-receipt.json
          if-no-files-found: error
          retention-days: 7
