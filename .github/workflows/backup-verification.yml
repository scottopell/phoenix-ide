name: Backup verification scale qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Focused backup helper regressions
        run: >-
          uv run --no-project --managed-python --python 3.13 python -m unittest
          tests.devpy.test_simple_launchd_helper
      - name: Qualify populated large-database backup verification
        timeout-minutes: 40
        run: >-
          uv run --no-project --managed-python --python 3.13 python
          tests/integration/backup_verification_scale.py
          --work-dir "$RUNNER_TEMP/backup-verification-scale"
          --result "$GITHUB_WORKSPACE/backup-verification-result.json"
      - name: Record runner identity and commit if qualification failed early
        if: always()
        run: |
          if [ ! -f backup-verification-result.json ]; then
            uv run --no-project --managed-python --python 3.13 python - <<'PY'
          import json, os, platform, sqlite3, sys
          from pathlib import Path
          Path("backup-verification-result.json").write_text(json.dumps({
              "qualification": "large populated SQLite backup verification",
              "status": "failed before result was written",
              "commit": os.environ.get("GITHUB_SHA"),
              "runner": {"os": platform.platform(), "machine": platform.machine(),
                         "python": sys.version, "sqlite": sqlite3.sqlite_version},
          }, indent=2) + "\n")
          PY
          fi
          cat backup-verification-result.json
      - name: Upload failure-safe qualification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-verification-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: backup-verification-result.json
          if-no-files-found: error
          retention-days: 30
      - name: Assert exact checked-out commit
        if: always()
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
