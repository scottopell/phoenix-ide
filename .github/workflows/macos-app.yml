name: macOS app

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "macos/Phoenix/**"
      - "crates/phoenix-ide/src/api/deployment.rs"
      - "crates/phoenix-ide/build.rs"
      - "crates/phoenix-ide/Cargo.toml"
      - "crates/phoenix-ide/src/api/installation_ownership.rs"
      - "crates/phoenix-ide/src/lib.rs"
      - "dev.py"
      - "scripts/launchd_deploy_helper.py"
      - "tests/devpy/test_launchd_deploy.py"
      - "tests/devpy/test_current_schema_prepared_upgrade.py"
      - "ui/src/generated/DeploymentInfo.ts"
      - ".github/workflows/macos-app.yml"
      - ".github/workflows/release.yml"
      - "scripts/publish-release-assets.sh"
      - "scripts/sign-notarize-browser-cli.sh"
      - "scripts/release_version.py"
      - "scripts/test_release_version.py"
      - "scripts/verify-published-release.sh"
      - "scripts/test-desktop-release-workflow.py"
      - "scripts/check-signed-helper.cjs"
      - "scripts/test-check-signed-helper.cjs"
      - "scripts/test-publish-release-assets.sh"
      - "scripts/test-verify-published-release.sh"
  push:
    branches: [main, qualification/current-task-observation-2702]
    paths:
      - "macos/Phoenix/**"
      - "crates/phoenix-ide/src/api/deployment.rs"
      - "crates/phoenix-ide/build.rs"
      - "crates/phoenix-ide/Cargo.toml"
      - "crates/phoenix-ide/src/api/installation_ownership.rs"
      - "crates/phoenix-ide/src/lib.rs"
      - "dev.py"
      - "scripts/launchd_deploy_helper.py"
      - "tests/devpy/test_launchd_deploy.py"
      - "tests/devpy/test_current_schema_prepared_upgrade.py"
      - "ui/src/generated/DeploymentInfo.ts"
      - ".github/workflows/macos-app.yml"
      - ".github/workflows/release.yml"
      - "scripts/publish-release-assets.sh"
      - "scripts/sign-notarize-browser-cli.sh"
      - "scripts/release_version.py"
      - "scripts/test_release_version.py"
      - "scripts/verify-published-release.sh"
      - "scripts/test-desktop-release-workflow.py"
      - "scripts/check-signed-helper.cjs"
      - "scripts/test-check-signed-helper.cjs"
      - "scripts/test-publish-release-assets.sh"
      - "scripts/test-verify-published-release.sh"

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.ref != 'refs/heads/qualification/current-task-observation-2702'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
      - name: Test typed macOS core
        run: swift test --package-path macos/Phoenix
      - name: Test sidecar and desktop release packaging contracts
        run: |
          macos/Phoenix/scripts/test-package-sidecar.sh
          macos/Phoenix/scripts/test-package-desktop-release.sh
          scripts/test-publish-release-assets.sh
          scripts/test-verify-published-release.sh
          python3 scripts/test-desktop-release-workflow.py
          node --test scripts/test-check-signed-helper.cjs
          python3 scripts/test_release_version.py
      - name: Test launchd deployment controller
        run: python3 -m unittest tests.devpy.test_launchd_deploy tests.devpy.test_current_schema_prepared_upgrade
      - name: Build a real unsigned Release package
        run: |
          version=$(grep -m1 '^version' crates/phoenix-ide/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          full_commit=$(git rev-parse HEAD)
          host_arch=$(uname -m)
          case "$host_arch" in
            arm64) target=aarch64-apple-darwin ;;
            x86_64) target=x86_64-apple-darwin ;;
            *) echo "unsupported macOS runner architecture: $host_arch" >&2; exit 1 ;;
          esac
          cat > "$RUNNER_TEMP/phoenix_fixture.c" <<'EOF'
          #include <stdio.h>
          #include <string.h>
          int main(int argc, char **argv) {
            if (argc == 2 && strcmp(argv[1], "--build-identity") == 0) {
              printf("{\"version\":\"@VERSION@\",\"git_sha\":\"@GIT_SHA@\"}\n");
              return 0;
            }
            return 0;
          }
          EOF
          python3 - "$RUNNER_TEMP/phoenix_fixture.c" "$version" "$full_commit" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          source = path.read_text().replace("@VERSION@", sys.argv[2]).replace("@GIT_SHA@", sys.argv[3])
          path.write_text(source)
          PY
          clang -arch "$host_arch" "$RUNNER_TEMP/phoenix_fixture.c" -o "$RUNNER_TEMP/phoenix_ide"
          macos/Phoenix/scripts/package-desktop-release.sh \
            --unsigned-test \
            "$RUNNER_TEMP/phoenix_ide" \
            "$target" \
            "v$version" \
            "$full_commit" \
            "$RUNNER_TEMP/unsigned-package"
          test -f "$RUNNER_TEMP/unsigned-package/Phoenix-macos-$target-v$version.zip"
      - name: Build attached-capable Debug app
        run: |
          xcodebuild \
            -project macos/Phoenix/Phoenix.xcodeproj \
            -scheme Phoenix \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/phoenix-macos-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify Release requires a sidecar
        run: |
          set +e
          xcodebuild \
            -project macos/Phoenix/Phoenix.xcodeproj \
            -scheme Phoenix \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/phoenix-macos-release" \
            CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/release-without-sidecar.log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F "Release builds require PHOENIX_SIDECAR_PATH" "$RUNNER_TEMP/release-without-sidecar.log"

  readonly-projection-contract:
    if: github.ref == 'refs/heads/qualification/current-task-observation-2702'
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
      RUST_TEST_THREADS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the single exact candidate and fetch both parity authorities
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/observation-qualification/candidate"
          mkdir -p "$output/bin"
          git rev-parse HEAD HEAD^{tree} > "$output/qualifier-source.txt"
          candidate=bef36e9e4f482b532ebfd53900f3b3f42448a805
          attribution_base=2702d8389c2fc78ac2e528c876c35a1a7040d692
          base=f3893088b3cb224be9403f600173d5216e3a2f6b
          product=9ee218d4a33ebd4b94ea547d60caa62134edb960
          git fetch origin "$candidate" "$attribution_base" "$base" "$product"
          git checkout --detach "$candidate"
          test "$(git rev-parse HEAD)" = "$candidate"
          test "$(git rev-parse HEAD^{tree})" = 1f618295fc974725cbf0d9136a934f78a8a4ba6b
          git rev-parse HEAD HEAD^{tree} > "$output/source.txt"
          git rev-parse "$base" "$base^{tree}" "$product" "$product^{tree}" "$attribution_base" "$attribution_base^{tree}" > "$output/parity-authorities.txt"
          cp docs/conversation-observation-source-parity.json docs/conversation-observation-composition.md docs/conversation-observation-attribution.md docs/conversation-observation-attribution.json "$output/"
          printf '%s\n' 'Single exact current candidate; no baseline or comparative measurement.' 'Hosted synthetic private-cwd contracts only; no real DB, provider, fixture upload, browser or production acceptance.' > "$output/scope.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: readonly-projection-macos
      - name: Enable the existing pinned pnpm toolchain
        id: pnpm
        working-directory: ui
        run: |
          npm install -g corepack@latest
          corepack enable
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: current-task-ui-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ui/pnpm-lock.yaml') }}
      - name: Build exact candidate UI assets needed by the Rust embed
        working-directory: ui
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/observation-qualification/candidate"
          pnpm install --frozen-lockfile 2>&1 | tee "$output/pnpm-install.log"
          pnpm run build 2>&1 | tee "$output/ui-build.log"
          (cd dist && find . -type f -exec shasum -a 256 {} \; | sort) > "$output/ui-dist-sha256.txt"
      - name: Require focused current UI contracts and exact source parity
        working-directory: ui
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/observation-qualification/candidate"
          tests=(
            tests/observationSourceParity.test.ts
            src/pages/PersistedObservation.test.tsx
            src/App.alias.test.tsx
            src/App.markdownNavigation.test.tsx
            src/components/ConversationNavStack.test.tsx
            src/components/ConversationNavStack.readiness.test.tsx
            src/components/MessageList.test.tsx
            src/pages/CoordinatorPage.test.tsx
            src/pages/ProductConversationPage.test.tsx
            src/hooks/conversationViewLifecycle.test.ts
            src/hooks/useConversationViewJourney.test.tsx
          )
          set +e
          pnpm exec vitest run "${tests[@]}" --maxWorkers=1 --reporter=default --reporter=json --outputFile.json="$output/ui-tests.json" 2>&1 | tee "$output/ui-tests.log"
          test_exit=${PIPESTATUS[0]}
          set -e
          export REPORT="$output/ui-tests.json" TEST_EXIT="$test_exit"
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.environ['REPORT']))
          assert os.environ['TEST_EXIT']=='0' and d['success'] and d['numFailedTests']==0
          suites=d['testResults'];assert len(suites)==11,suites
          tests=[test for suite in suites for test in suite['assertionResults']]
          assert len(tests)==d['numTotalTests']==d['numPassedTests'] and tests
          assert all(suite['status']=='passed' and not suite.get('testExecError') for suite in suites)
          assert all(test['status']=='passed' for test in tests)
          assert not d.get('numPendingTests',0) and not d.get('numTodoTests',0) and not d.get('numRuntimeErrorTestSuites',0)
          assert not d.get('unhandledErrors') and not d.get('testExecError')
          PY
      - name: Require exact attribution source guards and existing mock launcher contracts
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/observation-qualification/candidate"
          python3 tests/devpy/test_observation_attribution_source.py -v 2>&1 | tee "$output/attribution-source-guards.log"
          grep -E '^Ran 7 tests in ' "$output/attribution-source-guards.log"
          grep -Fx 'OK' "$output/attribution-source-guards.log"
          python3 tests/devpy/test_observe.py -v 2>&1 | tee "$output/observation-mock-contracts.log"
          grep -E '^Ran 8 tests in ' "$output/observation-mock-contracts.log"
          grep -Fx 'OK' "$output/observation-mock-contracts.log"
      - name: Require eight exact attribution and observation authority lib contracts
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/observation-qualification/candidate"
          tests=(
            observation_startup::attribution_tests::closes_associated_success_error_and_denial_before_body_drain
            observation_startup::attribution_tests::cancellation_closes_request_and_child_without_claiming_response_ready
            observation_startup::attribution_tests::startup_dispatch_captures_actual_product_detail_without_inheriting_default
            observation_startup::attribution_tests::scoped_subscriber_does_not_replace_existing_default_or_log_unmatched_path
            api::application_state::tests::observation_requires_direct_loopback_even_for_public_routes
            api::application_state::tests::observation_cannot_extract_live_authority
            api::application_state::tests::shared_route_lookup_is_target_scoped
            api::application_state::tests::normal_routes_reject_live_operations_in_observation_composition
          )
          for selector in "${tests[@]}"; do
            log="$output/${selector##*::}.log"
            cargo test -p phoenix_ide --lib --features portable-ui "$selector" -- --exact --nocapture --test-threads=1 2>&1 | tee "$log"
            grep -F 'test result: ok. 1 passed; 0 failed;' "$log"
          done
          grep -o 'observation_attribution_sample=.*' "$output/startup_dispatch_captures_actual_product_detail_without_inheriting_default.log" > "$output/synthetic-attribution-sample.txt"
          python3 - "$output/synthetic-attribution-sample.txt" <<'PY'
          import collections,json,sys
          from pathlib import Path
          lines=Path(sys.argv[1]).read_text().splitlines()
          assert len(lines)==1
          records=json.loads(lines[0].removeprefix('observation_attribution_sample='))
          assert isinstance(records,list) and records and 'SECRET' not in json.dumps(records)
          expected={
              'observation.request','observation.authorization','replay.admission',
              'observation.resolve_ordinary','observation.get_aggregate','observation.require_member',
              'observation.member.resolve_ordinary','observation.member.get_aggregate',
              'product_conversation.detail_get','product_conversation.post_snapshot_projection',
              'product_conversation.pool_wait','product_conversation.begin_read',
              'product_conversation.resolve','product_conversation.aggregate',
              'product_conversation.close','product_conversation.message_page',
              'product_conversation.snapshot_read','product_conversation.rollback_read',
              'observation.db.product','observation.db.topology',
              'observation.db.read_member','observation.db.source',
          }
          counts=collections.Counter(record['span']['name'] for record in records)
          assert set(counts)==expected and counts['observation.request']==1
          root=next(record['span'] for record in records if record['span']['name']=='observation.request')
          assert root['route']=='/api/product-conversations/:reference'
          assert root['status']==200 and root['response_ready'] is True and type(root['request_id']) is int
          for record in records:
              assert record['fields']['message']=='close'
              assert isinstance(record['timestamp'],str)
              assert all(isinstance(record['fields'][key],str) for key in ['time.busy','time.idle'])
              for span in [record['span'],*record.get('spans',[])]:
                  assert set(span)<={'name','request_id','route','status','response_ready','open.id','product.reference'}
              if record['span']['name']!='observation.request':
                  assert any(span.get('name')=='observation.request' and span.get('request_id')==root['request_id'] for span in record['spans'])
          print('synthetic attribution receipt: privacy, names, counts and request ancestry passed',json.dumps(counts,sort_keys=True))
          PY
      - name: Require real-binary startup and private-cwd portable asset contracts then retain one binary
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/observation-qualification/candidate"
          # Refresh the embed owner after restoring the Rust cache.
          touch crates/phoenix-ide/src/api/assets.rs
          git diff --exit-code
          cargo test -p phoenix_ide --features portable-ui --test observation_startup -- --skip portable_ui_serves_exact_built_entry_assets_from_private_cwd --test-threads=1 --nocapture 2>&1 | tee "$output/startup-contracts.log"
          grep -F 'test result: ok. 4 passed; 0 failed;' "$output/startup-contracts.log"
          cargo test -p phoenix_ide --features portable-ui --test observation_startup portable_ui_serves_exact_built_entry_assets_from_private_cwd -- --exact --test-threads=1 --nocapture 2>&1 | tee "$output/portable-ui.log"
          grep -F 'test result: ok. 1 passed; 0 failed;' "$output/portable-ui.log"
          grep -F 'portable_ui_asset_manifest=' "$output/portable-ui.log" > "$output/served-manifest.txt"
          cargo build -p phoenix_ide --bin phoenix_ide --features portable-ui 2>&1 | tee "$output/binary-build.log"
          cp target/debug/phoenix_ide "$output/bin/"
          shasum -a 256 "$output/bin/phoenix_ide" > "$output/binary-sha256.txt"
          (cd ui/dist && find . -type f -exec shasum -a 256 {} \; | sort) > "$output/ui-dist-sha256.txt"
          printf '%s\n' 'portable-ui=rust-embed/debug-embed; same source backend and immutable current wire/capabilities' > "$output/features.txt"
      - name: Retain source-only qualification logs, never fixture data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-task-observation-attribution-bef36-portable
          path: ${{ runner.temp }}/observation-qualification/
          if-no-files-found: warn
          retention-days: 7
