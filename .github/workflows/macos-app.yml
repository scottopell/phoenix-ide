name: macOS app

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "macos/Phoenix/**"
      - "crates/phoenix-ide/src/api/deployment.rs"
      - "crates/phoenix-ide/build.rs"
      - "crates/phoenix-ide/Cargo.toml"
      - "crates/phoenix-ide/src/api/installation_ownership.rs"
      - "crates/phoenix-ide/src/lib.rs"
      - "dev.py"
      - "scripts/launchd_deploy_helper.py"
      - "tests/devpy/test_launchd_deploy.py"
      - "tests/devpy/test_current_schema_prepared_upgrade.py"
      - "ui/src/generated/DeploymentInfo.ts"
      - ".github/workflows/macos-app.yml"
      - ".github/workflows/release.yml"
      - "scripts/publish-release-assets.sh"
      - "scripts/sign-notarize-browser-cli.sh"
      - "scripts/release_version.py"
      - "scripts/test_release_version.py"
      - "scripts/verify-published-release.sh"
      - "scripts/test-desktop-release-workflow.py"
      - "scripts/check-signed-helper.cjs"
      - "scripts/test-check-signed-helper.cjs"
      - "scripts/test-publish-release-assets.sh"
      - "scripts/test-verify-published-release.sh"
  push:
    branches: [main, qualification/history-observation-projection]
    paths:
      - "macos/Phoenix/**"
      - "crates/phoenix-ide/src/api/deployment.rs"
      - "crates/phoenix-ide/build.rs"
      - "crates/phoenix-ide/Cargo.toml"
      - "crates/phoenix-ide/src/api/installation_ownership.rs"
      - "crates/phoenix-ide/src/lib.rs"
      - "dev.py"
      - "scripts/launchd_deploy_helper.py"
      - "tests/devpy/test_launchd_deploy.py"
      - "tests/devpy/test_current_schema_prepared_upgrade.py"
      - "ui/src/generated/DeploymentInfo.ts"
      - ".github/workflows/macos-app.yml"
      - ".github/workflows/release.yml"
      - "scripts/publish-release-assets.sh"
      - "scripts/sign-notarize-browser-cli.sh"
      - "scripts/release_version.py"
      - "scripts/test_release_version.py"
      - "scripts/verify-published-release.sh"
      - "scripts/test-desktop-release-workflow.py"
      - "scripts/check-signed-helper.cjs"
      - "scripts/test-check-signed-helper.cjs"
      - "scripts/test-publish-release-assets.sh"
      - "scripts/test-verify-published-release.sh"

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.ref != 'refs/heads/qualification/history-observation-projection'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
      - name: Test typed macOS core
        run: swift test --package-path macos/Phoenix
      - name: Test sidecar and desktop release packaging contracts
        run: |
          macos/Phoenix/scripts/test-package-sidecar.sh
          macos/Phoenix/scripts/test-package-desktop-release.sh
          scripts/test-publish-release-assets.sh
          scripts/test-verify-published-release.sh
          python3 scripts/test-desktop-release-workflow.py
          node --test scripts/test-check-signed-helper.cjs
          python3 scripts/test_release_version.py
      - name: Test launchd deployment controller
        run: python3 -m unittest tests.devpy.test_launchd_deploy tests.devpy.test_current_schema_prepared_upgrade
      - name: Build a real unsigned Release package
        run: |
          version=$(grep -m1 '^version' crates/phoenix-ide/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          full_commit=$(git rev-parse HEAD)
          host_arch=$(uname -m)
          case "$host_arch" in
            arm64) target=aarch64-apple-darwin ;;
            x86_64) target=x86_64-apple-darwin ;;
            *) echo "unsupported macOS runner architecture: $host_arch" >&2; exit 1 ;;
          esac
          cat > "$RUNNER_TEMP/phoenix_fixture.c" <<'EOF'
          #include <stdio.h>
          #include <string.h>
          int main(int argc, char **argv) {
            if (argc == 2 && strcmp(argv[1], "--build-identity") == 0) {
              printf("{\"version\":\"@VERSION@\",\"git_sha\":\"@GIT_SHA@\"}\n");
              return 0;
            }
            return 0;
          }
          EOF
          python3 - "$RUNNER_TEMP/phoenix_fixture.c" "$version" "$full_commit" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          source = path.read_text().replace("@VERSION@", sys.argv[2]).replace("@GIT_SHA@", sys.argv[3])
          path.write_text(source)
          PY
          clang -arch "$host_arch" "$RUNNER_TEMP/phoenix_fixture.c" -o "$RUNNER_TEMP/phoenix_ide"
          macos/Phoenix/scripts/package-desktop-release.sh \
            --unsigned-test \
            "$RUNNER_TEMP/phoenix_ide" \
            "$target" \
            "v$version" \
            "$full_commit" \
            "$RUNNER_TEMP/unsigned-package"
          test -f "$RUNNER_TEMP/unsigned-package/Phoenix-macos-$target-v$version.zip"
      - name: Build attached-capable Debug app
        run: |
          xcodebuild \
            -project macos/Phoenix/Phoenix.xcodeproj \
            -scheme Phoenix \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/phoenix-macos-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify Release requires a sidecar
        run: |
          set +e
          xcodebuild \
            -project macos/Phoenix/Phoenix.xcodeproj \
            -scheme Phoenix \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/phoenix-macos-release" \
            CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/release-without-sidecar.log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F "Release builds require PHOENIX_SIDECAR_PATH" "$RUNNER_TEMP/release-without-sidecar.log"

  readonly-projection-contract:
    if: github.ref == 'refs/heads/qualification/history-observation-projection'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
      RUST_TEST_THREADS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: readonly-projection-macos
      - name: Build exact existing UI assets needed by the Rust embed
        working-directory: ui
        run: |
          npm install -g corepack@latest
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Admit exact causal source and preserved runtime qualification
        run: |
          set -o pipefail
          git diff --exit-code 631d924fdc37e8a6162651f612a3452fa96f6c6e HEAD -- crates ui dev.py docs specs tests
          mkdir -p "$RUNNER_TEMP/observation-qualification"
          printf '%s\n' 'Scoped successor to39045775405: runtime contracts, codegen136, UI and binary passed there; only unused db accessor failed Clippy.' 'Prior scoped39048649141 passed accessor Clippy and generated consumers. This successor proves portable-ui embedded HTML/entry JS and packages same-feature binary; no fixture/export qualification is claimed.' > "$RUNNER_TEMP/observation-qualification/scope.txt"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/observation-qualification/source.txt"
      - name: Check actual generated type consumers
        working-directory: ui
        run: |
          pnpm exec tsc -b --noEmit
          pnpm exec vitest run src/pages/PersistedObservation.test.tsx --maxWorkers=1
      - name: Prove portable embedded UI from private cwd
        run: |
          set -o pipefail
          cargo test -p phoenix_ide --features portable-ui --test observation_startup portable_ui_serves_exact_built_entry_assets_from_private_cwd -- --exact --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/observation-qualification/portable-ui.log"
          grep -F 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/observation-qualification/portable-ui.log"
          grep -F 'portable_ui_asset_manifest=' "$RUNNER_TEMP/observation-qualification/portable-ui.log" > "$RUNNER_TEMP/observation-qualification/portable-ui-served-manifest.txt"
      - name: Package same-feature existing executable and exact built UI hashes
        run: |
          cargo build -p phoenix_ide --bin phoenix_ide --features portable-ui
          mkdir -p "$RUNNER_TEMP/observation-qualification/bin"
          cp target/debug/phoenix_ide "$RUNNER_TEMP/observation-qualification/bin/"
          shasum -a 256 "$RUNNER_TEMP/observation-qualification/bin/phoenix_ide" > "$RUNNER_TEMP/observation-qualification/binary-sha256.txt"
          (cd ui/dist && find . -type f -exec shasum -a 256 {} \; | sort) > "$RUNNER_TEMP/observation-qualification/ui-dist-sha256.txt"
          printf '%s\n' 'portable-ui=rust-embed/debug-embed; default debug assets failure retained; no fixture data included' > "$RUNNER_TEMP/observation-qualification/portable-build.txt"
      - name: Check portable feature with Clippy
        run: cargo clippy -p phoenix_ide --features portable-ui --lib --tests -- -D warnings
      - name: Retain source-only qualification logs, never fixture data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readonly-projection-first-unit-contract
          path: |
            ${{ runner.temp }}/projection-contract.log
            ${{ runner.temp }}/projection-owning.log
            ${{ runner.temp }}/observation-qualification/
          if-no-files-found: warn
          retention-days: 7
